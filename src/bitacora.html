<title>Atleta Híbrido</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@500;600;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: una columna para el celular. Arriba el día, después la orden, cómo amaneciste y las sesiones plegables; navegación fija abajo. */
:root{
  /* Mundo único: gimnasio de noche y cancha con focos. Grafito, verde lima de energía y rojo de esfuerzo. */
  --bg:#0D0F12; --paper:#16191E; --paper2:#1C2027; --ink:#F1F3F5; --muted:#9BA3AE; --line:#2A2F38;
  --accent:#C6F135; --accent-ink:#141A04; --ok:#3DDC84; --warn:#FFB020; --bad:#FF5A4E; --chip:#222730;
  --grid:rgba(155,163,174,.05);
  --f-display:"Bebas Neue","Impact","Arial Narrow",sans-serif;
  --f-body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-label:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{background:var(--bg);color:var(--ink)}
body{background-color:var(--bg);background-image:radial-gradient(120% 60% at 50% -10%,rgba(198,241,53,.08),transparent 60%),linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:auto,36px 36px,36px 36px;background-attachment:fixed}
body{font-family:var(--f-body);font-size:16px;line-height:1.45;padding:0 16px calc(150px + env(safe-area-inset-bottom,0px))}
.wrap{max-width:640px;margin:0 auto;padding-block:14px 24px;display:flex;flex-direction:column;gap:14px}
h1,h2,h3{margin:0;text-wrap:balance}
button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
button:focus-visible,input:focus-visible,textarea:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.lbl{font-family:var(--f-label);text-transform:uppercase;letter-spacing:.08em;font-size:13px;color:var(--muted);font-weight:600}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.foot{font-size:13px;color:var(--muted);margin:0}

/* cuartel: emblema y rango */
.hq{display:flex;align-items:center;gap:12px;padding-bottom:10px;border-bottom:1px solid var(--line)}
.hq svg{flex:none;width:46px;height:46px}
.hq>div:nth-child(2){min-width:0;flex:1}
.hq .streak{flex:none}
.hq .t{font-family:var(--f-label);font-weight:700;letter-spacing:.1em;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--accent);text-transform:uppercase}
.hq .rk{display:flex;align-items:center;gap:8px;font-family:var(--f-label);font-weight:700;text-transform:uppercase;letter-spacing:.06em;font-size:16px}
.hq .rk .chev{display:inline-flex;align-items:flex-end;gap:2px;height:16px}
.hq .rk .chev i{display:block;width:4px;background:var(--accent);border-radius:1px}
.hq .rk .chev i:nth-child(1){height:6px}.hq .rk .chev i:nth-child(2){height:9px}.hq .rk .chev i:nth-child(3){height:12px}.hq .rk .chev i:nth-child(4){height:14px}.hq .rk .chev i:nth-child(5){height:16px}
.hq .streak{margin-left:auto;text-align:right;font-family:var(--f-label);text-transform:uppercase;letter-spacing:.06em;font-size:12px;color:var(--muted)}
.hq .streak b{display:block;font-family:var(--f-display);font-size:26px;color:var(--ink);line-height:1;font-weight:400}
/* cabecera del día */
.day{display:grid;grid-template-columns:auto minmax(0,1fr) auto auto;gap:8px;align-items:center}
.day .mid{text-align:center;min-width:0}
.day .big{color:var(--ink);letter-spacing:.02em;font-family:var(--f-display);font-size:clamp(17px,5.6vw,30px);line-height:1.05;white-space:normal;overflow-wrap:anywhere}
.bigtext .day .big{font-size:clamp(15px,4.8vw,26px)}
.day .sub{font-size:13px;color:var(--muted)}
.nb{background:var(--paper);border:1px solid var(--line);border-radius:8px;min-width:44px;height:44px;font-family:var(--f-label);font-weight:700;padding:0 10px}
.nb.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.stage{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;font-family:var(--f-label);font-weight:700;text-transform:uppercase;letter-spacing:.05em;font-size:14px}
.stage .st{color:var(--accent)}

/* orden */
.order{background:linear-gradient(180deg,var(--paper2),var(--paper));border:1px solid var(--line);border-left:4px solid var(--accent);padding:12px 14px;display:flex;flex-direction:column;gap:6px;border-radius:4px;position:relative;overflow:hidden}
.msg-h{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;font-family:var(--f-mono);font-size:11px;letter-spacing:.06em;color:var(--accent);text-transform:uppercase;padding-bottom:6px;border-bottom:1px dashed var(--line)}
.stamp{position:absolute;right:10px;top:8px;transform:rotate(-8deg);border:3px solid var(--ok);color:var(--ok);font-family:var(--f-display);font-size:22px;padding:2px 10px;border-radius:4px;letter-spacing:.06em;opacity:.9}
.order.done{padding-top:46px}
.order .say{font-family:var(--f-label);font-weight:700;font-size:20px;text-transform:uppercase;letter-spacing:.02em;line-height:1.15;margin:0}
.order p{margin:0}
.why-q{font-style:italic;border-left:3px solid var(--accent);padding-left:10px}
.start{font-size:18px;padding:16px}
.run{display:flex;flex-direction:column;gap:12px;min-height:70vh}
.rhead{display:flex;justify-content:space-between;align-items:center}
.rbody{display:flex;flex-direction:column;gap:12px;background:linear-gradient(180deg,var(--paper2),var(--paper));border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:4px;padding:16px}
.rbody p{margin:0}
.rbig{font-family:var(--f-display);font-size:clamp(30px,9vw,44px);line-height:1.05}
.rname{font-family:var(--f-label);font-weight:700;font-size:18px;text-transform:uppercase;letter-spacing:.03em}
.rname b{color:var(--accent)}
.rcmd{font-size:clamp(21px,5.6vw,26px);font-weight:700;line-height:1.3}
.rcmd{white-space:pre-line}
.how{background:var(--bg);border-radius:6px;padding:10px 12px;display:flex;flex-direction:column;gap:4px}
.how p{font-size:15px;line-height:1.45}
details.hw summary{font-size:13px;color:var(--accent);cursor:pointer;font-weight:600}
details.hw p{margin:6px 0 0;font-size:14px}
.glance{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:6px;font-size:15px}
.glance b{font-family:var(--f-mono);font-size:13px}
.runlog{margin-top:10px;padding:10px 12px;border:1px dashed var(--line);border-radius:6px;display:flex;flex-direction:column;gap:8px}
.rlf{display:grid;grid-template-columns:repeat(auto-fit,minmax(90px,1fr));gap:8px}
.rlv{margin:0;font-size:14px;color:var(--muted)}
.rlv.ok{color:var(--ok);font-weight:600}.rlv.warn{color:var(--warn);font-weight:600}.rlv.bad{color:var(--bad);font-weight:600}
.savechip{display:block;margin-top:4px;font-family:var(--f-label);font-size:12px;letter-spacing:.04em;text-transform:none;color:var(--muted);white-space:nowrap}
.savechip.ok{color:var(--ok)}.savechip.busy{color:var(--warn)}.savechip.err{color:var(--bad)}
label.btn{display:inline-block;cursor:pointer}
.nowline{margin:0;font-family:var(--f-label);font-size:15px;letter-spacing:.02em;color:var(--accent);border-left:3px solid var(--accent);padding:4px 10px;background:var(--paper)}
.charts{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:10px}
.chartbox{background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:10px 12px;min-width:0}
.ctitle{font-family:var(--f-label);font-size:16px;letter-spacing:.03em;text-transform:uppercase}
.chart{width:100%;height:auto;display:block}
.chart .cg{stroke:var(--line);stroke-width:1}
.chart .ct{fill:var(--muted);font-family:var(--f-mono);font-size:10px}
.chart .cv{fill:var(--ink);font-family:var(--f-mono);font-size:12px;font-weight:600}
.chart .cl{fill:none;stroke:var(--accent);stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.chart .cd circle{fill:var(--accent);stroke:var(--paper);stroke-width:2}
.chart .cd{cursor:pointer;outline:none}.chart .cd circle.hit{fill:transparent;stroke:none}.chart .cd.sel circle:not(.hit),.chart .cd:focus-visible circle:not(.hit){stroke:var(--ink);stroke-width:3}
.cval{margin:2px 0 0;min-height:1.3em}
.chart .cgoal path{fill:none;stroke:var(--muted);stroke-width:1.5}
.chart g{cursor:default}
.hmwrap{display:flex;flex-direction:column;gap:10px;overflow-x:auto}
.hmg{display:flex;flex-direction:column;gap:4px}
.hm{display:grid;grid-template-rows:repeat(7,22px);gap:3px}
.hc{width:100%;min-width:18px;height:22px;border-radius:3px;border:0;padding:0;background:var(--chip)}
.hc.done{background:var(--ok)}.hc.part{background:color-mix(in srgb,var(--ok) 40%,var(--chip))}
.hc.injury{background:repeating-linear-gradient(45deg,var(--warn) 0 3px,color-mix(in srgb,var(--warn) 55%,var(--chip)) 3px 6px)}
.hc.fail{background:var(--bad)}.hc.missed{background:transparent;box-shadow:inset 0 0 0 1.5px var(--bad)}
.hc.future{background:transparent;box-shadow:inset 0 0 0 1px var(--line)}.hc.today{background:transparent;box-shadow:inset 0 0 0 2px var(--accent)}
.legend{display:flex;flex-wrap:wrap;gap:6px 12px;font-size:13px;color:var(--muted)}
.lg{display:inline-flex;align-items:center;gap:6px}.lg i{display:inline-block;width:14px;height:14px}
.kpis.rec{grid-template-columns:repeat(auto-fill,minmax(110px,1fr))}
.kpis.rec b{font-size:20px}
.li.diary{align-items:start}.dnote{display:block;color:var(--muted);font-size:14px;white-space:pre-line;margin-top:2px}
.guided .timerbar{bottom:calc(64px + env(safe-area-inset-bottom,0px))}
body.timing:not(.guided){padding-bottom:calc(230px + env(safe-area-inset-bottom,0px))}.bigtext body.timing:not(.guided){padding-bottom:calc(270px + env(safe-area-inset-bottom,0px))}
body.guided{padding-bottom:calc(420px + env(safe-area-inset-bottom,0px))}
.guided .tin{grid-template-columns:1fr;padding:16px}
.guided .tin .tl{flex-direction:column;align-items:center;gap:0}
.guided .tin .tl b{font-size:clamp(52px,17vw,96px);line-height:1}
.guided .tin .bar{height:14px}
.guided .tin .nb{grid-row:auto;grid-column:auto;height:52px;font-size:18px}
.bigtext .wrap,.bigtext .timerbar,.bigtext nav.tabs{zoom:1.15}
.rset{font-family:var(--f-label);font-weight:700;font-size:22px;text-transform:uppercase;color:var(--accent)}
.rwhat{font-size:22px;font-weight:600}
.rnote{font-size:15px;color:var(--muted)}
.rdone{font-size:22px;padding:18px}
.btn[disabled]{opacity:.35}
.alert{background:repeating-linear-gradient(-45deg,rgba(226,85,62,.12) 0 10px,transparent 10px 20px);border:1px solid var(--bad);color:var(--bad);padding:8px 12px;font-weight:600;font-size:15px;margin:0}

/* cómo amaneciste */
.mode{display:grid;grid-template-columns:repeat(4,1fr);gap:4px}
.mode button{border:2px solid var(--line);background:var(--paper);border-radius:8px;padding:8px 2px;font-family:var(--f-label);font-weight:700;text-transform:uppercase;letter-spacing:.02em;font-size:13px}
.seg.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.mode button.on.m-ok{background:var(--ok);border-color:var(--ok);color:var(--paper)}
.mode button.on.m-cansado{background:var(--warn);border-color:var(--warn);color:var(--paper)}
.mode button.on.m-dolor,.mode button.on.m-enfermo{background:var(--bad);border-color:var(--bad);color:var(--paper)}
.modetxt{font-size:15px;margin:0;font-weight:600}

/* progreso */
.bar{height:10px;background:var(--chip);border-radius:2px;overflow:hidden;background-image:repeating-linear-gradient(90deg,transparent 0 9.5%,rgba(6,17,29,.55) 9.5% 10%)}
.bar i{display:block;height:100%;background:linear-gradient(90deg,#B98B2E,var(--accent))}
.prog{display:flex;flex-direction:column;gap:6px}
.prog .row{display:flex;justify-content:space-between;gap:8px}

/* sesiones */
.ses{background:var(--paper);border:1px solid var(--line);border-radius:6px;overflow:hidden;box-shadow:inset 3px 0 0 var(--line)}
.ses:not(.done){box-shadow:inset 3px 0 0 var(--accent)}
.ses.done{border-color:var(--ok)}.ses.done .t{text-decoration:line-through;color:var(--muted)}
.ses.lock{opacity:.5;border-style:dashed}.ses.lock .tog{cursor:not-allowed}.chk.lk{border-color:var(--line);color:var(--muted)}
.ses.cur{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}.nowb{display:inline-block;background:var(--accent);color:var(--accent-ink);font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;padding:1px 6px;border-radius:4px;vertical-align:2px}
.nextrow{margin-top:10px}
.ses.nope{border-color:var(--bad);box-shadow:inset 3px 0 0 var(--bad)}.ses.nope .chk{border-color:var(--bad);color:var(--bad);font-size:22px;font-weight:700}.ses.nope .t{color:var(--muted)}
.nopeb{display:inline-block;background:var(--bad);color:#fff;font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;padding:1px 6px;border-radius:4px;vertical-align:2px}
.nopebtn{background:none;border:1px solid var(--line);color:var(--muted);border-radius:999px;padding:5px 9px;font-size:13px;white-space:nowrap}.nopebtn.on{border-color:var(--bad);color:var(--bad)}
.day.solo,.day.other{display:flex;align-items:center;gap:10px}.day.solo .mid,.day.other .mid{flex:1;text-align:left}.day.other{background:rgba(255,176,32,.12);border:1px solid var(--warn);border-radius:8px;padding:8px 10px}.day.other .big{color:var(--warn)}
.water .vasos{display:flex;flex-wrap:wrap;gap:4px;margin:8px 0}.vaso{background:none;border:0;padding:2px;width:30px;height:34px;color:var(--muted)}.vaso.on{color:#4FC3F7}.vaso svg{width:100%;height:100%}.water.ok{border-color:var(--ok)}
.redit summary{display:flex;justify-content:space-between;align-items:baseline;gap:8px;list-style:none;cursor:pointer}.redit summary::-webkit-details-marker{display:none}.redit[open] summary{margin-bottom:10px}
.rrows{display:flex;flex-direction:column;gap:8px;margin:10px 0}.rrow{border:1px solid var(--line);border-radius:8px;padding:8px;display:flex;flex-direction:column;gap:6px}
.rrow input{background:var(--bg);border:1px solid var(--line);color:var(--ink);border-radius:6px;padding:7px 8px;font:inherit;font-size:16px;width:100%}
.rnums{display:grid;grid-template-columns:70px 1fr 100px;gap:6px}.rnums label{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;display:flex;flex-direction:column;gap:2px}
.rbtns{display:flex;gap:6px;justify-content:flex-end}.rbtns .nb{width:40px;height:34px}
.kgf{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--muted);flex-basis:100%}.kgf input{width:70px}.reps .meta{flex-basis:100%;color:var(--ink)}.reps .meta.up{color:var(--ok);font-weight:600}
.tr{font-weight:700;width:18px;text-align:center}.tr.up{color:var(--ok)}.tr.down{color:var(--bad)}.reps .rec{flex-basis:100%;color:var(--accent)}
.card.sum .li{display:grid;grid-template-columns:1fr auto 20px;gap:10px;align-items:center;padding:8px 10px}
.wk{width:100%;border-collapse:collapse;font-size:14px;margin:8px 0}.wk td,.wk th{padding:5px 3px;text-align:center;border-bottom:1px solid var(--line)}.wk th{font-size:11px;color:var(--muted);font-weight:600;text-transform:uppercase}.wk td.wk-t{text-align:left;font-size:12px;color:var(--muted)}.wk-today td{background:var(--chip)}.wk-y{color:var(--ok);font-weight:700}.wk-x{color:var(--bad);font-weight:700}.wk-n{color:var(--muted)}
.whyb{border-top:1px dashed var(--line)}.segs.why .seg{font-size:13px;padding:6px 8px}
.hq .cd{font-size:12px;color:var(--muted);margin-top:2px}.hq .cd b{color:var(--accent)}
.daycfg summary{display:flex;justify-content:space-between;align-items:center;gap:8px;list-style:none}.daycfg summary::-webkit-details-marker{display:none}.daycfg .dcv{font-size:14px;color:var(--accent);font-weight:600}.daycfg[open] summary{margin-bottom:8px}.daycfg{padding-block:10px}.daycfg:not([open]) summary{margin:0}
.order.closed{border-color:var(--bad)}.order.half{border-color:var(--warn)}.stamp.red{border-color:var(--bad);color:var(--bad)}
.ses.pend{border-color:var(--warn);box-shadow:inset 3px 0 0 var(--warn)}
.pendb{display:inline-block;background:var(--warn);color:#1A1200;font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;padding:1px 6px;border-radius:4px;vertical-align:2px}
.pendcard{background:rgba(255,176,32,.12);border:1px solid var(--warn);border-radius:6px;padding:8px 10px;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.pendcard b{color:var(--warn);font-family:var(--f-label);text-transform:uppercase;letter-spacing:.06em;font-size:13px;margin-right:4px}
.pendlink{background:transparent;border:1px solid var(--warn);color:var(--ink);border-radius:999px;padding:4px 10px;font-size:14px}
.sec.reg{display:flex;flex-direction:column;gap:8px}
details.reg summary{display:flex;justify-content:space-between;align-items:baseline;gap:8px;cursor:pointer;list-style:none}
details.reg summary::-webkit-details-marker{display:none}
.meals{display:flex;flex-direction:column;gap:6px}
.meal{display:grid;grid-template-columns:28px 1fr auto;align-items:center;gap:8px;background:var(--paper2);border:1px solid var(--line);border-radius:6px;padding:9px 10px;text-align:left}
.meal .mk{width:24px;height:24px;border:2px solid var(--line);border-radius:50%;display:grid;place-items:center;font-weight:700;color:var(--accent-ink)}
.meal.on .mk{background:var(--accent);border-color:var(--accent)}.meal.on .mn{color:var(--muted);text-decoration:line-through}
.meal .mh{font-family:var(--f-mono);font-size:13px;color:var(--muted)}
.meal.pend{border-color:var(--warn);box-shadow:inset 3px 0 0 var(--warn)}.meal.pend .mh{color:var(--warn);font-family:var(--f-label);font-weight:700;text-transform:uppercase}
.pendtxt{color:var(--warn)!important;font-weight:600}
.reps{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:6px}
.reps input{width:60px;padding:6px 4px;text-align:center;background:var(--bg);border:1px solid var(--line);color:var(--ink);border-radius:6px;font-family:var(--f-mono);font-size:16px}
.reps .foot{flex-basis:100%}
.photos{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.pcol{display:flex;flex-direction:column;gap:6px;min-width:0}
.pcol img,.noimg{width:100%;aspect-ratio:3/4;object-fit:cover;border-radius:6px;background:var(--paper2);border:1px solid var(--line)}
.noimg{display:grid;place-items:center;color:var(--muted);font-size:13px}
.upl{cursor:pointer;flex:1;text-align:center}
.lnk{background:none;border:0;color:var(--accent);text-decoration:underline;padding:0;font-size:13px}
.kpis.sum{grid-template-columns:repeat(auto-fill,minmax(96px,1fr))}.kpis.sum small{font-size:12px;color:var(--muted)}
.sh{display:grid;grid-template-columns:44px 1fr auto 28px;gap:10px;align-items:center;padding:12px}
.chk{width:36px;height:36px;border:2px solid var(--ink);border-radius:6px;background:none;display:grid;place-items:center;padding:0}
.ses.done .chk{background:var(--ok);border-color:var(--ok)}
.ses.done .chk::after{content:"";width:13px;height:7px;border-left:3px solid var(--paper);border-bottom:3px solid var(--paper);transform:rotate(-45deg) translate(1px,-1px)}
.tog{background:none;border:0;text-align:left;padding:0;min-width:0;display:flex;flex-direction:column}
.tog .t{font-weight:700;font-size:17px;line-height:1.2}
.tog .m{font-family:var(--f-mono);font-size:12px;color:var(--muted);margin-top:3px}
.chev{background:none;border:0;font-size:18px;color:var(--muted);padding:0;height:36px}
.sb{border-top:1px solid var(--line);padding:4px 12px 12px;display:flex;flex-direction:column}
.sb .why{font-size:14px;color:var(--muted);margin:8px 0 2px}
.safe{font-size:13px;color:var(--bad);font-weight:600;margin:8px 0 0}
.ex{padding-block:12px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:6px}
.ex:last-child{border-bottom:0}
.ex .top{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.ex .n{font-weight:700;font-size:16px}

 31:["Mañana del infierno · 2 h 30",75,250,250,150,40,8],36:["Mañana del infierno · 3 h",90,300,300,200,50,10],41:["Mañana del infierno · 3 h 30",100,300,300,200,60,10],44:["Día del infierno · 4 h",120,400,400,300,80,12]};

const TEMP_MES=[18,18,16,14,12,10,9,9,10,11,13,15]; // estimación °C del lago Llanquihue por mes

5) Recién ahí nadas: paralelo a la orilla, donde el agua te llegue al pecho, para poder pararte cuando quieras. Las primeras semanas puedes nadar con la cabeza afuera (pecho); cuando te sientas bien, crol normal.`;

function shiftFor(t){if(t==="libre")return SHIFT_LIBRE;const h=turnoHora(t);if(!h)return undefined;const E=toMin(h),f=fromMin,sx=turnoSalida(t);

 ["Valores del militar","Honor, disciplina, lealtad, valor, espíritu de cuerpo y abnegación (poner a los demás y a la misión antes que tu comodidad). En el servicio no se mide solo cuánto corres: se mide si cumples cuando nadie te mira, si ayudas al que se queda atrás y si dices la verdad aunque te perjudique.","Escribe un ejemplo de tu vida para 3 de esos valores."],
 ["La vida en el cuartel","El día empieza temprano con la diana, la cama se hace perfecta, el uniforme limpio, y todo tiene hora: formación, instrucción, comidas, aseo y silencio. Lo que más cuesta a los que llegan es la puntualidad, el orden y obedecer sin discutir. Esta app ya te entrena eso: levantarte a la hora y cumplir la orden del día.","Mañana haz la cama apenas te levantes, perfecta, y ordena tu pieza en 10 minutos con cronómetro."],
 ["Hora militar y comunicación","En el Ejército se usa la hora de 24 horas (las 10 de la noche son las 22:00, “veintidós cero cero”). Las órdenes se repiten para confirmar que se entendieron, y se habla corto y claro: qué, dónde, cuándo.","Durante el día de hoy, di todas las horas en formato de 24 horas."],
 ["Alfabeto fonético","Por radio, las letras se dicen con palabras para no confundirlas: Alfa, Bravo, Charlie, Delta, Echo, Foxtrot, Golf, Hotel, India, Juliet, Kilo, Lima, Mike, November, Oscar, Papa, Quebec, Romeo, Sierra, Tango, Uniform, Victor, Whiskey, X-ray, Yankee, Zulu.","Deletrea tu nombre completo y tu RUT con el alfabeto fonético, en voz alta, 3 veces."],
 ["La brújula","La aguja apunta al norte magnético. Los rumbos se dan en grados de 0 a 360, en el sentido del reloj: 0° norte, 90° este, 180° sur y 270° oeste. Para seguir un rumbo eliges un punto lejano en esa dirección y caminas hacia él.","Con la brújula del celular, párate en tu casa y anota hacia cuántos grados está la puerta, la ventana y el lago."],
 ["Leer un mapa","La escala te dice cuánto mide en la realidad un centímetro del mapa (1:50.000: 1 cm son 500 m). Las curvas de nivel unen puntos de la misma altura: juntas son pendiente fuerte, separadas es terreno plano. El norte está arriba. Para ubicarte, compara lo que ves (cerros, ríos, caminos) con lo que muestra el mapa.","Abre un mapa de Puerto Varas en el celular y calcula con la escala la distancia de tu casa al lago."],
 ["Orientarse sin brújula","El sol sale por el este y se pone por el oeste; al mediodía, en Chile, queda hacia el norte. De noche, la Cruz del Sur ayuda a encontrar el sur: prolonga el eje largo de la cruz unas 4 veces y medio hacia abajo, y ese punto está sobre el sur. Una vara clavada al sol: marca la punta de la sombra, espera 15 minutos y marca otra; la línea va de oeste a este.","Esta semana, a mediodía, mira hacia dónde cae el sol desde tu casa y anota los cuatro puntos cardinales."],
 ["Nudo as de guía","Hace un lazo fijo que no se corre ni se aprieta: sirve para rescatar a alguien o amarrar un bote. Truco: haces un ojito en la cuerda (el pozo), el chicote (el conejo) sale del pozo, da la vuelta al árbol (la parte larga) y vuelve a entrar al pozo.","Con un cordón o cinturón, hazlo 10 veces. Después 3 veces con los ojos cerrados."],
 ["Nudo ballestrinque","Sirve para amarrar una cuerda a un poste o una baranda. Das una vuelta al poste, cruzas por encima, das otra vuelta y pasas el chicote por debajo del último cruce. Se hace rápido y se suelta fácil.","Practícalo 10 veces en la pata de una silla."],
 ["Nudo llano","Une dos cuerdas del mismo grosor: derecha sobre izquierda, y después izquierda sobre derecha. Si lo haces dos veces igual queda un nudo “de vieja” que se suelta. También sirve para vendajes.","Hazlo 10 veces y comprueba que quedó simétrico."],
 ["Nudo ocho","Es un nudo de tope: evita que la cuerda se salga de una argolla. Haces una vuelta, pasas el chicote por detrás y lo metes por el ojo: queda con forma de 8. Es la base de muchos nudos de seguridad.","Hazlo 10 veces. Después repasa los 4 nudos seguidos: as de guía, ballestrinque, llano y ocho."],
 ["RCP: reanimación","Si alguien no responde y no respira normal: pide ayuda y llama al 131 (SAMU). Pon las manos al centro del pecho y comprime fuerte y rápido: 5–6 cm de profundidad, 100 a 120 por minuto, dejando que el pecho vuelva. Ciclos de 30 compresiones y 2 ventilaciones. En un ahogado se empieza con 5 ventilaciones de rescate.","Practica el ritmo sobre un cojín: 30 compresiones al ritmo de “Stayin’ Alive”. Inscríbete en un curso de primeros auxilios cuando puedas."],
 ["Posición lateral de seguridad","Para alguien inconsciente que sí respira: lo pones de costado, con la pierna de arriba doblada y la mano bajo la mejilla, la cabeza un poco hacia atrás. Así no se ahoga con vómito o con su lengua. Lo revisas cada minuto hasta que llegue ayuda.","Practícala con alguien de tu casa, 3 veces."],
 ["Hemorragias","Lo primero es presión directa fuerte sobre la herida con un paño limpio, y no la sueltas. Si un brazo o una pierna sangra a chorro y la presión no basta, va un torniquete 5–7 cm sobre la herida (nunca sobre una articulación), apretado hasta que pare, y se anota la hora. Llama al 131 (SAMU).","Practica con una correa o un cinturón cómo pondrías un torniquete en tu propio muslo (sin apretar)."],
 ["Fracturas y esguinces","Si hay deformidad, dolor fuerte en un punto del hueso o no puedes apoyar: se inmoviliza como está (con tablillas, cartón o la otra pierna), sin intentar enderezar, y se busca ayuda. Un esguince de tobillo: reposo, frío 15 minutos cada 2 horas, vendaje firme y pie en alto. Volver a correr antes de tiempo es la causa de la mayoría de las lesiones repetidas.","Escribe los pasos para inmovilizar un brazo con lo que tengas en tu casa."],
 ["Hipotermia","Leve: temblor fuerte, piel fría, manos torpes. Moderada: el temblor para, confusión, habla lenta. Grave: inconsciencia. Qué hacer: sacar del agua y del viento, quitar ropa mojada, secar, abrigar (sobre todo tronco y cabeza) y dar bebida tibia solo si está consciente. No frotar brazos ni piernas, ni meter de golpe en agua caliente.","Anota las 3 etapas y los 5 pasos de ayuda en tu cuaderno."],
 ["Golpe de calor e hidratación","Con calor y esfuerzo, el cuerpo puede dejar de enfriarse: piel caliente, dolor de cabeza, mareo, náuseas y confusión. Qué hacer: parar, sombra, sacar ropa, mojar y abanicar, y agua en sorbos si está consciente; si está confundido, al 131. Se previene tomando agua antes de tener sed y entrenando temprano en verano.","Anota cuánta agua tomas mañana durante el día y compárala con tu meta."],
 ["Cuidado de los pies","En el servicio los pies son tu herramienta: con ampollas no marchas. Uñas cortas y rectas, pies secos, calcetines sin costuras y de recambio, zapatos ya usados (nunca nuevos para una marcha larga). Si sientes un roce, para y protégelo antes de que salga la ampolla. Una ampolla grande se vacía con aguja limpia por el borde, sin sacar la piel, y se cubre.","Revisa tus pies después de la próxima marcha y anota dónde roza la zapatilla."],
 ["Armar la mochila","Lo pesado va pegado a la espalda y a la altura de los omóplatos; lo liviano, abajo y afuera. Correas de hombros ajustadas para que no se mueva, y si tiene cinturón, que cargue en la cadera. Todo dentro de una bolsa plástica por si llueve. Una mochila que se balancea cansa el doble.","Arma tu mochila de la próxima marcha según esta regla y camina 5 minutos para probarla."],
 ["Shock de frío: regla 1-10-1","Al caer al agua fría: 1 minuto para controlar la respiración (el jadeo pasa si no entras en pánico), 10 minutos de movimiento útil antes de que los músculos fallen, y alrededor de 1 hora antes de perder la conciencia por hipotermia. Lo que mata primero no es la hipotermia, es el pánico y el agotamiento de los primeros minutos.","Memoriza la regla 1-10-1 y explícala en voz alta."],
 ["Rescate: lanzar, no ir","La mayoría de los que se meten a rescatar sin entrenamiento también se ahogan. Orden: 1) hablar y dar instrucciones desde la orilla, 2) alcanzar con un palo o una rama, 3) lanzar algo que flote (botella, salvavidas, cuerda), 4) ir en bote. Nadar hacia la víctima es lo último y solo con entrenamiento.","Anota las 4 opciones en orden. Mira qué tienes a mano en el lugar donde nadas."],
 ["Lesiones del corredor","Las más comunes: dolor en la cara interna de la canilla (periostitis), dolor bajo la rodilla y tendinitis del Aquiles. Casi siempre vienen de subir la carga muy rápido o de zapatillas gastadas. Prevención: no más de 10% de aumento por semana, gemelos y glúteos fuertes, y cambiar las zapatillas cada 600–800 km.","Revisa tus zapatillas: si la suela está lisa o torcida, anótalo como prioridad."],
 ["Comer para entrenar","Proteína: repara el músculo (huevo, pollo, pescado, legumbres, lácteos). Carbohidratos: son la bencina del entrenamiento (arroz, papas, avena, pan, fideos). Grasas buenas: palta, aceite de oliva, maní. Después de entrenar fuerte, en la hora siguiente, come proteína y carbohidratos juntos.","Revisa lo que comiste ayer y marca qué comida no tuvo proteína."],
 ["Dormir es entrenar","Mientras duermes se libera hormona de crecimiento y se reparan los músculos. Con menos de 7 horas bajan la fuerza, la memoria y las defensas, y suben las lesiones. El cuerpo no se acostumbra a dormir poco: el rendimiento sigue bajando aunque no lo sientas.","Anota cuántas horas dormiste cada día de esta semana."],
 ["Entrevista: tu por qué","En la postulación te van a preguntar por qué quieres entrar. Una buena respuesta es concreta y honesta: qué te mueve, qué has hecho para prepararte (este plan) y qué aportarías. No respondas con lo que crees que quieren oír.","Escribe tu respuesta de 1 minuto y dila en voz alta frente al espejo 3 veces."],
 ["Entrevista: fortalezas y debilidades","Te pueden preguntar por tus fortalezas y debilidades. Para la debilidad, di una real y qué estás haciendo para mejorarla. Por ejemplo: “nadaba poco y mal; llevo X semanas entrenando 3 veces por semana”.","Escribe 2 fortalezas con un ejemplo cada una, y 1 debilidad con lo que haces para mejorarla."],
 ["Trabajo en equipo","En el servicio nadie aprueba solo: se marcha al ritmo del grupo, se carga lo del que no puede y se responde como sección. El que solo piensa en sí mismo se nota rápido. Ayudar a otro cuando tú también estás reventado es lo que más se valora.","Escribe una situación en que ayudaste a alguien estando tú cansado, o cómo lo harías."],
 ["Disciplina","La disciplina es hacer lo que toca cuando no tienes ganas, igual que cuando sí. Las ganas suben y bajan; el hábito no. Por eso esta app te da órdenes: para que no tengas que decidir cada día si entrenas.","Anota los días de esta semana en que no tenías ganas y aun así cumpliste."],
 ["Preparación académica","Según la escuela a la que postules, te van a pedir notas de enseñanza media y pruebas de conocimientos (en la Escuela Militar, la PAES). Repasar 20 minutos al día durante meses rinde más que estudiar todo una semana antes.","Repasa 20 minutos de matemáticas: fracciones, porcentajes y ecuaciones de primer grado. Usa los ejercicios gratuitos de DEMRE."],
 ["Comprensión lectora","Leer rápido y entender instrucciones es clave en el examen y en el servicio, donde las órdenes vienen por escrito y apuradas. Se entrena leyendo todos los días y resumiendo lo leído.","Lee un artículo de noticias completo y escribe un resumen de 3 líneas."]
];
function studyT(plan){
  const n=plan.w*7+plan.dow,card=STUDY[n%STUDY.length],rep=n>=STUDY.length;
  return T("estudio",(rep?"Repaso: ":"Estudio: ")+card[0],"20 minutos con un cuaderno solo para esto.","",[
    B("Lee",card[0],{c:card[1]}),
    B("Tarea","en tu cuaderno",{c:card[2]})],{kind:"estudio"});
}
/* ---- comida: porciones según tu peso (1,6 g de proteína por kilo al día, en 4 comidas) ---- */
function NUT(kg,train,hell){
  // ectomorfo que quiere músculo: 2 g de proteína por kilo y un 10–20% más de calorías de las que gastas (Iraki y cols. 2019; Morton y cols. 2018)
  const P=kg||70,known=!!kg,prot=Math.round(P*2),perMeal=Math.round(prot/5/5)*5;
  const eggs=Math.max(2,Math.min(4,Math.round(perMeal/7))),chicken=Math.max(120,Math.round(perMeal/0.3/10)*10+(hell?50:0));
  const water=Math.min(4.5,Math.round((P*0.035+(train?0.75:0))*10)/10);
  const gain=known?`${(Math.round(P*0.0025*10)/10).toLocaleString("es-CL")}–${(Math.round(P*0.005*10)/10).toLocaleString("es-CL")} kg`:"0,2–0,4 kg";
  const base=(known?`Con tus ${P} kg necesitas unos ${prot} g de proteína al día: unos ${perMeal} g en cada una de tus 5 comidas.`:"Cuando anotes tu peso en Plan → Ajustes, ajusto las cantidades a ti.")+` Para ganar músculo comes más de lo que gastas: la meta es subir ${gain} por semana (pésate cada semana en ayunas). Si en 2 semanas la balanza no sube, agrega un segundo batido de masa en la tarde.`;
  return {P,prot,perMeal,eggs,chicken,water,base,
   pre:`Come algo liviano 30–60 minutos antes de entrenar, para tener energía sin sentirte pesado. Elige UNA opción:
a) 1 plátano + media marraqueta (o media hallulla) con 1 cucharada de mantequilla de maní.
b) 1 yogur + 3 cucharadas de avena + 1 cucharadita de miel.
c) 1 tostada con miel o mermelada + 1 manzana.
No comas frituras, palta en cantidad, ni un plato grande: se te va a revolver el estómago.`,
   restBreak:`Desayuna tranquilo. Elige UNA opción:
a) ${eggs} huevos revueltos + 1 marraqueta + 1 fruta + 1 vaso de leche.
b) 1 taza de avena (80 g) cocida en leche + 1 plátano + 1 yogur.
c) 2 panes con palta y pollo o jamón de pavo + 1 yogur.
${base}`,
   breakfast:`Después de entrenar el cuerpo necesita recargar: proteína para reparar el músculo y carbohidratos para reponer energía. Elige UNA opción:
a) ${eggs+(hell?1:0)} huevos revueltos + 2 panes (o 1 marraqueta entera) + 1 fruta + 1 vaso de leche.
b) 1 taza de avena (80 g) cocida en leche + 1 plátano + 1 yogur + 2 huevos duros.
c) 2 panes con palta y ${Math.round(chicken*0.6/10)*10} g de pollo o 3 láminas de jamón de pavo + 1 yogur + 1 fruta.
${hell?"Esta semana comes más: agrega otro pan y otra fruta. ":""}${base}`,
   lunch:`Plato grande, armado así: la mitad del plato carbohidratos, un cuarto proteína (del tamaño y grosor de tu mano) y un cuarto verduras. Elige UNA opción:
a) 1,5 tazas de arroz cocido + 1 pechuga de pollo (unos ${chicken} g) + ensalada de tomate y lechuga con aceite.
b) 1,5 tazas de porotos, lentejas o garbanzos con arroz + 1 huevo + ensalada.
c) 2 tazas de fideos cocidos + ${chicken} g de carne molida en salsa de tomate + ensalada.
d) 1 filete de pescado (merluza o salmón, ${chicken} g) + 3 papas cocidas + verduras.
${hell?"Esta semana repite el plato. ":""}Toma 1 vaso de agua. Postre: 1 fruta.`,
   shake:`Batido de masa (casero, en la licuadora): 300 ml de leche + 1 plátano + 4 cucharadas de avena + 1 cucharada de mantequilla de maní (+ 1 cucharada de cacao si quieres). Son unas 550 calorías y 25 g de proteína. Tómatelo entero: es la forma más fácil de comer más sin sentirte lleno.`,
   snack:`Prepara la colación para el trabajo (tu cuarta comida). Elige UNA opción:
a) 1 sándwich de pan integral con ${Math.round(chicken*0.6/10)*10} g de pollo o 2 huevos duros, más tomate.
b) 1 yogur + 1 fruta + un puñado de maní sin sal (30 g, lo que cabe en la palma).
c) 1 lata de atún al agua + 4 galletas de agua + 1 fruta.
Y una botella de 1 litro de agua. Cómela a mitad de turno.`,
   night:`Al llegar del trabajo come algo liviano con proteína, para recuperar mientras duermes sin dormir con el estómago lleno. Elige UNA opción:
a) ${Math.min(3,eggs)} huevos revueltos con 1 pan y tomate.
b) 1 yogur con 4 cucharadas de avena y 1 fruta.
c) 1 lata de atún al agua con ensalada y 1 pan.
Nada frito, nada de café ni bebidas con azúcar.`,
   water:`Hoy toma unos ${water.toLocaleString("es-CL")} litros de agua en total${known?` (por tus ${P} kg${train?" más el entrenamiento":""})`:""}. Truco: 1 botella de 1 L en la mañana, 1 en el trabajo y el resto en las comidas. Si tu orina sale oscura, te falta agua.`};
}
const okKg=v=>v>=35&&v<=150;
function bodyWeight(){let w=null;const tk=iso(today());Object.keys(Store.days).sort().forEach(k=>{if(k>tk)return;const v=parseFloat(String(Store.days[k].peso||"").replace(",","."));if(okKg(v))w=v});const c=parseFloat(String(Store.cfg.peso||"").replace(",","."));return w||(okKg(c)?c:null)}
// o.prev / o.next: turno de ayer y de mañana. Después de acostarte pasada la medianoche, hoy se despierta 8 h después
// (y la mañana se corre); la alarma de la noche es la del turno de mañana.
const wakeAfter=(bedT,sh)=>{const b=toMin(bedT),pb=b<300?b:b-1440;return Math.max(toMin(sh.wake),pb+480)};
function applyShift(plan,turno,kg,o){
  o=o||{};const sh=Object.assign({},SHIFT[turno]||SHIFT["13"]),hell=plan.w===HELL,rest=plan.kind==="descanso",N=NUT(kg,!rest,hell);
  if(o.prev){const ps=SHIFT[o.prev]||sh,wk=wakeAfter(ps.bed,sh);if(wk>toMin(sh.wake)){sh.late=ps.bed;sh.wake=fromMin(wk);sh.A=fromMin(Math.max(toMin(sh.A),wk+30));if(toMin(sh.B)<toMin(sh.A)+45)sh.B=fromMin(toMin(sh.A)+45)}}
  const ns=o.next?SHIFT[o.next]:sh,alarm=fromMin(o.next?wakeAfter(sh.bed,ns):toMin(sh.wake)),slp=(toMin(alarm)-toMin(sh.bed)+1440)%1440,slpT=Math.floor(slp/60)+(slp%60?" h "+pad(slp%60):" horas");
  const longInc=(plan.tasks.some(t=>t.id==="inc")&&incMin(plan.w)>=120)||(hell&&!rest);
  // día de lago: el desayuno y lo que sigue van después de volver a la casa
  {const lt=plan.tasks.find(t=>t.h&&t.lake&&t.blocks.some(b=>b.n==="Ida en bicicleta"));if(lt){const tb=lt.blocks.find(b=>b.n==="Ida en bicicleta"),st0=toMin(mapH(lt.h,sh)),end=st0+tripTotal(tb);
    sh.home=fromMin(end);if(end+25>toMin(sh.B))sh.B=fromMin(Math.min(end+25,toMin(sh.C)-15))}}
  const tasks=plan.tasks.map(t=>{let x=Object.assign({},t,{h:mapH(t.h,sh)});
    if(t.id==="noche")x=Object.assign(x,{why:sh.back?`Llegas ${sh.back}. Despiertas ${sh.wake}.`:`Despiertas ${sh.wake}.`,blocks:[sh.back?B("Comida al llegar","liviana con proteína",{c:N.night}):B("Cena","liviana con proteína",{c:N.night.replace("Al llegar del trabajo come","En la cena come")}),B("Skincare","lavar la cara y crema",{c:"Lava la cara con agua tibia y jabón suave, sécate y pon crema hidratante."}),B("Leer la Biblia","10 min",{tm:600,c:"Un capítulo, tranquilo. Si quieres, anota una frase en tus notas."})].concat(t.blocks.map(b=>b.n==="A la cama"?Object.assign({},b,{p:`${sh.bed} · alarma ${alarm}`,c:`Apaga la luz a las ${sh.bed} y deja la alarma a las ${alarm}: son ${slpT}.${o.next&&o.next!==turno?` Mañana ${o.next==="libre"?"estás libre":"entras a las "+(turnoHora(o.next)||o.next)}.`:""} El celular lejos de la cama, pieza oscura y fresca. Si no te duermes en 20 minutos, respira en caja (4-4-4-4) sin mirar la pantalla.`}):b))});
    return x});
  tasks.push(T("despertar","Despertar",sh.late?`Ayer te acostaste a la ${sh.late}: hoy despiertas ${sh.wake} para dormir 8 h. La mañana es más corta: haz primero lo principal.`:`Alarma a las ${sh.wake}, sin posponer.`,sh.wake,[
    B("Levántate",sh.wake,{c:`Levántate a las ${sh.wake} apenas suene la alarma. Sin posponer: es lo primero del día. ${plan.dow===0?"Hoy es el primer día de la semana: pésate en ayunas, después de ir al baño y antes de tomar agua, y anótalo en Notas y peso.":""}`}),
    B("Agua","500 ml",{c:"Toma un vaso grande de agua (500 ml) antes de cualquier otra cosa: llevas 8 horas sin tomar."}),
    B("Skincare","cara y protector solar",{c:"Lava la cara, crema hidratante y protector solar si vas a salir."}),
    B("Creatina","3–5 g",{c:"Todos los días, también los de descanso: con agua, jugo o en el batido. No hace falta cargarla."}),
    longInc?B("Desayuno","antes de salir",{c:N.breakfast+"\nHoy la sesión es larga: lleva agua y una colación (plátano, pan con mantequilla de maní) para la mitad."}):B(rest?"Desayuno":"Algo liviano",rest?"tranquilo":"antes de entrenar",{c:rest?N.restBreak:N.pre})],{kind:"rutina"}));
  if(!rest&&!longInc)tasks.push(T("desayuno","Desayuno completo",sh.home?`Al volver del lago (${sh.home}).`:"Después de la sesión principal.",fromMin(Math.max(toMin(sh.B)-25,sh.home?toMin(sh.home):0)),[B("Desayuno","completo",{c:N.breakfast}),B("Batido de masa","con el desayuno",{c:N.shake})],{kind:"rutina"}));
  tasks.push(T("almuerzo","Almuerzo"+(sh.leave?" y colación":""),sh.leave?`Antes de salir al trabajo a las ${sh.leave}.`:"",sh.lunch,[B("Almuerzo","plato completo",{c:N.lunch})].concat(sh.leave?[B("Colación para el trabajo","prepárala ahora",{c:N.snack})]:[]),{kind:"rutina"}));
  tasks.push(Object.assign(englishT(plan),{h:sh.leave?sh.B:fromMin(toMin(sh.lunch)+45)}));
  if(!sh.leave&&!plan.test)tasks.push(Object.assign(studyT(plan),{h:fromMin(toMin(sh.lunch)+110)}));
  if(!plan.test)tasks.push(Object.assign(ventaT(plan),{h:fromMin(toMin(sh.leave?sh.C:sh.lunch)+(sh.leave?0:200))}));
  // lo de todos los días: perro, casa, pausas en la pega
  tasks.push(T("perro","Sacar al perro","",fromMin(toMin(sh.wake)+20),[B("Paseo","15–20 min",{tm:1200,c:"Caminata tranquila: también te sirve de movilidad antes de entrenar."})],{kind:"rutina"}));
  tasks.push(T("casa","Tareas de la casa","",fromMin(toMin(sh.B)+65),[B("Ordena tu pieza y ayuda","15 min",{tm:900,c:"Cama hecha, ropa en su lugar, loza o lo que toque en la casa."})],{kind:"rutina"}));

function softBlock(b,tag){
  if(b.s<=2)return b;
  if(/^\d+(-\d+)+$/.test(b.p)){if(b.s<=3)return b;const sq=b.p.split("-"),up=sq.slice(0,Math.ceil(sq.length/2)),h=Math.max(2,Math.ceil(up.length*0.7)),nq=up.slice(0,h).concat(up.slice(0,h-1).reverse());return Object.assign({},b,{s:nq.length,p:nq.join("-"),note:(b.note||"").replace(/^\d+ flexiones\. /,"")+(tag?" "+tag.trim():"")})}

  if(/por lado/.test(b.p)){const k=b.p.match(/^(\d+) ×/);if(k){const per=Math.max(1,Math.round(ns/2));p2=b.p.replace(/^\d+ ×/,per+" ×")}}

        tt=sc(tt);return Object.assign({},b,{n:sc(b.n),p:sc(b.p)+" (suave)",tm:b.tm?Math.round(b.tm*0.6/300)*300:b.tm,m:b.m?fm(b.m):b.m,note:b.note?b.note.replace(/≈ ([\d.]+) m/,(_,a)=>"≈ "+nf(fm(num(a)))+" m"):b.note})}

  if(/^Técnica/.test(b.n))return "Los ejercicios: 1) "+(t.lake?"Patada sin tabla: boca abajo, brazos estirados adelante, solo patada corta desde la cadera; levantas la cabeza para respirar.":"Patada con tabla: brazos estirados sobre la tabla, solo patada corta desde la cadera.")+" 2) Patada lateral: de costado, un brazo estirado adelante, la oreja sobre ese brazo; giras la cara para respirar. 3) Nado a un brazo: un brazo quieto adelante, el otro hace la brazada completa. 4) “Pillar”: una mano espera adelante hasta que la otra llega a tocarla. 5) Respiración cada 3 brazadas: respiras una vez a cada lado.";
  if(t.kind==="agua"&&/m$|brazadas$/.test(b.n))return HOW_SWIM;
  if(/^Trote/.test(b.n))return HOW["Trote"];
  if(t.kind==="carrera"&&/×/.test(b.n))return "Intervalos: corre cada tramo al tiempo indicado, ni más rápido ni más lento (mira el reloj en cada vuelta de 400 m). En la recuperación trota muy suave o camina, sin sentarte.";
  if(/^Movilidad/.test(b.n))return HOW["Movilidad"];
  if(/^Sentadillas/.test(b.n))return HOW["Sentadillas"];
  if(/^Flexiones/.test(b.n))return HOW["Flexiones"];
  if(/^Abdominales/.test(b.n))return HOW["Abdominales"];
  if(/^Barras/.test(b.n))return HOW["Barras"];
  if(b.n==="Cuando quieras parar")return HOW["Respiración de caja"];
  return "";
}

function resultsVerdict(kind,plan,k,r){

  if(kind==="sim"){const g=nextGoalWeek(plan.w),ev=evalTest(g,Object.assign({sinParar:1,crol:1},r)),filled=ev.rows.filter((x,i)=>{const f=["flex","barras","salto","abd","run","swim"][i];return r[f]&&(f==="swim"||f==="run"?!isNaN(toSec(r[f])):!isNaN(cnt(r[f])))});

  for(let i=0;i<7;i++){const d=addDays(from,i),p=planFor(d);if(!p)continue;

      const f=(dd,mm)=>{const x=new Date(dd);x.setHours(0,mm,0,0);return x.getFullYear()+pad2(x.getMonth()+1)+pad2(x.getDate())+"T"+pad2(x.getHours())+pad2(x.getMinutes())+"00"};

// revisa que el texto sea una copia sana antes de ofrecer restaurarla
function checkBackup(text){
  try{let d;const tx=String(text||"").replace(/[“”]/g,'"'),a=tx.indexOf("{"),z=tx.lastIndexOf("}");try{d=JSON.parse(a>=0&&z>a?tx.slice(a,z+1):tx)}catch(e){throw new Error("no se puede leer")}
    if(!d||d.app!=="bitacora-buzo-tactico"||!isObj(d.days)||!isObj(d.cfg))throw new Error("no es una copia de tus datos");
    const bad=Object.keys(d.days).find(k=>!isISO(k)||!isObj(d.days[k]));if(bad!==undefined)throw new Error("hay un día dañado: "+String(bad).slice(0,20));
    const c=d.cfg;if(c.start!=null&&!isISO(c.start))throw new Error("la fecha de inicio está dañada");
    if(c.sched!=null&&(!Array.isArray(c.sched)||!c.sched.length||!c.sched.every(w=>Number.isInteger(w)&&w>=0&&w<=52)))throw new Error("el orden de las semanas está dañado");
    S.restore={data:d,n:Object.keys(d.days).length,when:d.exportedAt&&!isNaN(new Date(d.exportedAt))?fmt(new Date(d.exportedAt)):"fecha desconocida"}}
  catch(e){S.restore={err:"El archivo no es una copia válida de tus datos ("+e.message+")."}}
  S.paste=false;render();const el=document.getElementById("respaldo");if(el)el.scrollIntoView({block:"center"});
}

 <li><b>Atleta híbrido:</b> músculo que se note, rápido y explosivo para el fútbol, y con el aguante y la cabeza de un militar. Todo con lo que tienes en casa: mancuernas de 10 kg (una sola puede llevar 20 kg), bandas, colchoneta, rueda, mochila y la barra de la plaza.</li>
 <li><b>Ectomorfo no es una condena:</b> te cuesta más subir de peso, no ganar músculo. Lo que falla casi siempre es comer poco. Por eso la app te da 2 g de proteína por kilo, un batido de masa diario y una meta de peso semanal.</li>
 <li>Si más adelante entras al gimnasio, el plan se adapta: más peso en vez de más repeticiones.</li>
 <li>El domingo (libre) es para el lago y las pruebas; el viernes, descanso o partido.</li></ul>
 <h3>Lo que dice la ciencia y cómo lo usa el plan</h3>
 <div class="tbl"><table><thead><tr><th>Evidencia</th><th>En tu plan</th></tr></thead><tbody>
 <tr><td>El músculo crece igual con pesos livianos o pesados si llegas cerca del fallo; más series por semana dan más crecimiento, hasta unas 10–20 (<a href="https://jssm.org/15-4-715.p_d_f" target="_blank" rel="noopener">Schoenfeld</a>)</td><td>Con mancuernas de 10 kg subes repeticiones, bajas lento y llegas cerca del fallo. 3 → 5 series por ejercicio a lo largo del año, cada músculo 2 veces por semana</td></tr>
 <tr><td>Proteína: el beneficio llega hasta unos 1,6 g/kg al día, y puede ser algo más (<a href="https://pubmed.ncbi.nlm.nih.gov/28698222/" target="_blank" rel="noopener">Morton 2018</a>)</td><td>2 g por kilo, repartidos en 5 comidas</td></tr>
 <tr><td>Para ganar masa: comer 10–20% más de lo que gastas y subir 0,25–0,5% del peso por semana (<a href="https://pubmed.ncbi.nlm.nih.gov/31247944/" target="_blank" rel="noopener">Iraki 2019</a>)</td><td>Batido de masa diario y meta de peso semanal en Hoy</td></tr>
 <tr><td>Correr no frena el músculo si se separa de la fuerza explosiva (<a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9474354/" target="_blank" rel="noopener">Schumann 2022</a>)</td><td>Velocidad antes de piernas, carreras suaves en días distintos</td></tr>
 <tr><td>4 × 4 min al 90% subió el VO₂máx y la distancia recorrida en partido en futbolistas (<a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC1725215" target="_blank" rel="noopener">Helgerud 2001</a>)</td><td>Intervalos de fútbol cada martes</td></tr>
 <tr><td>El nórdico reduce a la mitad los desgarros del muslo (<a href="https://bjsm.bmj.com/content/53/21/1362" target="_blank" rel="noopener">van Dyk 2019</a>); el Copenhague reduce las lesiones de ingle (<a href="https://bjsm.bmj.com/content/53/3/150" target="_blank" rel="noopener">Harøy 2019</a>)</td><td>Nórdico y Copenhague cada jueves</td></tr>
 <tr><td>Los saltos mejoran sprint, salto y cambio de dirección en futbolistas (<a href="https://pubmed.ncbi.nlm.nih.gov/40300007/" target="_blank" rel="noopener">Zheng 2025</a>)</td><td>Saltos largos y laterales cada lunes</td></tr>
 <tr><td>La máscara de “altura” no simula altura; funciona como entrenador de los músculos respiratorios (<a href="https://jssm.org/15-2-379.p_d_f" target="_blank" rel="noopener">Porcari 2016</a>)</td><td>Tu boquilla nasal: solo en los trotes suaves</td></tr>
 <tr><td>La creatina monohidrato es segura y mejora el rendimiento y las ganancias de músculo (<a href="https://pmc.ncbi.nlm.nih.gov/articles/5469049/" target="_blank" rel="noopener">ISSN 2017</a>)</td><td>Opcional: 3–5 g al día. Coméntalo en tu chequeo médico</td></tr></tbody></table></div>
 <h3>Cómo sube el plan</h3><ul>
 <li><b>Semana:</b> lun pecho + core · mar pierna + core · mié espalda + core · jue hombros y brazos + core · vie descanso o partido · sáb cardio (trote a ritmo de conversación; desde la semana 5, aceleraciones cortas semana por medio) + core · dom lago + estiramiento. Todos los días: inglés 1 hora.</li>
 <li><b>Progresión:</b> semana 1 técnica con 2–3 repeticiones en reserva · semana 2 suma 1–2 repeticiones · semana 3 hasta el máximo del rango · semana 4 más peso o una variante más difícil · después, <b>descarga</b> (cerca de la mitad de las series, nada al fallo) y se parte de nuevo. Cuando completas todas las series en el máximo del rango, sube el peso; si no tienes más, baja en 3 s o haz pausas. No subas peso, repeticiones y series a la vez.</li>
 <li><b>Prueba cada 13 semanas</b> (un domingo): flexiones, barras, salto largo, abdominales, 3.200 m, nado 50 m y medidas. Ahí ves en números el músculo que ganaste.</li>
 <li><b>Lo militar:</b> sesiones de incomodidad y una semana del infierno adaptada (sem 48), siempre durmiendo 8 h.</li>
 <li><b>Inglés:</b> 1 hora diaria con un tema por semana pensado para el working holiday (entrevista, hostel, trabajos, banco). Para Australia se pide inglés “funcional”, que suele equivaler a IELTS 4,5: confírmalo en el sitio oficial antes de postular.</li></ul>
 <h3>Para no lesionarte</h3><ul>
 <li><b>Antes:</b> movilidad y activación (3 × 2 min, distinta según el día). Moverte prepara el músculo; estirar quieto y largo justo antes de la fuerza te quita fuerza.</li>
 <li><b>Después:</b> elongación estática del músculo que trabajaste, 2 veces por lado, sin dolor. Está al final de cada sesión.</li>
 <li><b>Prevención:</b> el nórdico (pierna y sábado) y el Copenhague (pierna) son los ejercicios con más pruebas para evitar desgarros del muslo y lesiones de ingle en futbolistas.</li>
 <li><b>Si algo molesta:</b> dolor punzante, en un punto, o que empeora con cada repetición: paras ese ejercicio. Marca «Con dolor» y ese día solo recuperas. Si al otro día sigue, no lo entrenes y consúltalo.</li>
 <li>Sube el peso solo cuando completes todas las series en el tope del rango: la app te avisa cuándo.</li></ul>
 <h3>Técnica</h3><ul>
 <li><b>Barras:</b> agarre prono, desde brazos estirados hasta el mentón sobre la barra, sin balanceo. Si no sale: negativas, bajando en 5 s.</li>
 <li><b>Flexiones:</b> cuerpo recto, codos a 45°, pecho a un puño del suelo.</li>
 <li><b>Sentadillas:</b> muslos paralelos al suelo, talones apoyados, rodillas en la línea de los pies.</li>
 <li><b>Abdominales:</b> rodillas flexionadas, manos cruzadas al pecho, codos a los muslos.</li>
 <li><b>Hollow hold:</b> boca arriba, espalda baja pegada al suelo, brazos y piernas estirados y despegados del suelo.</li>
 <li><b>Cuerda:</b> agarras alto, subes rodillas, pisas la cuerda entre los empeines y te paras. Baja mano bajo mano.</li>
 <li><b>Crol:</b> cuerpo horizontal, exhalas todo bajo el agua, giras para respirar, patada corta desde la cadera, mano entra lejos adelante.</li>
 <li><b>Drills:</b> patada con tabla; patada lateral (de costado, un brazo adelante); nado a un brazo; “pillar” (una mano espera a la otra adelante); respirar cada 3 brazadas.</li>
 <li><b>Intervalos:</b> cada repetición al tiempo indicado, ni más rápido ni más lento. Pista: 1 vuelta = 400 m.</li></ul>
 <h3>Lago sin compañero</h3><ul>
 <li>Es lo más riesgoso del plan. El shock de frío de los primeros 1–2 min hace jadear y tragar agua: entra caminando y espera.</li>
 <li>Solo donde haces pie, paralelo a la orilla, con gorra de color, cerca de gente, sin viento ni oleaje. Avisa a alguien.</li>
 <li>Los minutos máximos dependen del agua y del neopreno. Por ejemplo, a 10–12 °C son 12 min con neopreno y 5 sin él. Cuando suena, sales.</li>
 <li>Nunca apnea en el lago. Los 50 m de la prueba, si los haces en el lago, van paralelos a la orilla y donde haces pie.</li>
 <li><b>Cómo entrar:</b> rodillas 30 s → cintura y te mojas manos, cara y nuca → respiras hasta que se calme (≈1 min) → hombros 20–30 s → nadas donde el agua te llega al pecho. Las primeras semanas, si quieres, con la cabeza afuera.</li>
 <li><b>Cómo salir:</b> cuando suena, sales aunque te sientas bien. Sécate, ropa abrigada y gorro, algo caliente y camina. Es normal temblar unos minutos.</li></ul>
 <h3>Reglas que no se rompen</h3><ul>
 <li>Nunca nades solo donde no haces pie; nunca aguantes la respiración bajo el agua.</li>
 <li>No más de 10% de aumento semanal por tu cuenta.</li>
 <li>Dolor agudo, localizado o que empeora = parar y consultar.</li>
 <li>1 día de descanso total por semana y las descargas, sin excepción.</li></ul>
 <h3>Tus turnos</h3><ul>
 <li><b>Entras 14:00 (sales 22:30, en la casa 23:00):</b> cama 0:00 · despiertas 8:00 · perro · entrenas 8:30 · desayuno · inglés 10:45 · tareas de la casa · almuerzo 12:45 · sales 13:15 (30–40 min caminando).</li>
 <li><b>Entras 16:00 (sales 0:30, en la casa 1:00):</b> cama 2:00 · despiertas 10:00 · entrenas 10:30 · inglés 12:45 · almuerzo 14:45 · sales 15:15.</li>
 <li><b>Cualquier otra hora:</b> en Hoy → «Hoy trabajo» → «Otra hora». La app calcula todo: 8 h 30 de turno, 30 min a la casa, 1 h para acostarte y 8 h de sueño.</li>
 <li><b>Domingo y lunes:</b> libres (lunes cerrado). Si un domingo trabajas, cámbialo ese día en Hoy. Tu turno normal se cambia en Plan → Ajustes.</li>
 <li><b>En la pega:</b> a mitad de turno, pausa activa de 3 min (gemelos, cuádriceps, pecho, talones): estar de pie 8 h carga las piernas.</li>
 <li>Al llegar del trabajo: comida liviana con proteína, ducha y a dormir. Nada de pantallas en la cama.</li></ul>
 <h3>Dormir poco: por qué no se entrena</h3><ul>
 <li>El cuerpo no se acostumbra a dormir poco. Con restricción de sueño, el rendimiento sigue bajando día tras día aunque sientas que te adaptaste, y suben las lesiones.</li>
 <li>En el servicio la falta de sueño la ponen ellos. Llega mejor quien llega descansado y con la cabeza entrenada para seguir cansado.</li>
 <li>Lo que sí entrenas: sesiones largas cuando ya estás cansado, dobles sesiones, frío e incomodidad. Esa es la sensación del infierno, sin destruirte.</li>
 <li>Duerme 8 h. Con tus turnos se puede: solo corre la hora de dormir.</li></ul>
 <h3>Acostumbrarte al dolor</h3><ul>
 <li><b>Todos los días de entrenamiento</b> terminas con “Tolerancia al dolor”: sentadilla en la pared, colgado de la barra y plancha. Cada semana suben unos segundos (pared de 0:45 a 4:00).</li>
 <li><b>Incomodidad desde la semana 2:</b> 20 min (sem 2) → 40 min (6) → 60 min (10) y sigue subiendo hasta el día del infierno.</li>
 <li><b>Frío todos los días:</b> la ducha fría sube de 30 s a 3 min.</li>
 <li><b>Lo que se aguanta:</b> ardor muscular, temblor, frío, falta de aire, cansancio, aburrimiento.</li>
 <li><b>Lo que no se aguanta:</b> dolor punzante, en una articulación, en un punto del hueso, o que empeora con cada repetición. Eso es lesión: paras. Un soldado lesionado no llega al servicio.</li>
 <li>Cuando quieras parar: respiración de caja y “hasta la próxima repetición”. Después anota en qué momento quisiste parar: con las semanas ese momento llega más tarde.</li></ul>
 <h3>Registro</h3><ul>
 <li><b>Comidas:</b> las 5 del día. La que pasó su hora sin marcar queda en amarillo.</li>
 <li><b>Sueño:</b> anota a qué hora te acostaste y despertaste. Menos de 7 h: ese día marca «Cansado».</li>
 <li><b>Repeticiones:</b> en cada ejercicio de fuerza anota lo que hiciste por serie (10, o 10x8kg). La semana siguiente lo ves al lado: la meta es superarlo.</li>
 <li><b>Fotos:</b> frente, perfil y espalda cada 4 semanas, en ayunas y con la misma luz. <b>Inglés:</b> prueba EF SET cada 13 semanas. <b>Ahorro:</b> suma lo que guardas para la working holiday.</li></ul>
 <h3>Comida</h3><ul>
 <li>4 comidas reales, proteína en cada una (unos 1,6 g por kilo al día), carbohidratos en días largos, 2,5–3 L de agua, sin alcohol ni bebidas energéticas.</li></ul></div>`}

window.addEventListener("storage",e=>{if(e.key!==TKEY)return;try{const o=JSON.parse(e.newValue||"{}");TS=o.TS||null;if(TS)runTimers();else if(!TM){clearInterval(TICK);TICK=null;TB.hidden=true;TB.innerHTML="";document.body.classList.remove("timing")}else tick()}catch(x){}});

let pressing=false,pendingRender=false;
document.addEventListener("pointerdown",()=>{pressing=true},true);
const release=()=>{pressing=false;if(pendingRender){pendingRender=false;setTimeout(render,0)}};
document.addEventListener("pointerup",release,true);document.addEventListener("pointercancel",release,true);
Store.init(()=>{if(pressing){pendingRender=true;return}render()});
