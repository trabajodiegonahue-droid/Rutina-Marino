<title>Bitácora Buzo Táctico</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Saira+Stencil+One&family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@500;600;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: una columna para el celular. Arriba el día, después la orden, cómo amaneciste y las sesiones plegables; navegación fija abajo. */
:root{
  --bg:#E6EBEF; --paper:#F7F9FA; --ink:#0F1E2E; --muted:#56687A; --line:#C6D0D9;
  --accent:#D9531E; --accent-ink:#FFFFFF; --ok:#2C7A4B; --warn:#A86A12; --bad:#B3261E; --chip:#DCE3E9;
  --f-display:"Saira Stencil One","Impact","Arial Narrow",sans-serif;
  --f-body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-label:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0A121B; --paper:#111C27; --ink:#E3E9EF; --muted:#8B9AA9; --line:#22323F;
  --accent:#FF7A3D; --accent-ink:#1A0A02; --ok:#4FB37E; --warn:#E3A94B; --bad:#F06B60; --chip:#1A2836; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0A121B; --paper:#111C27; --ink:#E3E9EF; --muted:#8B9AA9; --line:#22323F;
  --accent:#FF7A3D; --accent-ink:#1A0A02; --ok:#4FB37E; --warn:#E3A94B; --bad:#F06B60; --chip:#1A2836; color-scheme:dark}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--ink)}
body{font-family:var(--f-body);font-size:16px;line-height:1.45;padding:0 16px calc(150px + env(safe-area-inset-bottom,0px))}
.wrap{max-width:640px;margin:0 auto;padding-block:14px 24px;display:flex;flex-direction:column;gap:14px}
h1,h2,h3{margin:0;text-wrap:balance}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.lbl{font-family:var(--f-label);text-transform:uppercase;letter-spacing:.08em;font-size:13px;color:var(--muted);font-weight:600}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.foot{font-size:13px;color:var(--muted);margin:0}

/* cabecera del día */
.day{display:grid;grid-template-columns:auto 1fr auto auto;gap:8px;align-items:center}
.day .mid{text-align:center;min-width:0}
.day .big{font-family:var(--f-display);font-size:clamp(20px,6.4vw,30px);line-height:1;white-space:nowrap}
.day .sub{font-size:13px;color:var(--muted)}
.nb{background:var(--paper);border:1px solid var(--line);border-radius:8px;min-width:44px;height:44px;font-family:var(--f-label);font-weight:700;padding:0 10px}
.nb.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.stage{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;font-family:var(--f-label);font-weight:700;text-transform:uppercase;letter-spacing:.05em;font-size:14px}
.stage .st{color:var(--accent)}

/* orden */
.order{background:var(--paper);border:1px solid var(--line);border-top:4px solid var(--accent);padding:12px 14px;display:flex;flex-direction:column;gap:6px}
.order .say{font-family:var(--f-label);font-weight:700;font-size:20px;text-transform:uppercase;letter-spacing:.02em;line-height:1.15;margin:0}
.order p{margin:0}
.why-q{font-style:italic;border-left:3px solid var(--accent);padding-left:10px}
.start{font-size:18px;padding:16px}
.run{display:flex;flex-direction:column;gap:12px;min-height:70vh}
.rhead{display:flex;justify-content:space-between;align-items:center}
.rbody{display:flex;flex-direction:column;gap:12px;background:var(--paper);border:1px solid var(--line);border-top:4px solid var(--accent);border-radius:8px;padding:16px}
.rbody p{margin:0}
.rbig{font-family:var(--f-display);font-size:clamp(30px,9vw,44px);line-height:1.05}
.rset{font-family:var(--f-label);font-weight:700;font-size:22px;text-transform:uppercase;color:var(--accent)}
.rwhat{font-size:22px;font-weight:600}
.rnote{font-size:15px;color:var(--muted)}
.rdone{font-size:22px;padding:18px}
.btn[disabled]{opacity:.35}
.alert{border:1px solid var(--bad);color:var(--bad);padding:8px 12px;font-weight:600;font-size:15px;margin:0}

/* cómo amaneciste */
.mode{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.mode button{border:2px solid var(--line);background:var(--paper);border-radius:8px;padding:10px 4px;font-family:var(--f-label);font-weight:700;text-transform:uppercase;letter-spacing:.04em;font-size:15px}
.mode button.on.m-ok{background:var(--ok);border-color:var(--ok);color:var(--paper)}
.mode button.on.m-cansado{background:var(--warn);border-color:var(--warn);color:var(--paper)}
.mode button.on.m-dolor{background:var(--bad);border-color:var(--bad);color:var(--paper)}
.modetxt{font-size:15px;margin:0;font-weight:600}

/* progreso */
.bar{height:10px;background:var(--chip);border-radius:3px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent)}
.prog{display:flex;flex-direction:column;gap:6px}
.prog .row{display:flex;justify-content:space-between;gap:8px}

/* sesiones */
.ses{background:var(--paper);border:1px solid var(--line);border-radius:8px;overflow:hidden}
.ses.done{border-color:var(--ok)}
.sh{display:grid;grid-template-columns:44px 1fr 28px;gap:10px;align-items:center;padding:12px}
.chk{width:36px;height:36px;border:2px solid var(--ink);border-radius:6px;background:none;display:grid;place-items:center;padding:0}
.ses.done .chk{background:var(--ok);border-color:var(--ok)}
.ses.done .chk::after{content:"";width:13px;height:7px;border-left:3px solid var(--paper);border-bottom:3px solid var(--paper);transform:rotate(-45deg) translate(1px,-1px)}
.tog{background:none;border:0;text-align:left;padding:0;min-width:0;display:flex;flex-direction:column}
.tog .t{font-weight:700;font-size:17px;line-height:1.2}
.tog .m{font-family:var(--f-mono);font-size:12px;color:var(--muted);margin-top:3px}
.chev{background:none;border:0;font-size:18px;color:var(--muted);padding:0;height:36px}
.sb{border-top:1px solid var(--line);padding:4px 12px 12px;display:flex;flex-direction:column}
.sb .why{font-size:14px;color:var(--muted);margin:8px 0 2px}
.safe{font-size:13px;color:var(--bad);font-weight:600;margin:8px 0 0}
.ex{padding-block:12px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:6px}
.ex:last-child{border-bottom:0}
.ex .top{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.ex .n{font-weight:700;font-size:16px}
.ex.full .n{color:var(--ok)}
.ex .p{font-family:var(--f-mono);font-size:15px;font-weight:600}
.ex .note{font-size:13px;color:var(--muted)}
.ctl{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.dot{width:36px;height:36px;border:2px solid var(--ink);border-radius:50%;background:transparent;font-family:var(--f-mono);font-size:13px;padding:0}
.dot.on{background:var(--ok);border-color:var(--ok);color:var(--paper)}
.cnt{font-family:var(--f-mono);min-width:56px;text-align:center}
.tmr{border:1px solid var(--line);background:var(--bg);border-radius:18px;padding:6px 12px;font-family:var(--f-mono);font-size:13px}
.tmr.rest{color:var(--muted)}

/* tarjetas y formularios */
.card{background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:14px;display:flex;flex-direction:column;gap:12px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field input,.field textarea{background:var(--bg);border:1px solid var(--line);color:var(--ink);border-radius:6px;padding:9px 10px;font:inherit;font-family:var(--f-mono);font-size:16px;width:100%}
.field textarea{font-family:var(--f-body);min-height:70px;resize:vertical}
.btn{border:2px solid var(--ink);background:transparent;padding:12px;border-radius:8px;font-family:var(--f-label);font-weight:700;text-transform:uppercase;letter-spacing:.05em;font-size:15px}
.btn.main{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.sm{padding:8px 10px;font-size:13px}
.segs{display:flex;gap:4px;flex-wrap:wrap}
.seg{border:1px solid var(--line);background:var(--bg);border-radius:6px;padding:8px 12px;font-size:15px}
.seg.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
details.card summary{font-family:var(--f-label);font-weight:700;text-transform:uppercase;letter-spacing:.06em;font-size:14px;cursor:pointer}
.testform{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.cb{display:flex;gap:8px;align-items:center;font-size:15px}
.cb input{width:22px;height:22px}
.verdict{border:2px solid var(--ink);border-radius:8px;padding:12px;display:flex;flex-direction:column;gap:8px}
.verdict.good{border-color:var(--ok)}.verdict.bad{border-color:var(--bad)}
.verdict b{font-family:var(--f-label);font-size:19px;text-transform:uppercase}

/* plan / progreso / guía */
.sec{display:flex;flex-direction:column;gap:10px}
.sec h2{font-family:var(--f-display);font-size:28px;font-weight:400;line-height:1}
.sec h3{font-family:var(--f-label);font-size:18px;text-transform:uppercase;letter-spacing:.04em}
.weeks{display:grid;grid-template-columns:repeat(auto-fill,minmax(42px,1fr));gap:6px}
.wc{border:1px solid var(--line);background:var(--paper);padding:7px 2px;text-align:center;border-radius:6px;font-family:var(--f-mono);font-size:13px}
.wc.test{border:2px solid var(--ink);font-weight:600}
.wc.hell{border:2px solid var(--bad);color:var(--bad);font-weight:600}
.wc.cur{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.wc.sel{outline:2px solid var(--ink);outline-offset:1px}
.wc i{display:block;height:3px;background:var(--ok);margin:4px 4px 0;border-radius:2px}
.list{display:flex;flex-direction:column;border:1px solid var(--line);background:var(--paper);border-radius:8px;overflow:hidden}
.li{display:grid;grid-template-columns:70px 1fr auto;gap:10px;align-items:center;padding:11px 12px;border:0;border-top:1px solid var(--line);background:none;text-align:left;width:100%}
.li:first-child{border-top:0}
.li .a{font-family:var(--f-label);font-weight:700;text-transform:uppercase;font-size:14px;line-height:1.1}
.li .a span{display:block;font-family:var(--f-mono);font-weight:400;font-size:11px;color:var(--muted);text-transform:none}
.li .b{min-width:0;font-size:15px}
.chip{font-family:var(--f-label);font-weight:700;text-transform:uppercase;letter-spacing:.05em;padding:3px 8px;border-radius:4px;font-size:12px;background:var(--chip);color:var(--muted)}
.chip.done{background:var(--ok);color:var(--paper)}.chip.fail{background:var(--bad);color:var(--paper)}.chip.injury{background:var(--warn);color:var(--paper)}.chip.part{color:var(--ink)}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.kpi{background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:10px;display:flex;flex-direction:column}
.kpi b{font-family:var(--f-mono);font-size:24px}
.tbl{overflow-x:auto;border:1px solid var(--line);background:var(--paper);border-radius:8px}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
th{font-family:var(--f-label);text-transform:uppercase;letter-spacing:.05em;font-size:12px;color:var(--muted)}
td.mono{font-family:var(--f-mono)}
.pass{color:var(--ok);font-weight:600}.miss{color:var(--bad);font-weight:600}
.prose p{margin:0 0 8px}
.prose ul{margin:0 0 8px;padding-left:20px;display:flex;flex-direction:column;gap:6px}
.prose a{color:var(--accent)}

/* temporizador y navegación */
.timerbar{position:fixed;left:0;right:0;bottom:calc(56px + env(safe-area-inset-bottom,0px));z-index:6;padding:0 12px 8px;display:flex;justify-content:center}
.tin{max-width:640px;width:100%;background:var(--paper);border:2px solid var(--accent);border-radius:10px;padding:10px 12px;display:grid;grid-template-columns:1fr auto;gap:6px 12px;align-items:center;box-shadow:0 6px 20px rgba(0,0,0,.18)}
.tin .tl{display:flex;justify-content:space-between;align-items:baseline;gap:10px;min-width:0}
.tin .tl b{font-size:30px}
.tin .nb{grid-row:1/3;grid-column:2}
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--ink);display:flex;justify-content:center;padding:0 8px env(safe-area-inset-bottom,0px);z-index:5}
nav.tabs .in{display:grid;grid-template-columns:repeat(4,1fr);max-width:640px;width:100%}
nav.tabs button{background:none;border:0;color:var(--bg);opacity:.6;padding:16px 4px 18px;font-family:var(--f-label);font-weight:700;text-transform:uppercase;letter-spacing:.06em;font-size:15px}
nav.tabs button.on{opacity:1;box-shadow:inset 0 3px 0 var(--accent)}
.toast{position:fixed;left:50%;transform:translateX(-50%);top:calc(12px + env(safe-area-inset-top,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;font-weight:600;z-index:9;max-width:calc(100% - 32px)}
@media (prefers-reduced-motion:no-preference){.order{animation:in .3s ease-out both}@keyframes in{from{transform:translateY(4px);opacity:.6}to{transform:none;opacity:1}}}
</style>

<div class="wrap" id="app"><div class="order"><p class="say">Cargando la orden del día…</p></div></div>

<div id="toast" class="toast" hidden role="status"></div>

<script>
(function(){
"use strict";
/* =================== DATOS DEL PLAN =================== */
const DIAS=["Lunes","Martes","Miércoles","Jueves","Viernes","Sábado","Domingo"];
const TESTS=[0,13,26,39,52];
const DELOAD=[4,8,12,17,21,25,30,34,38,43,47,51];
const HELL=48;
const S12={
1:["600 m: drills con tabla, tramos de 25 m","30 min suave","Intervalos 4 × 400 m","Fuerza B 3 vueltas","Ducha fría 30 s"],

};
const S34={

};

const STAGES=[
 {n:"Semana 0",name:"Chequeo y prueba inicial",from:0,to:0},

];
const stageOf=w=>STAGES.find(s=>w>=s.from&&w<=s.to)||STAGES[4];

const extraOf=w=>(S12[w]?S12[w][4]:S34[w]?S34[w][3]:"")||"";
function carry(w,re,def){let v=def;for(let i=1;i<=w;i++){if(re.test(extraOf(i)))v=extraOf(i)}return v}

const toMin=h=>{const [a,b]=h.split(":").map(Number);return a*60+(b||0)};
const fromMin=m=>{m=((m%1440)+1440)%1440;return Math.floor(m/60)+":"+pad(m%60)};
function mapH(h,sh){if(!h)return h;const m=toMin(h),A=toMin(sh.A),B2=toMin(sh.B),C=toMin(sh.C);
  if(m<9*60)return fromMin(A+(m-420));if(m<11*60)return fromMin(B2+Math.max(0,m-600));if(m<12*60)return fromMin(C+(m-660));if(m<19*60)return fromMin(C+20);if(m<21*60)return fromMin(C+10);return fromMin(toMin(sh.bed)-20)}
function applyShift(plan,turno){
  const sh=SHIFT[turno]||SHIFT["13"];
  const tasks=plan.tasks.map(t=>{let x=Object.assign({},t,{h:mapH(t.h,sh)});
    if(t.id==="noche")x=Object.assign(x,{why:sh.back?`Llegas ${sh.back}: comida liviana, ducha y sin pantalla. Despiertas ${sh.wake}.`:`Despiertas ${sh.wake}.`,blocks:t.blocks.map(b=>b.n==="A la cama"?Object.assign({},b,{p:`${sh.bed} · 8 h`}):b)});
    return x});

}

  setDay(k,patch){Object.assign(this.day(k),patch);this.saveLocal();this.queue(k)},

function locate(date){

  const idx=Math.floor(n/7),dow=n%7,sched=Store.cfg.sched;
  if(idx>=sched.length)return {after:true,n,idx,dow};
  return {n,idx,dow,w:sched[idx]};
}
const weekStartOf=d=>{const st=parse(Store.cfg.start);return addDays(st,Math.floor(diffDays(d,st)/7)*7)};
let CTX=null;
function lastTest(){if(CTX)return CTX;const c={};let bk="";Object.keys(Store.days).sort().forEach(k=>{const t=Store.days[k].test;if(t)["barras","run","swim","apnea"].forEach(x=>{if(t[x]){c[x]=t[x];if(x==="barras")bk=k}})});
  const mb=Store.cfg.maxB;if(mb&&mb.v&&(!bk||mb.k>=bk))c.barras=mb.v;return CTX=c}
function ctxFor(date){const c=Store.cfg;return Object.assign({},lastTest(),{month:date.getMonth(),place:c.place,partner:c.partner,neo:c.neo,temp:c.temp})}
function planFor(date){const L=locate(date);if(L.w===undefined)return null;const dd=Store.days[iso(date)]||{};return applyShift(applyMode(dayPlan(L.w,L.dow,ctxFor(date)),dd.mode),dd.turno||Store.cfg.turno)}
const setKey=(t,i)=>t.id+"."+i;
const blockDone=(dd,t,i)=>Math.min(((dd&&dd.sets)||{})[setKey(t,i)]||0,t.blocks[i].s);
const taskDone=(dd,t)=>!!dd&&(((dd.checks||{})[t.id])||(t.blocks.length>0&&t.blocks.every((b,i)=>blockDone(dd,t,i)>=b.s)));
function units(dd,plan){let a=0,b=0;plan.tasks.forEach(t=>{const all=taskDone(dd,t);t.blocks.forEach((x,i)=>{b+=x.s;a+=all?x.s:blockDone(dd,t,i)})});return {a,b}}
function dayStatus(k,plan){const d=Store.days[k];if(!d||!plan)return "";if(d.status)return d.status;if(d.mode==="dolor"&&plan.tasks.every(t=>taskDone(d,t)))return "injury";if(plan.tasks.every(t=>taskDone(d,t)))return "done";return units(d,plan).a?"part":""}
const okSt=s=>s==="done"||s==="injury";
function streak(){let d=new Date(),n=0;if(!okSt(dayStatus(iso(d),planFor(d))))d=addDays(d,-1);
  for(let i=0;i<800;i++){if(locate(d).before)break;if(okSt(dayStatus(iso(d),planFor(d)))){n++;d=addDays(d,-1)}else break}return n}
function compliance(){const today=new Date();let tot=0,ok=0;for(let d=parse(Store.cfg.start);diffDays(d,today)<0;d=addDays(d,1)){const p=planFor(d);if(!p)break;tot++;if(okSt(dayStatus(iso(d),p)))ok++}return tot?Math.round(ok/tot*100):null}

function orders(plan,k,isToday,dd){

  else if(plan.test)out.push(["say",plan.w===0?`${N}. Hoy se mide el punto de partida. Que sea verdad, no bonito.`:plan.w===52?`Prueba final, ${N}. 52 semanas para esto.`:`Día de prueba, ${N}. Aquí se ve quién entrenó.`]);
  else if(plan.kind==="descanso")out.push(["say",pick(["Hoy descansas. Es una orden, no un premio.","Descanso. El progreso ocurre cuando descansas.","Día libre. Cúmplelo igual de serio."],k)]);
  else if(plan.kind==="prueba")out.push(["say","Simulacro. La prueba entera, cansado, sin regalos."]);
  else if(plan.kind==="admin")out.push(["say",`${N}. Antes de mojarte, se prepara el terreno.`]);
  else if(plan.kind==="agua")out.push(["say",plan.lake?pick(["Al lago. Vas solo: nadas donde haces pie y sales cuando suena.","Lago. El frío no perdona al que se confía.","Al agua. Resistencia sí, heroísmo no."],k):pick([`Al agua a las ${plan.shift?plan.shift.A:"8:00"}. Es tu punto débil: ahí vas a vivir.`,"Piscina. No le regales metros al agua.","Al agua. Cada largo de hoy es uno que en el curso no te hunde."],k)]);
  else out.push(["say",pick([`De pie, ${N}. Esto es lo que haces hoy.`,`Arriba, ${N}. Nadie lo va a hacer por ti.`,`${N}. Querías saber si puedes. Hoy se sigue respondiendo.`],k)]);
  if(plan.deload&&plan.kind!=="descanso")out.push(["p","Semana de descarga: la carga baja a propósito. No te la saltes por orgullo."]);
  if(INC[plan.w]&&plan.dow===5)out.push(["p","Hoy hay sesión larga de incomodidad. Come bien antes y lleva agua."]);
  const why=(Store.cfg.why||"").trim(),hard=dd.mode==="cansado"||(INC[plan.w]&&plan.dow===5)||(plan.w===HELL&&plan.kind!=="descanso")||plan.test||plan.kind==="prueba";
  if(why&&hard)out.push(["why",why]);

  if(dd.mode==="dolor")out.push(["p","Con dolor no se entrena lo que duele. Recupera y reporta."]);
  return out;
}

function viewGuia(){return `<div class="sec prose"><h2>Guía</h2>
 <h3>Cómo usar la app</h3><ul>
 <li><b>Cada mañana</b> abre Hoy y marca cómo amaneciste. “Cansado” recorta series; “Con dolor” deja solo recuperación.</li>
 <li><b>Cada círculo es una serie.</b> Al tocarlo arranca solo el descanso. ▶ es el temporizador de trabajo.</li>
 <li><b>El cuadrado</b> de una sesión la marca entera. Con todas marcadas, el día queda cumplido.</li>
 <li><b>Ritmos y barras</b> salen de tus pruebas: anota bien la prueba inicial.</li></ul>
 <h3>El curso real</h3><ul>
 <li>El curso de Buzo Táctico de la Escuela de Fuerzas Especiales de la Armada dura <b>48 semanas</b> y lo termina <b>menos del 10%</b>. (<a href="https://www.infodefensa.com/texto-diario/mostrar/3110970/buzos-tacticos-guerreros-botas-mojadas-armada-chile" target="_blank" rel="noopener">Infodefensa</a>)</li>
 <li>Para personal naval menor de 30 años, la prueba es <b>continua</b>, con descanso mínimo: apnea, 500 m, barras, sentadillas, flexiones, abdominales y 2.400 m. Es la que entrenas aquí.</li>
 <li>Una de las pruebas más duras es el <b>nado de emergencia</b>: sobrevivir en el agua atado de pies y manos, con capucha. Por eso entrenas pataleo vertical y comodidad en lo hondo. Eso se aprende en el curso con instructores: nunca lo practiques por tu cuenta.</li>
 <li>No hay detalle público de una “semana del infierno” chilena. La referencia más conocida es la Hell Week de los SEAL de EE. UU.: casi 6 días mojado y con frío, más de 20 h diarias de actividad, unas 4 h de sueño en total, botes y troncos. (<a href="https://www.military.com/military-fitness/navy-special-operations/navy-seal---hell-week-revisited" target="_blank" rel="noopener">Military.com</a>)</li>
 <li>Confirma siempre el formato vigente en <a href="https://www.admisionarmada.cl/" target="_blank" rel="noopener">admisionarmada.cl</a> o en la Quinta Zona Naval.</li></ul>
 <h3>Cómo sube el plan</h3><ul>
 <li><b>Cada semana tienes:</b> 3 sesiones de agua, 2 de carrera (una suave, una de intervalos), 2 de fuerza de tren superior y circuito, piernas, core, apnea en seco, ducha fría y visualización.</li>
 <li><b>Cada 4 semanas, una de descarga</b> (menos carga) para que el cuerpo asimile.</li>
 <li><b>Incomodidad que crece:</b> 60 min (sem 10) → 90 min (18) → 2 h (23) → mañanas del infierno de 2 h 30 a 3 h 30 (31, 36, 41) → día del infierno de 4 h (44).</li>
 <li><b>Mochila desde la etapa 3:</b> marcha de 40 min con 6 kg que sube a 90 min con 12 kg.</li>
 <li><b>Semana 48, semana del infierno adaptada:</b> 6 días seguidos de 3 a 4 horas cada mañana, con mochila, nado, circuitos y frío. Duermes 9 h: privarte de sueño a propósito te lesiona y no te prepara mejor. La falta de sueño la pone el curso.</li></ul>
 <h3>Técnica</h3><ul>
 <li><b>Barras:</b> agarre prono, desde brazos estirados hasta el mentón sobre la barra, sin balanceo. Si no sale: negativas, bajando en 5 s.</li>
 <li><b>Flexiones:</b> cuerpo recto, codos a 45°, pecho a un puño del suelo.</li>
 <li><b>Sentadillas:</b> muslos paralelos al suelo, talones apoyados, rodillas en la línea de los pies.</li>
 <li><b>Abdominales:</b> rodillas flexionadas, manos cruzadas al pecho, codos a los muslos.</li>
 <li><b>Hollow hold:</b> boca arriba, espalda baja pegada al suelo, brazos y piernas estirados y despegados del suelo.</li>
 <li><b>Cuerda:</b> agarras alto, subes rodillas, pisas la cuerda entre los empeines y te paras. Baja mano bajo mano.</li>
 <li><b>Crol:</b> cuerpo horizontal, exhalas todo bajo el agua, giras para respirar, patada corta desde la cadera, mano entra lejos adelante.</li>
 <li><b>Drills:</b> patada con tabla; patada lateral (de costado, un brazo adelante); nado a un brazo; “pillar” (una mano espera a la otra adelante); respirar cada 3 brazadas.</li>
 <li><b>Pataleo vertical:</b> en lo hondo, piernas como batidora (cada pierna gira hacia adentro alternada), espalda recta.</li>
 <li><b>Intervalos:</b> cada repetición al tiempo indicado, ni más rápido ni más lento. Pista: 1 vuelta = 400 m.</li></ul>
 <h3>Lago sin compañero</h3><ul>
 <li>Es lo más riesgoso del plan. El shock de frío de los primeros 1–2 min hace jadear y tragar agua: entra caminando y espera.</li>
 <li>Solo donde haces pie, paralelo a la orilla, con gorra de color, cerca de gente, sin viento ni oleaje. Avisa a alguien.</li>
 <li>Los minutos máximos dependen del agua y del neopreno. Por ejemplo, a 10–12 °C son 12 min con neopreno y 5 sin él. Cuando suena, sales.</li>
 <li>Nunca apnea en el lago. Las pruebas de 500 m y apnea se miden en piscina.</li></ul>
 <h3>Reglas que no se rompen</h3><ul>
 <li>Nunca apnea solo; nunca hiperventilar antes de una apnea.</li>
 <li>No más de 10% de aumento semanal por tu cuenta.</li>
 <li>Dolor agudo, localizado o que empeora = parar y consultar.</li>
 <li>1 día de descanso total por semana y las descargas, sin excepción.</li></ul>
 <h3>Tus turnos</h3><ul>
 <li><b>Entras 13:00 (sales 22:30):</b> cama 23:30 · despiertas 7:30 · sesión principal 8:00 · desayuno · segunda parte 10:15 · tolerancia y ducha fría 11:00–11:45 · almuerzo 12:00 · sales 12:30.</li>
 <li><b>Entras 16:00 (sales 0:30):</b> cama 1:15 · despiertas 9:15 · sesión principal 9:45 · segunda parte 12:15 · ducha fría 13:45 · almuerzo 14:15 · sales 15:15.</li>
 <li>Cada día eliges el turno arriba en Hoy y los horarios se ajustan solos. Las sesiones largas (hasta 4 h) caben antes del trabajo en los dos turnos.</li>
 <li>Al llegar del trabajo: comida liviana con proteína, ducha y a dormir. Nada de pantallas en la cama.</li></ul>
 <h3>Dormir poco: por qué no se entrena</h3><ul>
 <li>El cuerpo no se acostumbra a dormir poco. Con restricción de sueño, el rendimiento sigue bajando día tras día aunque sientas que te adaptaste, y suben las lesiones.</li>
 <li>En el curso la falta de sueño la ponen ellos. Llega mejor quien llega descansado y con la cabeza entrenada para seguir cansado.</li>
 <li>Lo que sí entrenas: sesiones largas cuando ya estás cansado, dobles sesiones, frío e incomodidad. Esa es la sensación del infierno, sin destruirte.</li>
 <li>Duerme 8 h. Con tus turnos se puede: solo corre la hora de dormir.</li></ul>
 <h3>Acostumbrarte al dolor</h3><ul>
 <li><b>Todos los días de entrenamiento</b> terminas con “Tolerancia al dolor”: sentadilla en la pared, colgado de la barra y plancha. Cada semana suben unos segundos (pared de 0:45 a 4:00).</li>
 <li><b>Incomodidad desde la semana 2:</b> 20 min (sem 2) → 40 min (6) → 60 min (10) y sigue subiendo hasta el día del infierno.</li>
 <li><b>Frío todos los días:</b> la ducha fría sube de 30 s a 3 min.</li>
 <li><b>Lo que se aguanta:</b> ardor muscular, temblor, frío, falta de aire, cansancio, aburrimiento.</li>
 <li><b>Lo que no se aguanta:</b> dolor punzante, en una articulación, en un punto del hueso, o que empeora con cada repetición. Eso es lesión: paras. Un buzo lesionado no llega al curso.</li>
 <li>Cuando quieras parar: respiración de caja y “hasta la próxima repetición”. Después anota en qué momento quisiste parar: con las semanas ese momento llega más tarde.</li></ul>
 <h3>Comida</h3><ul>
 <li>4 comidas reales, proteína en cada una (unos 1,6 g por kilo al día), carbohidratos en días largos, 2,5–3 L de agua, sin alcohol ni bebidas energéticas.</li></ul></div>`}

      c[tid]=false;const cur=Math.min(sets[setKey(t,i)]||0,bb.s);let nv=+v;if(bb.s>1&&bb.s<=12&&nv===cur)nv=cur-1;sets[setKey(t,i)]=nv;
      if(nv>cur&&bb.r&&nv<bb.s)startTimer(bb.r,"Descanso · "+bb.n)}
    const patch={checks:c,sets};if(dd.status==="fail")patch.status="";
    Store.setDay(k,patch);
    const after=dayStatus(k,p);render();
    if(after==="done"&&before!=="done")toast("Misión cumplida, "+(Store.cfg.name||"recluta")+".");
    return}
  if(D.st!==undefined){const p=planFor(S.date);
    if(D.st==="done"&&p){const c={},sets={};p.tasks.forEach(t=>{c[t.id]=true;t.blocks.forEach((x,i)=>sets[setKey(t,i)]=x.s)});Store.setDay(k,{checks:c,sets,status:""});toast("Misión cumplida.")}
    else if(D.clear){Store.setDay(k,{checks:{},sets:{},status:""})}
    else Store.setDay(k,{status:D.st});
    render();return}
});
document.addEventListener("input",e=>{
  const el=e.target,D=el.dataset,k=iso(S.date);
  if(D.f)Store.setDay(k,{[D.f]:el.value});
  else if(D.t){const t=Object.assign({},(Store.days[k]||{}).test||{});t[D.t]=el.value.trim();Store.setDay(k,{test:t})}
  else if(D.tc){const t=Object.assign({},(Store.days[k]||{}).test||{});t[D.tc]=el.checked;Store.setDay(k,{test:t});render()}
  else if(D.c==="name")Store.setCfg({name:el.value.trim()||"Recluta"});
  else if(D.c==="why")Store.setCfg({why:el.value});
  else if(D.c==="maxb"){const v=parseInt(el.value,10);Store.setCfg({maxB:v>0?{v,k:iso(new Date())}:null})}
  else if(D.c==="temp")Store.setCfg({temp:el.value.trim().replace(",",".")});
});
document.addEventListener("change",e=>{const el=e.target;
  if(el.dataset.c==="start"&&el.value){Store.setCfg({start:el.value,startMoved:true});render()}
  if(el.dataset.t)render();
});

/* temporizador */
const TB=document.getElementById("timerbar");let TM=null,AC=null;
function beep(n){try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();for(let i=0;i<n;i++){const o=AC.createOscillator(),g=AC.createGain();o.frequency.value=880;o.connect(g);g.connect(AC.destination);const t0=AC.currentTime+i*0.35;g.gain.setValueAtTime(0.25,t0);g.gain.exponentialRampToValueAtTime(0.001,t0+0.25);o.start(t0);o.stop(t0+0.26)}}catch(e){}try{navigator.vibrate&&navigator.vibrate([200,100,200])}catch(e){}}
function startTimer(sec,label){try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();AC.resume&&AC.resume()}catch(e){}
  if(TM)clearInterval(TM.iv);TM={end:Date.now()+sec*1000,total:sec,label};TB.hidden=false;tick();TM.iv=setInterval(tick,250);wake(true)}
let WL=null;async function wake(on){try{if(on&&!WL&&navigator.wakeLock)WL=await navigator.wakeLock.request("screen");if(!on&&WL){await WL.release();WL=null}}catch(e){WL=null}}
function stopTimer(){if(TM){clearInterval(TM.iv);TM=null}TB.hidden=true;wake(false)}
function tick(){if(!TM)return;const left=Math.max(0,(TM.end-Date.now())/1000);
  TB.innerHTML=`<div class="tin"><div class="tl"><span class="lbl">${left>0?"":"¡Tiempo! "}${esc(TM.label)}</span><b class="mono">${fmtT(Math.ceil(left))}</b></div><div class="bar"><i style="width:${(1-left/TM.total)*100}%"></i></div><button class="nb" data-tstop>${left>0?"Parar":"Cerrar"}</button></div>`;
  if(left<=0){clearInterval(TM.iv);beep(3);const t=TM;setTimeout(()=>{if(TM===t)stopTimer()},6000)}}

Store.init(render);
})();
</script>
