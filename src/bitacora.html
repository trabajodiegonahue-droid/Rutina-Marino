<title>Bitácora Buzo Táctico</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Saira+Stencil+One&family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@500;600;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: una columna estrecha tipo "orden de operaciones": cabecera de estado, mensaje del comandante, lista de tareas, registro; navegación fija abajo. */
:root{
  --bg:#E6EBEF; --paper:#F7F9FA; --ink:#0F1E2E; --muted:#56687A; --line:#C6D0D9;
  --accent:#D9531E; --accent-ink:#FFFFFF; --ok:#2C7A4B; --warn:#A86A12; --bad:#B3261E; --chip:#DCE3E9;
  --f-display:"Saira Stencil One","Impact","Arial Narrow",sans-serif;
  --f-body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-label:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0A121B; --paper:#111C27; --ink:#E3E9EF; --muted:#8B9AA9; --line:#22323F;
  --accent:#FF7A3D; --accent-ink:#1A0A02; --ok:#4FB37E; --warn:#E3A94B; --bad:#F06B60; --chip:#1A2836; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0A121B; --paper:#111C27; --ink:#E3E9EF; --muted:#8B9AA9; --line:#22323F;
  --accent:#FF7A3D; --accent-ink:#1A0A02; --ok:#4FB37E; --warn:#E3A94B; --bad:#F06B60; --chip:#1A2836; color-scheme:dark}

*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--ink)}
body{font-family:var(--f-body);font-size:16px;line-height:1.45;padding:0 16px calc(84px + env(safe-area-inset-bottom,0px))}
.wrap{max-width:680px;margin:0 auto;padding-block:18px 24px;display:flex;flex-direction:column;gap:18px}
h1,h2,h3{margin:0;text-wrap:balance}
button{font:inherit;color:inherit}
button:focus-visible,input:focus-visible,textarea:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.lbl{font-family:var(--f-label);text-transform:uppercase;letter-spacing:.08em;font-size:13px;color:var(--muted);font-weight:600}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}

/* cabecera */
.top{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
.wk{font-family:var(--f-display);font-size:clamp(40px,11vw,64px);line-height:.9;letter-spacing:.01em}
.wk small{font-size:.42em;color:var(--muted)}
.stage{font-family:var(--f-label);font-weight:700;text-transform:uppercase;letter-spacing:.06em;font-size:15px}
.stats{display:flex;gap:16px}
.stat{display:flex;flex-direction:column;align-items:flex-end}
.stat b{font-family:var(--f-mono);font-size:22px;font-weight:600}
.daynav{display:flex;align-items:center;gap:8px;justify-content:space-between;border-block:1px solid var(--line);padding-block:8px}
.daynav .d{font-family:var(--f-label);font-weight:700;font-size:20px;text-transform:uppercase;letter-spacing:.04em;text-align:center;flex:1;min-width:0}
.daynav .d span{display:block;font-family:var(--f-mono);font-size:12px;color:var(--muted);font-weight:400;letter-spacing:0}
.nb{background:var(--paper);border:1px solid var(--line);border-radius:6px;min-width:44px;height:40px;cursor:pointer;font-family:var(--f-label);font-weight:700;padding:0 10px}
.nb:hover{border-color:var(--ink)}
.nb.today{background:var(--ink);color:var(--bg);border-color:var(--ink)}

/* orden del comandante */
.order{background:var(--paper);border:1px solid var(--line);border-top:4px solid var(--accent);padding:14px 16px 16px}
.order .hdr{font-family:var(--f-mono);font-size:12px;color:var(--muted);display:grid;grid-template-columns:auto 1fr;gap:2px 10px;margin-bottom:10px;padding-bottom:10px;border-bottom:1px dashed var(--line)}
.order .hdr b{color:var(--ink);font-weight:600}
.order p{margin:0 0 8px;font-size:17px}
.order p:last-child{margin:0}
.order .say{font-family:var(--f-label);font-weight:700;font-size:21px;text-transform:uppercase;letter-spacing:.02em;line-height:1.15}
.alert{border:1px solid var(--bad);color:var(--bad);padding:8px 12px;font-weight:600;font-size:15px}

/* tareas */
.tasks{display:flex;flex-direction:column;border:1px solid var(--line);background:var(--paper)}
.task{display:grid;grid-template-columns:38px 1fr auto;gap:12px;align-items:start;padding:14px;border-top:1px solid var(--line);cursor:pointer;text-align:left;background:none;border-left:0;border-right:0;border-bottom:0;width:100%}
.task:first-child{border-top:0}
.task .box{width:30px;height:30px;border:2px solid var(--ink);border-radius:4px;display:grid;place-items:center;margin-top:1px}
.task.on .box{background:var(--ok);border-color:var(--ok)}
.task.on .box::after{content:"";width:12px;height:7px;border-left:3px solid var(--paper);border-bottom:3px solid var(--paper);transform:rotate(-45deg) translate(1px,-1px)}
.task .t{font-weight:700;font-size:17px;line-height:1.25}
.task .dd{color:var(--muted);font-size:15px;margin-top:3px;white-space:pre-line}
.task .h{font-family:var(--f-mono);font-size:12px;color:var(--muted);padding-top:3px}
.task.on .t{text-decoration:line-through;text-decoration-thickness:2px;text-decoration-color:var(--ok)}
.task .safe{display:block;color:var(--bad);font-size:13px;font-weight:600;margin-top:4px}

/* registro */
.card{background:var(--paper);border:1px solid var(--line);padding:14px 16px;display:flex;flex-direction:column;gap:12px}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field input,.field textarea{background:var(--bg);border:1px solid var(--line);color:var(--ink);border-radius:4px;padding:8px 10px;font:inherit;font-family:var(--f-mono);font-size:15px;width:100%}
.field textarea{font-family:var(--f-body);min-height:64px;resize:vertical}
.mood{display:flex;gap:4px;flex-wrap:wrap}
.mood button{width:34px;height:34px;border:1px solid var(--line);background:var(--bg);border-radius:4px;cursor:pointer;font-family:var(--f-mono);font-size:14px}
.mood button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.actions{display:grid;grid-template-columns:2fr 1fr 1fr;gap:8px}
.btn{border:2px solid var(--ink);background:transparent;padding:12px 10px;border-radius:6px;cursor:pointer;font-family:var(--f-label);font-weight:700;text-transform:uppercase;letter-spacing:.05em;font-size:15px}
.btn.main{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.sm{padding:8px 10px;font-size:13px}
.btn:hover{filter:brightness(1.05)}
.status{font-family:var(--f-label);font-weight:700;text-transform:uppercase;letter-spacing:.06em;padding:3px 8px;border-radius:3px;font-size:12px;display:inline-block;background:var(--chip);color:var(--muted)}
.status.done{background:var(--ok);color:var(--paper)}
.status.fail{background:var(--bad);color:var(--paper)}
.status.injury{background:var(--warn);color:var(--paper)}
.status.part{background:var(--chip);color:var(--ink)}

/* semana / plan / pruebas */
.list{display:flex;flex-direction:column;border:1px solid var(--line);background:var(--paper)}
.li{display:grid;grid-template-columns:92px 1fr auto;gap:10px;align-items:center;padding:12px 14px;border-top:1px solid var(--line);cursor:pointer;background:none;border-left:0;border-right:0;border-bottom:0;width:100%;text-align:left}
.li:first-child{border-top:0}
.li.cur{outline:2px solid var(--accent);outline-offset:-2px}
.li .a{font-family:var(--f-label);font-weight:700;text-transform:uppercase;font-size:15px}
.li .a span{display:block;font-family:var(--f-mono);font-weight:400;font-size:12px;color:var(--muted);text-transform:none}
.li .b{min-width:0;font-size:15px}
.bar{height:10px;background:var(--chip);border-radius:2px;overflow:hidden;display:flex}
.bar i{display:block;height:100%;background:var(--accent)}
.weeks{display:grid;grid-template-columns:repeat(auto-fill,minmax(44px,1fr));gap:6px}
.wcell{border:1px solid var(--line);background:var(--paper);padding:6px 4px;text-align:center;cursor:pointer;border-radius:4px;font-family:var(--f-mono);font-size:13px;position:relative}
.wcell.test{border-color:var(--ink);font-weight:600}
.wcell.cur{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.wcell .p{display:block;height:3px;background:var(--ok);margin-top:4px;border-radius:2px}
.sec{display:flex;flex-direction:column;gap:10px}
.sec h2{font-family:var(--f-display);font-size:28px;font-weight:400;line-height:1}
.sec h3{font-family:var(--f-label);font-size:18px;text-transform:uppercase;letter-spacing:.04em}
.tbl{overflow-x:auto;border:1px solid var(--line);background:var(--paper)}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
th{font-family:var(--f-label);text-transform:uppercase;letter-spacing:.05em;font-size:12px;color:var(--muted)}
td.mono{font-family:var(--f-mono)}
.pass{color:var(--ok);font-weight:600}.miss{color:var(--bad);font-weight:600}
.prose{font-size:16px}
.prose p{margin:0 0 10px}
.prose ul{margin:0 0 10px;padding-left:20px;display:flex;flex-direction:column;gap:6px}
.testform{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.chk{display:flex;gap:8px;align-items:center;font-size:15px}
.chk input{width:20px;height:20px}
.verdict{border:2px solid var(--ink);padding:12px 14px}
.verdict.good{border-color:var(--ok)}.verdict.bad{border-color:var(--bad)}

/* barra inferior */
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--ink);display:flex;justify-content:center;padding:0 8px env(safe-area-inset-bottom,0px);z-index:5}
nav.tabs .in{display:grid;grid-template-columns:repeat(5,1fr);max-width:680px;width:100%}
nav.tabs button{background:none;border:0;color:var(--bg);opacity:.6;padding:14px 4px 16px;cursor:pointer;font-family:var(--f-label);font-weight:700;text-transform:uppercase;letter-spacing:.06em;font-size:14px}
nav.tabs button.on{opacity:1;box-shadow:inset 0 3px 0 var(--accent)}
.muted{color:var(--muted)}
.foot{font-size:13px;color:var(--muted)}
@media (max-width:440px){.actions{grid-template-columns:1fr 1fr}.actions .main{grid-column:1/-1}.li{grid-template-columns:78px 1fr auto}}
@media (prefers-reduced-motion:no-preference){.order{animation:in .35s ease-out both}@keyframes in{from{transform:translateY(4px);opacity:.6}to{transform:none;opacity:1}}}
</style>

<div class="wrap" id="app">
  <div class="top">
    <div><div class="lbl">Bitácora · Buzos Tácticos</div><div class="wk">SEMANA 0<small> / 52</small></div><div class="stage">Preparación</div></div>

</div>

<script>
(function(){
"use strict";
/* ============ PLAN (del PDF) ============ */
const DIAS=["Lunes","Martes","Miércoles","Jueves","Viernes","Sábado","Domingo"];
const TESTS=[0,13,26,39,52];

// Etapas 1–2: [natación por sesión, carrera martes, intervalos viernes, fuerza viernes, extra]
const S12={
1:["600 m: drills con tabla, tramos de 25 m","30 min suave","Intervalos 4 × 400 m","Fuerza B 3 vueltas","Ducha fría 30 s"],
2:["700 m: drills + 6 × 25 m crol","30 min suave","Intervalos 5 × 400 m","Fuerza B 3 vueltas","Apnea en seco"],
3:["800 m: 8 × 25 m crol, 2 × 50 m","35 min suave","Intervalos 6 × 400 m","Fuerza B 4 vueltas","Ducha fría 1 min"],
4:["Descarga: 600 m solo técnica","30 min suave","","Fuerza B 3 vueltas","Dormir más"],
5:["900 m: 6 × 50 m crol","35 min suave","Intervalos 4 × 800 m","Fuerza B 4 vueltas, barras 6","Apnea piscina: 10–15 m"],
6:["1.000 m: 4 × 75 m, 4 × 50 m","40 min suave","Intervalos 6 × 400 m rápido","Fuerza B 4 vueltas, flexiones 18","Ducha fría 1:30"],
7:["1.100 m: 3 × 100 m crol","40 min suave","Intervalos 5 × 800 m","Fuerza B 5 vueltas","Apnea piscina: 15 m"],
8:["Descarga: 700 m técnica","30 min suave","","Fuerza B 3 vueltas",""],
9:["1.200 m: 4 × 100 m, 200 m continuo","45 min suave","Intervalos 3 × 1.200 m","Fuerza B 5 vueltas, barras 7","Ducha fría 2 min"],

14:["1.500 m: 6 × 100 m + 300 m","45 min","Intervalos 6 × 400 m","Fuerza B 4 vueltas","Primer nado en lago 10 min, acompañado, cerca de la orilla"],

16:["1.700 m: 500 m continuo + 6 × 50 m rápido","50 min","Intervalos 3 × 1.200 m","Fuerza B 5 vueltas","Lago 15 min"],

18:["1.800 m: 8 × 100 m","55 min","Intervalos 6 × 400 m rápido","Fuerza B 5 vueltas, barras 7","Lago 20 min"],
19:["1.900 m: 600 m continuo + 4 × 100 m","55 min","Intervalos 5 × 800 m","Fuerza B 5 vueltas, cuerda 4","Apnea 20–25 m"],
20:["2.000 m: 3 × 400 m","60 min","","Fuerza B 5 vueltas, flexiones 22","Lago 25 min"],
21:["Descarga: 1.400 m","35 min suave","","Fuerza B 3 vueltas","Dormir más"],
22:["2.000 m: 10 × 100 m a ritmo de 500 m","60 min","Intervalos 3 × 1.600 m","Fuerza B 6 vueltas","Lago 30 min"],

25:["Descarga: 1.500 m; ensayo 500 m","35 min suave","","Fuerza B 3 vueltas",""]
};
// Etapas 3–4: [natación lunes, carrera martes, viernes (fuerza/continuo), extra]
const S34={
27:["2.200 m: 10 × 50 m rápido + 800 m","6 × 400 m a ritmo 2.400","Mini-prueba 200 m / 1.200 m","Lago 20 min (agua más fría)"],
28:["2.300 m: 5 × 200 m","4 × 800 m","Mini-prueba + cuerda 5","Apnea 30 m"],
29:["2.400 m: 500 m cronometrado + series","3 × 1.200 m","Mini-prueba 300 m","Lago 20 min"],
30:["Descarga: 1.500 m","30 min suave","Fuerza B suave","Dormir más"],
31:["2.400 m: 12 × 50 m rápido","8 × 400 m","Mini-prueba, barras con pausa arriba","Lago 15–20 min"],
32:["2.500 m: 4 × 250 m","5 × 800 m","Mini-prueba + cuerda 6","Apnea 30–35 m"],
33:["2.500 m: 2 × 500 m (el 2.º más rápido)","2 × 1.600 m","Mini-prueba con 1.600 m","Lago 15 min"],
34:["Descarga: 1.600 m","30 min suave","Fuerza B suave",""],
35:["2.600 m: 10 × 100 m a ritmo meta","6 × 400 m rápido","Mini-prueba completa","Ducha fría 3 min"],

44:["2.800 m: 10 × 100 m","8 × 400 m","Simulacro completo","Sesión de incomodidad"],
45:["3.000 m: 2 × 500 m rápido","5 × 800 m","Mini-prueba + barras con mochila 5 kg","Apnea 40–45 m"],
46:["3.000 m: 1.500 m continuo con aletas","Trote largo 75 min","Simulacro completo","Lago 10 min"],
47:["Descarga: 1.800 m","30 min suave","Fuerza B suave",""],
48:["3.000 m: 16 × 50 m rápido","6 × 400 m rápido","Simulacro completo","Sesión de incomodidad"],
49:["2.800 m: 500 m a ritmo meta × 2","2.400 m cronometrado","Mini-prueba","Apnea 45–50 m"],

};
const STAGES=[
 {n:"Semana 0",name:"Chequeo y prueba inicial",from:0,to:0},
 {n:"Etapa 1",name:"Aprender a nadar crol",from:1,to:13},

];
const stageOf=w=>STAGES.find(s=>w>=s.from&&w<=s.to)||STAGES[4];
const extraOf=w=>(S12[w]?S12[w][4]:S34[w]?S34[w][3]:"")||"";
function carry(w,re,def){let v=def;for(let i=1;i<=w;i++){const e=extraOf(i);if(re.test(e))v=e}return v}

const SEG_APNEA="Con compañero o salvavidas avisado. Nunca hiperventilar antes.";
const SEG_LAGO="Solo acompañado, con boya de color y gorra llamativa, paralelo a la orilla. Sin compañero: piscina.";
const ASECO="Acostado, en casa, nunca en el agua ni en la tina. 8 apneas de 1 min; descansos que bajan de 2:00 a 0:15.";
const CORE="Core 15 min: plancha, plancha lateral, hollow hold, abdominales.";

function T(id,t,d,h,safe){return {id,t,d:d||"",h:h||"",safe:safe||""}}
function noche(w){return T("noche","Noche: visualización 5 min + cama 22:30","Imagina la prueba completa, con el cansancio incluido, y te ves terminando. Sin pantalla los últimos 30 min."+(DELOAD.includes(w)?" Semana de descarga: duerme más.":"")+(w===51?" Esta semana: 9 h.":""),"22:00")}

function dayPlan(w,dow){
  const deload=DELOAD.includes(w), st=stageOf(w);
  let tasks=[], title="", kind="tierra";
  if(w===0){
    const W0=[

/* ============ METAS ============ */
const GOALS={
 13:{apnea:15,sinParar:1,barras:10,sent:70,flex:50,abd:55,run:"10:30"},
 26:{apnea:25,crol:1,sinParar:1,barras:13,sent:80,flex:65,abd:65,run:"10:00"},
 39:{apnea:35,swim:"11:00",barras:15,sent:90,flex:75,abd:75,run:"9:30"},
 52:{apnea:50,swim:"9:30",barras:18,sent:100,flex:85,abd:85,run:"9:00"}
};
const toSec=s=>{if(!s)return NaN;const p=String(s).trim().split(":").map(Number);if(p.some(isNaN))return NaN;return p.length===2?p[0]*60+p[1]:p[0]};
function evalTest(w,t){
  const g=GOALS[w];if(!g||!t)return null;const rows=[];
  const num=k=>Number(t[k]);
  rows.push(["Apnea dinámica",(t.apnea||"—")+" m","≥ "+g.apnea+" m",num("apnea")>=g.apnea]);
  if(g.swim) rows.push(["500 m libre",t.swim||"—","< "+g.swim,toSec(t.swim)<toSec(g.swim)]);
  else rows.push(["500 m libre",(t.swim||"—")+(t.sinParar?" · sin parar":"")+(t.crol?" · crol":""),g.crol?"crol sin parar":"sin parar",!!t.sinParar&&(!g.crol||!!t.crol)]);
  rows.push(["Barras",t.barras||"—","≥ "+g.barras,num("barras")>=g.barras]);
  rows.push(["Sentadillas 2 min",t.sent||"—","≥ "+g.sent,num("sent")>=g.sent]);
  rows.push(["Flexiones 2 min",t.flex||"—","≥ "+g.flex,num("flex")>=g.flex]);
  rows.push(["Abdominales 2 min",t.abd||"—","≥ "+g.abd,num("abd")>=g.abd]);
  rows.push(["2.400 m",t.run||"—","< "+g.run,toSec(t.run)<toSec(g.run)]);
  return {rows,pass:rows.every(r=>r[3]),fails:rows.filter(r=>!r[3]).map(r=>r[0])};
}

const pad=n=>String(n).padStart(2,"0");
const iso=d=>d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const parse=s=>{const [y,m,d]=s.split("-").map(Number);return new Date(y,m-1,d)};
const addDays=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x};
const diffDays=(a,b)=>Math.round((parse(iso(a))-parse(iso(b)))/864e5);
const mondayOf=d=>addDays(d,-((d.getDay()+6)%7));
const MES=["ene","feb","mar","abr","may","jun","jul","ago","sep","oct","nov","dic"];

/* ============ ALMACENAMIENTO ============ */
const LS="bitacora-buzo-v1";
const defCfg=()=>({name:"Diego",start:iso(mondayOf(new Date())),sched:Array.from({length:53},(_,i)=>i),repeats:[]});
const clone=o=>JSON.parse(JSON.stringify(o||{}));
const Store={mode:"local",cfg:defCfg(),days:{},timers:{},chains:{},
  loadLocal(){try{const r=JSON.parse(localStorage.getItem(LS)||"null");if(r){this.cfg=Object.assign(defCfg(),r.cfg||{});this.days=r.days||{}}}catch(e){}},
  saveLocal(){try{localStorage.setItem(LS,JSON.stringify({cfg:this.cfg,days:this.days}))}catch(e){}},
  async init(cb){
    this.cb=cb;this.loadLocal();cb();
    try{
      if(!window.claude||!window.claude.use)return;
      const [db,user]=await Promise.all([window.claude.use("db"),window.claude.use("user")]);
      if(!db||!user)return;const uid=await user.id();if(!uid)return;
      this.planRef=db.doc("data/users/"+uid+"/plan");this.daysCol=this.planRef.collection("days");
      const localCfg=clone(this.cfg),localDays=clone(this.days);let gotCfg=false,gotDays=false;
      this.mode="db";
      this.planRef.onSnapshot(s=>{
        if(s.exists){this.cfg=Object.assign(defCfg(),clone(s.data()))}
        else if(!gotCfg){this.cfg=localCfg;this.queue("plan")}
        gotCfg=true;this.saveLocal();cb();
      },()=>{});
      this.daysCol.limit(1000).onSnapshot(q=>{
        const d={};q.docs.forEach(x=>{d[x.id]=clone(x.data())});
        if(!gotDays&&q.empty&&Object.keys(localDays).length){this.days=localDays;Object.keys(localDays).forEach(k=>this.queue(k))}
        else{Object.keys(this.timers).forEach(k=>{if(k!=="plan"&&this.days[k])d[k]=this.days[k]});this.days=d}
        gotDays=true;this.saveLocal();cb();
      },()=>{});
    }catch(e){this.mode="local"}
  },
  day(k){return this.days[k]||(this.days[k]={})},
  setDay(k,patch){Object.assign(this.day(k),patch);this.saveLocal();this.queue(k)},
  setCfg(patch){Object.assign(this.cfg,patch);this.saveLocal();this.queue("plan")},
  queue(k){
    if(this.mode!=="db")return;clearTimeout(this.timers[k]);
    this.timers[k]=setTimeout(()=>{
      const body=clone(k==="plan"?this.cfg:this.days[k]);
      const ref=k==="plan"?this.planRef:this.daysCol.doc(k);
      this.chains[k]=(this.chains[k]||Promise.resolve()).then(()=>ref.set(body)).catch(()=>{flash("No se pudo guardar en la nube; queda guardado en este dispositivo.")}).finally(()=>{delete this.timers[k]});
    },500);
  }
};

/* ============ MAPEO DÍA → SEMANA ============ */
function locate(date){
  const start=parse(Store.cfg.start);const n=diffDays(date,start);
  if(n<0)return {before:true,n};
  const idx=Math.floor(n/7),dow=n%7,sched=Store.cfg.sched;
  if(idx>=sched.length)return {after:true,n,idx,dow};
  return {n,idx,dow,w:sched[idx]};
}
function dayStatus(k,plan){
  const d=Store.days[k];if(!d)return "";
  if(d.status)return d.status;
  if(!plan)return "";const c=d.checks||{};const done=plan.tasks.filter(t=>c[t.id]).length;
  if(done===plan.tasks.length)return "done";return done?"part":"";
}
function planFor(date){const L=locate(date);if(L.w===undefined)return null;return dayPlan(L.w,L.dow)}
function streak(){
  const today=new Date();let n=0;let d=today;
  const st0=dayStatus(iso(d),planFor(d));
  if(!(st0==="done"||st0==="injury"))d=addDays(d,-1);
  for(let i=0;i<800;i++){const L=locate(d);if(L.before)break;const s=dayStatus(iso(d),planFor(d));if(s==="done"||s==="injury"){n++;d=addDays(d,-1)}else break}
  return n;
}
function compliance(){
  const today=new Date();const start=parse(Store.cfg.start);let tot=0,ok=0;
  for(let d=start;diffDays(d,today)<0;d=addDays(d,1)){const p=planFor(d);if(!p)break;tot++;const s=dayStatus(iso(d),p);if(s==="done"||s==="injury")ok++}
  return tot?Math.round(ok/tot*100):null;
}

/* ============ VOZ DEL COMANDANTE ============ */
function hash(s){let h=0;for(const c of s)h=(h*31+c.charCodeAt(0))|0;return Math.abs(h)}
const pick=(arr,k)=>arr[hash(k)%arr.length];
function orders(plan,k,isToday,L){
  const N=Store.cfg.name||"recluta";const out=[];
  const OPEN=[`Recluta ${N}. Semana ${plan.w}, ${DIAS[plan.dow].toLowerCase()}. Esto es lo que haces hoy.`,`Arriba, ${N}. 06:30. Nadie va a hacer esto por ti.`,`Atención, ${N}. Orden del día. Sin discusión.`,`${N}. Querías saber si puedes. Hoy se sigue respondiendo.`,`De pie, ${N}. Agua, algo liviano y a cumplir.`];
  out.push(["say",pick(OPEN,k)]);
  const sw=plan.tasks.find(t=>t.id==="swim"),rn=plan.tasks.find(t=>t.id==="run");
  if(plan.kind==="prueba"&&plan.test){out.push(["p",plan.w===0?"Hoy se mide el punto de partida. No importa lo bajo que salga: importa que sea verdad. Máximo 3 minutos entre ejercicios. Anota todo abajo.":plan.w===52?"Prueba final. 52 semanas para llegar aquí. Ejecuta igual que siempre y compara con la semana 0.":"Día de prueba. Aquí se ve quién entrenó y quién solo marcó casillas. Máximo 3 minutos entre ejercicios. Anota cada número."])}
  else if(plan.kind==="prueba"){out.push(["p","Simulacro completo. Es la prueba de ingreso entera, cansado, sin regalos. Lo que más te cueste hoy recibe una sesión extra la semana que viene."])}
  else if(plan.kind==="descanso"){out.push(["p",pick(["Hoy descansas. Es una orden, no un premio. El cuerpo se adapta mientras descansa.","Descanso. Si te sobran ganas, guárdalas para mañana. 22:30 a la cama.","Día libre. El progreso ocurre cuando descansas, no cuando entrenas. Cumple esta orden también."],k)])}
  else if(plan.kind==="admin"){out.push(["p","Semana 0. Antes de mojarte, se prepara el terreno. Cada tarea de hoy es tan obligatoria como un entrenamiento."])}
  else if(sw){out.push(["p",pick(["A la piscina a las 07:00. El agua es tu punto débil; por eso es donde más vas a estar.","Piscina. El agua no te va a regalar nada, así que tú tampoco le regales metros.","Al agua. Cada largo que hoy cuesta es uno que en el curso no te va a hundir."],k)])}
  else if(rn){out.push(["p",pick(["Calle. Tu punto fuerte no se regala: se mantiene.","A correr. Ritmo exacto, ni más ni menos. Disciplina también es no pasarse.","Afuera. Correr es tu terreno. Demuéstralo con constancia, no con ego."],k)])}
  else out.push(["p","Fuerza y formato continuo. Encadena sin pausas, como en la prueba."]);
  if(plan.deload&&plan.kind!=="descanso")out.push(["p","Semana de descarga: la carga baja a propósito. No te la saltes por orgullo."]);
  if(plan.dow===0&&plan.w>0)out.push(["p","Lunes: anota tu peso abajo."]);
  if(isToday){
    const yd=addDays(new Date(),-1),yp=planFor(yd),ys=yp?dayStatus(iso(yd),yp):"done";
    if(yp&&ys!=="done"&&ys!=="injury")out.unshift(["alert",ys==="fail"?"Ayer fallaste. Un día perdido no te saca del curso; dos seguidos empiezan a hacerlo. Hoy cumples.":"Ayer no reportaste. En el curso nadie te pregunta dos veces. Cierra el día de ayer y cumple el de hoy."]);
  }
  out.push(["p",pick(["Dolor agudo, localizado o que empeora: paras y consultas. Cansancio general: sigues.","Cuando cueste: “esto es lo que vine a entrenar”. Reporta al terminar.","Metas cortas: hasta el otro borde, hasta la próxima vuelta. Reporta al terminar."],k+"c")]);
  return out;
}
function reply(status,plan,k){
  if(status==="done")return pick(["Misión cumplida. Anotado. Mañana a la misma hora.","Bien. Eso es lo que se espera de ti. Descansa y repite mañana.","Cumplido. Un día más que el que se rinde no tiene."],k);
  if(status==="injury")return "Bien hecho al parar. Un buzo lesionado no sirve. Consulta y reporta. Este día no rompe tu racha.";
  if(status==="fail")return "Anotado. No hay excusas, solo hechos. Mañana cumples sin discusión.";
  if(status==="part")return "Va a medias. La orden está incompleta.";
  return "";
}

function viewReglas(){

  <li><b>Diálogo interno:</b> cambia “no puedo más” por “esto es lo que vine a entrenar”.</li>
  <li><b>Visualización:</b> 5 min antes de dormir, la prueba completa con el cansancio incluido, y te ves terminando.</li>

  <h3>Alimentación</h3><ul><li>4 comidas reales al día: desayuno, almuerzo, once, cena.</li><li>Proteína en cada comida: unos 1,6 g por kilo de peso al día.</li><li>Carbohidratos suficientes (arroz, papas, avena, pan, fideos), sobre todo en días de mucho volumen.</li><li>Verduras y fruta a diario; pescado 2 veces por semana.</li><li>Agua: 2,5–3 L al día.</li><li>Sin alcohol ni bebidas energéticas.</li></ul>
  <h3>Señales de sobrecarga</h3><p>Pulso en reposo más alto de lo normal varios días, mal sueño, desgano o dolor que no se va: 2–3 días suaves antes de seguir. Usa el botón “Dolor / lesión” y no rompes la racha.</p>
  <h3>Recursos</h3><ul><li>Piscina San Ignacio / DMOOV (Puerto Varas): clases de crol, nado y apnea supervisada.</li><li>Puerto Varas Diving: curso Open Water y salidas de nado en el lago.</li><li>Quinta Zona Naval (Puerto Montt): requisitos y fechas de postulación.</li></ul>

  if(el.dataset.c==="start"&&el.value){const m=iso(mondayOf(parse(el.value)));Store.setCfg({start:m});el.blur();if(m!==el.value)flash("El inicio se ajustó al lunes "+fmt(parse(m))+".");else render()}
  if(el.dataset.t)render();
});
Store.init(render);
})();
</script>
