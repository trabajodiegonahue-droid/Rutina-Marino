<title>Bitácora Buzo Táctico</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Saira+Stencil+One&family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@500;600;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: una columna para el celular. Arriba el día, después la orden, cómo amaneciste y las sesiones plegables; navegación fija abajo. */
:root{
  /* Mundo único: puente de mando de noche. Azul marino profundo, latón de insignia y rojo de señal. */
  --bg:#06111D; --paper:#0C1D31; --paper2:#10263F; --ink:#E7EEF5; --muted:#8DA3BA; --line:#1D3954;
  --accent:#D6AA4C; --accent-ink:#1A1204; --ok:#45B377; --warn:#E5A33C; --bad:#E2553E; --chip:#132B47;
  --grid:rgba(141,163,186,.06);
  --f-display:"Saira Stencil One","Impact","Arial Narrow",sans-serif;
  --f-body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-label:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{background:var(--bg);color:var(--ink)}
body{background-color:var(--bg);background-image:radial-gradient(120% 60% at 50% -10%,rgba(214,170,76,.10),transparent 60%),linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:auto,36px 36px,36px 36px;background-attachment:fixed}
body{font-family:var(--f-body);font-size:16px;line-height:1.45;padding:0 16px calc(150px + env(safe-area-inset-bottom,0px))}
.wrap{max-width:640px;margin:0 auto;padding-block:14px 24px;display:flex;flex-direction:column;gap:14px}
h1,h2,h3{margin:0;text-wrap:balance}
button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
button:focus-visible,input:focus-visible,textarea:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.lbl{font-family:var(--f-label);text-transform:uppercase;letter-spacing:.08em;font-size:13px;color:var(--muted);font-weight:600}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.foot{font-size:13px;color:var(--muted);margin:0}

/* cuartel: emblema y rango */
.hq{display:flex;align-items:center;gap:12px;padding-bottom:10px;border-bottom:1px solid var(--line)}
.hq svg{flex:none;width:46px;height:46px}
.hq>div:nth-child(2){min-width:0;flex:1}
.hq .streak{flex:none}
.hq .t{font-family:var(--f-label);font-weight:700;letter-spacing:.1em;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--accent);text-transform:uppercase}
.hq .rk{display:flex;align-items:center;gap:8px;font-family:var(--f-label);font-weight:700;text-transform:uppercase;letter-spacing:.06em;font-size:16px}
.hq .rk .chev{display:inline-flex;flex-direction:column;gap:2px}
.hq .rk .chev i{display:block;width:16px;height:5px;background:var(--accent);clip-path:polygon(0 100%,50% 0,100% 100%,82% 100%,50% 36%,18% 100%)}
.hq .streak{margin-left:auto;text-align:right;font-family:var(--f-label);text-transform:uppercase;letter-spacing:.06em;font-size:12px;color:var(--muted)}
.hq .streak b{display:block;font-family:var(--f-display);font-size:26px;color:var(--ink);line-height:1;font-weight:400}
/* cabecera del día */
.day{display:grid;grid-template-columns:auto minmax(0,1fr) auto auto;gap:8px;align-items:center}
.day .mid{text-align:center;min-width:0}
.day .big{color:var(--ink);letter-spacing:.02em;font-family:var(--f-display);font-size:clamp(17px,5.6vw,30px);line-height:1.05;white-space:normal;overflow-wrap:anywhere}
.bigtext .day .big{font-size:clamp(15px,4.8vw,26px)}
.day .sub{font-size:13px;color:var(--muted)}
.nb{background:var(--paper);border:1px solid var(--line);border-radius:8px;min-width:44px;height:44px;font-family:var(--f-label);font-weight:700;padding:0 10px}
.nb.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.stage{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;font-family:var(--f-label);font-weight:700;text-transform:uppercase;letter-spacing:.05em;font-size:14px}
.stage .st{color:var(--accent)}

/* orden */
.order{background:linear-gradient(180deg,var(--paper2),var(--paper));border:1px solid var(--line);border-left:4px solid var(--accent);padding:12px 14px;display:flex;flex-direction:column;gap:6px;border-radius:4px;position:relative;overflow:hidden}
.msg-h{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;font-family:var(--f-mono);font-size:11px;letter-spacing:.06em;color:var(--accent);text-transform:uppercase;padding-bottom:6px;border-bottom:1px dashed var(--line)}
.stamp{position:absolute;right:10px;top:8px;transform:rotate(-8deg);border:3px solid var(--ok);color:var(--ok);font-family:var(--f-display);font-size:22px;padding:2px 10px;border-radius:4px;letter-spacing:.06em;opacity:.9}
.order.done{padding-top:46px}
.order .say{font-family:var(--f-label);font-weight:700;font-size:20px;text-transform:uppercase;letter-spacing:.02em;line-height:1.15;margin:0}
.order p{margin:0}
.why-q{font-style:italic;border-left:3px solid var(--accent);padding-left:10px}
.start{font-size:18px;padding:16px}
.run{display:flex;flex-direction:column;gap:12px;min-height:70vh}
.rhead{display:flex;justify-content:space-between;align-items:center}
.rbody{display:flex;flex-direction:column;gap:12px;background:linear-gradient(180deg,var(--paper2),var(--paper));border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:4px;padding:16px}
.rbody p{margin:0}
.rbig{font-family:var(--f-display);font-size:clamp(30px,9vw,44px);line-height:1.05}
.rname{font-family:var(--f-label);font-weight:700;font-size:18px;text-transform:uppercase;letter-spacing:.03em}
.rname b{color:var(--accent)}
.rcmd{font-size:clamp(21px,5.6vw,26px);font-weight:700;line-height:1.3}
.rcmd{white-space:pre-line}
.how{background:var(--bg);border-radius:6px;padding:10px 12px;display:flex;flex-direction:column;gap:4px}
.how p{font-size:15px;line-height:1.45}
details.hw summary{font-size:13px;color:var(--accent);cursor:pointer;font-weight:600}
details.hw p{margin:6px 0 0;font-size:14px}
.glance{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:6px;font-size:15px}
.glance b{font-family:var(--f-mono);font-size:13px}
.runlog{margin-top:10px;padding:10px 12px;border:1px dashed var(--line);border-radius:6px;display:flex;flex-direction:column;gap:8px}
.rlf{display:grid;grid-template-columns:repeat(auto-fit,minmax(90px,1fr));gap:8px}
.rlv{margin:0;font-size:14px;color:var(--muted)}
.rlv.ok{color:var(--ok);font-weight:600}.rlv.warn{color:var(--warn);font-weight:600}.rlv.bad{color:var(--bad);font-weight:600}
.savechip{display:block;margin-top:4px;font-family:var(--f-label);font-size:12px;letter-spacing:.04em;text-transform:none;color:var(--muted);white-space:nowrap}
.savechip.ok{color:var(--ok)}.savechip.busy{color:var(--warn)}.savechip.err{color:var(--bad)}
label.btn{display:inline-block;cursor:pointer}
.nowline{margin:0;font-family:var(--f-label);font-size:15px;letter-spacing:.02em;color:var(--accent);border-left:3px solid var(--accent);padding:4px 10px;background:var(--paper)}
.charts{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:10px}
.chartbox{background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:10px 12px;min-width:0}
.ctitle{font-family:var(--f-label);font-size:16px;letter-spacing:.03em;text-transform:uppercase}
.chart{width:100%;height:auto;display:block}
.chart .cg{stroke:var(--line);stroke-width:1}
.chart .ct{fill:var(--muted);font-family:var(--f-mono);font-size:10px}
.chart .cv{fill:var(--ink);font-family:var(--f-mono);font-size:12px;font-weight:600}
.chart .cl{fill:none;stroke:var(--accent);stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.chart .cd circle{fill:var(--accent);stroke:var(--paper);stroke-width:2}
.chart .cd{cursor:pointer;outline:none}.chart .cd circle.hit{fill:transparent;stroke:none}.chart .cd.sel circle:not(.hit),.chart .cd:focus-visible circle:not(.hit){stroke:var(--ink);stroke-width:3}
.cval{margin:2px 0 0;min-height:1.3em}
.chart .cgoal path{fill:none;stroke:var(--muted);stroke-width:1.5}
.chart g{cursor:default}
.hmwrap{display:flex;flex-direction:column;gap:10px;overflow-x:auto}
.hmg{display:flex;flex-direction:column;gap:4px}
.hm{display:grid;grid-template-rows:repeat(7,22px);gap:3px}
.hc{width:100%;min-width:18px;height:22px;border-radius:3px;border:0;padding:0;background:var(--chip)}
.hc.done{background:var(--ok)}.hc.part{background:color-mix(in srgb,var(--ok) 40%,var(--chip))}
.hc.injury{background:repeating-linear-gradient(45deg,var(--warn) 0 3px,color-mix(in srgb,var(--warn) 55%,var(--chip)) 3px 6px)}
.hc.fail{background:var(--bad)}.hc.missed{background:transparent;box-shadow:inset 0 0 0 1.5px var(--bad)}
.hc.future{background:transparent;box-shadow:inset 0 0 0 1px var(--line)}.hc.today{background:transparent;box-shadow:inset 0 0 0 2px var(--accent)}
.legend{display:flex;flex-wrap:wrap;gap:6px 12px;font-size:13px;color:var(--muted)}
.lg{display:inline-flex;align-items:center;gap:6px}.lg i{display:inline-block;width:14px;height:14px}
.kpis.rec{grid-template-columns:repeat(auto-fill,minmax(110px,1fr))}
.kpis.rec b{font-size:20px}
.li.diary{align-items:start}.dnote{display:block;color:var(--muted);font-size:14px;white-space:pre-line;margin-top:2px}
.guided .timerbar{bottom:calc(64px + env(safe-area-inset-bottom,0px))}
body.timing:not(.guided){padding-bottom:calc(230px + env(safe-area-inset-bottom,0px))}.bigtext body.timing:not(.guided){padding-bottom:calc(270px + env(safe-area-inset-bottom,0px))}
body.guided{padding-bottom:calc(420px + env(safe-area-inset-bottom,0px))}
.guided .tin{grid-template-columns:1fr;padding:16px}
.guided .tin .tl{flex-direction:column;align-items:center;gap:0}
.guided .tin .tl b{font-size:clamp(52px,17vw,96px);line-height:1}
.guided .tin .bar{height:14px}
.guided .tin .nb{grid-row:auto;grid-column:auto;height:52px;font-size:18px}
.bigtext .wrap,.bigtext .timerbar,.bigtext nav.tabs{zoom:1.15}
.rset{font-family:var(--f-label);font-weight:700;font-size:22px;text-transform:uppercase;color:var(--accent)}
.rwhat{font-size:22px;font-weight:600}
.rnote{font-size:15px;color:var(--muted)}
.rdone{font-size:22px;padding:18px}
.btn[disabled]{opacity:.35}
.alert{background:repeating-linear-gradient(-45deg,rgba(226,85,62,.12) 0 10px,transparent 10px 20px);border:1px solid var(--bad);color:var(--bad);padding:8px 12px;font-weight:600;font-size:15px;margin:0}

/* cómo amaneciste */
.mode{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.mode button{border:2px solid var(--line);background:var(--paper);border-radius:8px;padding:10px 4px;font-family:var(--f-label);font-weight:700;text-transform:uppercase;letter-spacing:.04em;font-size:15px}
.seg.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.mode button.on.m-ok{background:var(--ok);border-color:var(--ok);color:var(--paper)}
.mode button.on.m-cansado{background:var(--warn);border-color:var(--warn);color:var(--paper)}
.mode button.on.m-dolor{background:var(--bad);border-color:var(--bad);color:var(--paper)}
.modetxt{font-size:15px;margin:0;font-weight:600}

/* progreso */
.bar{height:10px;background:var(--chip);border-radius:2px;overflow:hidden;background-image:repeating-linear-gradient(90deg,transparent 0 9.5%,rgba(6,17,29,.55) 9.5% 10%)}
.bar i{display:block;height:100%;background:linear-gradient(90deg,#B98B2E,var(--accent))}
.prog{display:flex;flex-direction:column;gap:6px}
.prog .row{display:flex;justify-content:space-between;gap:8px}

/* sesiones */
.ses{background:var(--paper);border:1px solid var(--line);border-radius:6px;overflow:hidden;box-shadow:inset 3px 0 0 var(--line)}
.ses:not(.done){box-shadow:inset 3px 0 0 var(--accent)}
.ses.done{border-color:var(--ok)}
.sh{display:grid;grid-template-columns:44px 1fr 28px;gap:10px;align-items:center;padding:12px}
.chk{width:36px;height:36px;border:2px solid var(--ink);border-radius:6px;background:none;display:grid;place-items:center;padding:0}
.ses.done .chk{background:var(--ok);border-color:var(--ok)}
.ses.done .chk::after{content:"";width:13px;height:7px;border-left:3px solid var(--paper);border-bottom:3px solid var(--paper);transform:rotate(-45deg) translate(1px,-1px)}
.tog{background:none;border:0;text-align:left;padding:0;min-width:0;display:flex;flex-direction:column}
.tog .t{font-weight:700;font-size:17px;line-height:1.2}
.tog .m{font-family:var(--f-mono);font-size:12px;color:var(--muted);margin-top:3px}
.chev{background:none;border:0;font-size:18px;color:var(--muted);padding:0;height:36px}
.sb{border-top:1px solid var(--line);padding:4px 12px 12px;display:flex;flex-direction:column}
.sb .why{font-size:14px;color:var(--muted);margin:8px 0 2px}
.safe{font-size:13px;color:var(--bad);font-weight:600;margin:8px 0 0}
.ex{padding-block:12px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:6px}
.ex:last-child{border-bottom:0}
.ex .top{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.ex .n{font-weight:700;font-size:16px}
.ex.full .n{color:var(--ok)}
.ex .p{font-family:var(--f-mono);font-size:15px;font-weight:600}
.ex .note{font-size:13px;color:var(--muted)}
.ctl{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.dot{width:36px;height:36px;border:2px solid var(--ink);border-radius:50%;background:transparent;font-family:var(--f-mono);font-size:13px;padding:0}
.dot.on{background:var(--ok);border-color:var(--ok);color:var(--paper)}
.cnt{font-family:var(--f-mono);min-width:56px;text-align:center}
.tmr{border:1px solid var(--line);background:var(--bg);border-radius:18px;padding:6px 12px;font-family:var(--f-mono);font-size:13px}
.tmr.rest{color:var(--muted)}

/* tarjetas y formularios */
.card{background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:14px;display:flex;flex-direction:column;gap:12px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field input,.field textarea{background:var(--bg);border:1px solid var(--line);color:var(--ink);border-radius:6px;padding:9px 10px;font:inherit;font-family:var(--f-mono);font-size:16px;width:100%}
.field textarea{font-family:var(--f-body);min-height:70px;resize:vertical}
.btn{border:2px solid var(--ink);background:transparent;padding:12px;border-radius:8px;font-family:var(--f-label);font-weight:700;text-transform:uppercase;letter-spacing:.05em;font-size:15px}
.btn.main{background:linear-gradient(180deg,#E3BC63,var(--accent));border-color:var(--accent);color:var(--accent-ink);box-shadow:0 2px 0 #8C6B23}
.btn{border-color:var(--ink);color:var(--ink)}
.btn.sm{padding:8px 10px;font-size:13px}
.segs{display:flex;gap:4px;flex-wrap:wrap}
.seg{border:1px solid var(--line);background:var(--bg);border-radius:6px;padding:8px 12px;font-size:15px}
.seg.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
details.card summary{font-family:var(--f-label);font-weight:700;text-transform:uppercase;letter-spacing:.06em;font-size:14px;cursor:pointer}
.testform{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.cb{display:flex;gap:8px;align-items:center;font-size:15px}
.cb input{width:22px;height:22px}
.verdict{border:2px solid var(--ink);border-radius:8px;padding:12px;display:flex;flex-direction:column;gap:8px}
.verdict.good{border-color:var(--ok)}.verdict.bad{border-color:var(--bad)}
.verdict b{font-family:var(--f-label);font-size:19px;text-transform:uppercase}

/* plan / progreso / guía */
.sec{display:flex;flex-direction:column;gap:10px}
.sec h2{font-family:var(--f-display);font-size:28px;font-weight:400;line-height:1}
.sec h3{font-family:var(--f-label);font-size:18px;text-transform:uppercase;letter-spacing:.04em}
.weeks{display:grid;grid-template-columns:repeat(auto-fill,minmax(42px,1fr));gap:6px}
.wc{border:1px solid var(--line);background:var(--paper);padding:7px 2px;text-align:center;border-radius:6px;font-family:var(--f-mono);font-size:13px}
.wc.test{border:2px solid var(--ink);font-weight:600}
.wc.hell{border:2px solid var(--bad);color:var(--bad);font-weight:600}
.wc.cur{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.wc.sel{outline:2px solid var(--ink);outline-offset:1px}
.wc i{display:block;height:3px;background:var(--ok);margin:4px 4px 0;border-radius:2px}
.list{display:flex;flex-direction:column;border:1px solid var(--line);background:var(--paper);border-radius:8px;overflow:hidden}
.li{display:grid;grid-template-columns:70px 1fr auto;gap:10px;align-items:center;padding:11px 12px;border:0;border-top:1px solid var(--line);background:none;text-align:left;width:100%}
.li:first-child{border-top:0}
.li .a{font-family:var(--f-label);font-weight:700;text-transform:uppercase;font-size:14px;line-height:1.1}
.li .a span{display:block;font-family:var(--f-mono);font-weight:400;font-size:11px;color:var(--muted);text-transform:none}
.li .b{min-width:0;font-size:15px}
.chip{font-family:var(--f-label);font-weight:700;text-transform:uppercase;letter-spacing:.05em;padding:3px 8px;border-radius:4px;font-size:12px;background:var(--chip);color:var(--muted)}
.chip.done{background:var(--ok);color:var(--paper)}.chip.fail{background:var(--bad);color:var(--paper)}.chip.injury{background:var(--warn);color:var(--paper)}.chip.part{color:var(--ink)}
.kpis{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}.kpi{min-width:0;overflow-wrap:anywhere}
.kpi{background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:10px;display:flex;flex-direction:column}
.kpi b{font-family:var(--f-mono);font-size:24px}
.tbl{overflow-x:auto;border:1px solid var(--line);background:var(--paper);border-radius:8px}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
th{font-family:var(--f-label);text-transform:uppercase;letter-spacing:.05em;font-size:12px;color:var(--muted)}
td.mono{font-family:var(--f-mono)}
.pass{color:var(--ok);font-weight:600}.miss{color:var(--bad);font-weight:600}
.prose p{margin:0 0 8px}
.prose ul{margin:0 0 8px;padding-left:20px;display:flex;flex-direction:column;gap:6px}
.prose a{color:var(--accent)}

/* temporizador y navegación */
.timerbar{position:fixed;left:0;right:0;bottom:calc(56px + env(safe-area-inset-bottom,0px));z-index:6;padding:0 12px 8px;display:flex;justify-content:center}
.tin{max-width:640px;width:100%;background:var(--paper);border:2px solid var(--accent);border-radius:10px;padding:10px 12px;display:grid;grid-template-columns:1fr auto;gap:6px 12px;align-items:center;box-shadow:0 6px 20px rgba(0,0,0,.18)}
.tin .tl{display:flex;justify-content:space-between;align-items:baseline;gap:10px;min-width:0}
.tin .tl b{font-size:30px}
.tin .nb{grid-row:1/3;grid-column:2}
.timerbar{flex-direction:column;align-items:center;gap:6px}.tin.safe{border-color:var(--ink)}.tin.safe.done{background:var(--bad);border-color:var(--bad);color:#fff}.tin.safe.done .lbl,.tin.safe.done b{color:#fff}
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:#030A12;border-top:1px solid var(--line);display:flex;justify-content:center;padding:0 8px env(safe-area-inset-bottom,0px);z-index:5}
nav.tabs .in{display:grid;grid-template-columns:repeat(4,1fr);max-width:640px;width:100%}
nav.tabs button{background:none;border:0;color:var(--ink);opacity:.55;padding:10px 4px 12px;display:flex;flex-direction:column;align-items:center;gap:3px;font-family:var(--f-label);font-weight:700;text-transform:uppercase;letter-spacing:.06em;font-size:15px}
nav.tabs button.on{opacity:1;color:var(--accent);box-shadow:inset 0 3px 0 var(--accent)}
nav.tabs svg{width:22px;height:22px}

<script>
(function(){
"use strict";
/* =================== DATOS DEL PLAN =================== */
const DIAS=["Lunes","Martes","Miércoles","Jueves","Viernes","Sábado","Domingo"];
const TESTS=[0,13,26,39,52];
const DELOAD=[4,8,12,17,21,25,30,34,38,43,47,51];
const HELL=48;
const S12={
1:["600 m: drills con tabla, tramos de 25 m","30 min suave","Intervalos 4 × 400 m","Fuerza B 3 vueltas","Ducha fría 30 s"],
2:["700 m: drills + 6 × 25 m crol","30 min suave","Intervalos 5 × 400 m","Fuerza B 3 vueltas","Apnea en seco"],
3:["800 m: 8 × 25 m crol, 2 × 50 m","35 min suave","Intervalos 6 × 400 m","Fuerza B 4 vueltas","Ducha fría 1 min"],
4:["Descarga: 600 m solo técnica","30 min suave","","Fuerza B 3 vueltas","Dormir más"],
5:["900 m: 6 × 50 m crol","35 min suave","Intervalos 4 × 800 m","Fuerza B 4 vueltas, barras 6","Apnea piscina: 10–15 m"],
6:["1.000 m: 4 × 75 m, 4 × 50 m","40 min suave","Intervalos 6 × 400 m rápido","Fuerza B 4 vueltas, flexiones 18","Ducha fría 1:30"],
7:["1.100 m: 3 × 100 m crol","40 min suave","Intervalos 5 × 800 m","Fuerza B 5 vueltas","Apnea piscina: 15 m"],
8:["Descarga: 700 m técnica","30 min suave","","Fuerza B 3 vueltas",""],
9:["1.200 m: 4 × 100 m, 200 m continuo","45 min suave","Intervalos 3 × 1.200 m","Fuerza B 5 vueltas, barras 7","Ducha fría 2 min"],
10:["1.300 m: 2 × 200 m, drills","45 min suave","Intervalos 6 × 400 m","Fuerza B 5 vueltas, sentadillas 25","Apnea piscina: 15–20 m"],
11:["1.400 m: 300 m continuo + 4 × 100 m","45 min suave","Intervalos 4 × 800 m","Fuerza B 5 vueltas, abdominales 25","Ducha fría 2 min"],
12:["Descarga: 1.000 m suave; prueba 400 m continuo","30 min suave","","Fuerza B 3 vueltas","Dormir más"],
14:["1.500 m: 6 × 100 m + 300 m","45 min","Intervalos 6 × 400 m","Fuerza B 4 vueltas","Primer nado en lago 10 min, acompañado, cerca de la orilla"],
15:["1.600 m: 2 × 300 m + 4 × 100 m","50 min","Intervalos 4 × 800 m","Fuerza B 4 vueltas + cuerda","Apnea 20 m"],

18:["1.800 m: 8 × 100 m","55 min","Intervalos 6 × 400 m rápido","Fuerza B 5 vueltas, barras 7","Lago 20 min"],

20:["2.000 m: 3 × 400 m","60 min","","Fuerza B 5 vueltas, flexiones 22","Lago 25 min"],
21:["Descarga: 1.400 m","35 min suave","","Fuerza B 3 vueltas","Dormir más"],
22:["2.000 m: 10 × 100 m a ritmo de 500 m","60 min","Intervalos 3 × 1.600 m","Fuerza B 6 vueltas","Lago 30 min"],
23:["2.200 m: 800 m continuo + 6 × 100 m","60 min","Intervalos 6 × 400 m","Fuerza B 6 vueltas, barras 8","Apnea 25 m"],
24:["2.200 m: 2 × 500 m cronometrado","50 min","4 × 200 m rápido","Fuerza B 6 vueltas, cuerda 5","Lago 30–35 min"],
25:["Descarga: 1.500 m; ensayo 500 m","35 min suave","","Fuerza B 3 vueltas",""]
};
const S34={
27:["2.200 m: 10 × 50 m rápido + 800 m","6 × 400 m a ritmo 2.400","Mini-prueba 200 m / 1.200 m","Lago 20 min (agua más fría)"],
28:["2.300 m: 5 × 200 m","4 × 800 m","Mini-prueba + cuerda 5","Apnea 30 m"],
29:["2.400 m: 500 m cronometrado + series","3 × 1.200 m","Mini-prueba 300 m","Lago 20 min"],
30:["Descarga: 1.500 m","30 min suave","Fuerza B suave","Dormir más"],
31:["2.400 m: 12 × 50 m rápido","8 × 400 m","Mini-prueba, barras con pausa arriba","Lago 15–20 min"],
32:["2.500 m: 4 × 250 m","5 × 800 m","Mini-prueba + cuerda 6","Apnea 30–35 m"],
33:["2.500 m: 2 × 500 m (el 2.º más rápido)","2 × 1.600 m","Mini-prueba con 1.600 m","Lago 15 min"],
34:["Descarga: 1.600 m","30 min suave","Fuerza B suave",""],
35:["2.600 m: 10 × 100 m a ritmo meta","6 × 400 m rápido","Mini-prueba completa","Ducha fría 3 min"],
36:["2.700 m: 1.000 m continuo + 6 × 50 m","4 × 800 m","Mini-prueba + cuerda 6","Apnea 35 m"],
37:["2.500 m: 500 m cronometrado","2.400 m cronometrado","Mini-prueba","Lago 10–15 min"],
38:["Descarga: 1.500 m","30 min suave","Fuerza B suave","Dormir más"],
40:["2.600 m: 12 × 50 m rápido","6 × 400 m","Mini-prueba","Ducha fría 3 min"],
41:["2.700 m: 5 × 200 m ritmo meta","4 × 800 m","Simulacro completo","Apnea 40 m"],
42:["2.800 m: 1.200 m continuo","3 × 1.200 m","Mini-prueba + cuerda 8","Lago 10 min (invierno)"],
43:["Descarga: 1.800 m","30 min suave","Fuerza B suave","Dormir más"],
44:["2.800 m: 10 × 100 m","8 × 400 m","Simulacro completo","Sesión de incomodidad"],
45:["3.000 m: 2 × 500 m rápido","5 × 800 m","Mini-prueba + barras con mochila 5 kg","Apnea 40–45 m"],
46:["3.000 m: 1.500 m continuo con aletas","Trote largo 75 min","Simulacro completo","Lago 10 min"],
47:["Descarga: 1.800 m","30 min suave","Fuerza B suave",""],
48:["3.000 m: 16 × 50 m rápido","6 × 400 m rápido","Simulacro completo","Sesión de incomodidad"],
49:["2.800 m: 500 m a ritmo meta × 2","2.400 m cronometrado","Mini-prueba","Apnea 45–50 m"],
50:["2.500 m: series cortas","4 × 400 m","Simulacro completo","Ducha fría 3 min"],
51:["Descarga fuerte: 1.500 m suave","25 min suave","Solo movilidad","Dormir 9 h"]
};

const STAGES=[
 {n:"Semana 0",name:"Chequeo y prueba inicial",from:0,to:0},
 {n:"Etapa 1",name:"Aprender a nadar crol",from:1,to:13},
 {n:"Etapa 2",name:"Resistencia",from:14,to:26},
 {n:"Etapa 3",name:"Intensidad y formato continuo",from:27,to:39},
 {n:"Etapa 4",name:"Específica, infierno y simulacros",from:40,to:52}
];
const stageOf=w=>STAGES.find(s=>w>=s.from&&w<=s.to)||STAGES[4];
const stN=w=>w<=13?1:w<=26?2:w<=39?3:4;
const extraOf=w=>(S12[w]?S12[w][4]:S34[w]?S34[w][3]:"")||"";
function carry(w,re,def){let v=def;for(let i=1;i<=w;i++){if(re.test(extraOf(i)))v=extraOf(i)}return v}
function cold(w){const m=carry(w,/ducha/i,"Ducha fría 30 s").match(/(\d+:\d+|\d+\s*(?:s|min))/);return m?m[1]:"30 s"}
function coldSec(w){const c=cold(w);if(/:/.test(c))return toSec(c);const n=parseInt(c,10);return /min/.test(c)?n*60:n}
function apneaTarget(w){const m=carry(w,/apnea (piscina|\d)/i,"").match(/(\d[\d–-]*\s*m)\b/);return m?m[1]:""}
function lakeMin(w){const e=extraOf(w);const m=/lago/i.test(e)&&e.match(/(\d[\d–-]*\s*min)/);return m?m[1]:""}
// Sesiones de incomodidad: suben de 60 min a 4 h antes de la semana del infierno.
const incMin=w=>{const m=INC[w]&&INC[w][0].match(/(\d+) h(?: (\d+))?|(\d+) min/);return !m?0:m[3]?+m[3]:+m[1]*60+(m[2]?+m[2]:0)};
const INC={2:["Prueba de incomodidad · 20 min",10,30,40,30,0,0],6:["Prueba de incomodidad · 40 min",20,60,60,40,0,0],10:["Prueba de incomodidad · 60 min",30,100,100,50,0,0],18:["Prueba de incomodidad · 90 min",45,150,150,100,20,0],23:["Prueba de incomodidad · 2 h",60,200,200,150,30,0],
 31:["Mañana del infierno · 2 h 30",75,250,250,150,40,8],36:["Mañana del infierno · 3 h",90,300,300,200,50,10],41:["Mañana del infierno · 3 h 30",100,300,300,200,60,10],44:["Día del infierno · 4 h",120,400,400,300,80,12]};

/* =================== UTILIDADES =================== */
const pad=n=>String(n).padStart(2,"0");
const fmtT=s=>{s=Math.round(s);return Math.floor(s/60)+":"+pad(s%60)};
// lee un tiempo escrito a mano: “10:45”, “10.45”, “10,45” o “10'45” = 10 min 45 s; “1:05:10” = 1 h 5 min 10 s;
// un número solo son minutos (“25” o “25,5”). Lo que no se entiende da NaN (no se usa ni se compara).
const toSec=s=>{s=String(s==null?"":s).trim().replace(/\s+/g,"");if(!s)return NaN;let m;
  if((m=s.match(/^(\d+)[:.,'’´](\d{2})[:.,'’´](\d{2})$/)))return +m[2]<60&&+m[3]<60?+m[1]*3600+ +m[2]*60+ +m[3]:NaN;
  if((m=s.match(/^(\d+):(\d{1,2})$/))||(m=s.match(/^(\d+)[.,'’´](\d{2})$/)))return +m[2]<60?+m[1]*60+ +m[2]:NaN;
  if((m=s.match(/^(\d+)(?:[.,](\d))?$/)))return Math.round((+m[1]+(m[2]?+m[2]/10:0))*60);
  return NaN};
const num=s=>Number(String(s).replace(/\./g,""));
const r50=x=>Math.max(0,Math.round(x/50)*50);
const nf=n=>n.toLocaleString("es-CL");
const iso=d=>d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const parse=s=>{const [y,m,d]=s.split("-").map(Number);return new Date(y,m-1,d)};
const addDays=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x};
const diffDays=(a,b)=>Math.round((parse(iso(a))-parse(iso(b)))/864e5);
const MES=["ene","feb","mar","abr","may","jun","jul","ago","sep","oct","nov","dic"];
const fmt=d=>d.getDate()+" "+MES[d.getMonth()]+" "+d.getFullYear();
const fmtS=d=>d.getDate()+" "+MES[d.getMonth()];
const dayName=d=>DIAS[(d.getDay()+6)%7];
const esc=s=>String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function hash(s){let h=0;for(const c of s)h=(h*31+c.charCodeAt(0))|0;return Math.abs(h)}
const pick=(arr,k)=>arr[hash(k)%arr.length];

/* =================== BLOQUES =================== */
// Ejercicio: n nombre, p prescripción, s series que se marcan, r descanso (s), tm temporizador de trabajo (s), m metros de nado.
function B(n,p,o){return Object.assign({n,p:p||"",s:1},o||{})}
function T(id,t,why,h,blocks,o){return Object.assign({id,t,why:why||"",h:h||"",blocks:blocks||[],safe:"",kind:"tierra"},o||{})}
const SEG_APNEA="Con compañero o salvavidas avisado. Nunca hiperventilar antes.";
const CAL=B("Calentamiento","8 min",{note:"Círculos de hombros y caderas, 20 jumping jacks, 2 × 10 sentadillas sin carga, 2 × 5 flexiones suaves, 3 colgadas de 10 s en la barra."});
const ELONG=B("Elongación","5 min",{note:"Cuádriceps, isquios, gemelos, pecho y dorsales: 30 s cada uno."});

/* ---- carrera ---- */
const runGoal=w=>w<=13?630:w<=26?600:w<=39?570:540;
const swimGoal=w=>w<=39?660:570;
function runPace(w,d,fast){const p4=runGoal(w)/6-(fast?3:0),k=d/400;return p4*k+(k>1?(k-1)*4:0)-(d<400?2:0)}
const runRest=d=>d<=200?60:d<=400?90:d<=800?120:d<=1200?150:180;
function runBlocks(spec,w){
  spec=spec.replace(/^Intervalos:?\s*/i,"").trim();let m;
  if((m=spec.match(/(\d+)\s*×\s*([\d.]+)\s*m(.*)/))){
    const n=+m[1],d=num(m[2]),fast=/rápido/i.test(m[3]),pace=runPace(w,d,fast);
    return {blocks:[B("Calentamiento","10 min trote suave",{note:"Más 4 aceleraciones de 80 m."}),
      B(`${n} × ${m[2]} m`,`${fmtT(pace)} cada uno`,{s:n,r:runRest(d),note:`Ritmo ${fmtT(runGoal(w)/6-(fast?3:0))} por vuelta de 400 m. Entre cada uno, ${fmtT(runRest(d))} trotando muy suave o caminando.`}),
      B("Vuelta a la calma","5–10 min trote suave"),ELONG],min:20+n*(pace+runRest(d))/60,goal:{type:"int",rep:Math.round(pace),d,n}};
  }
  if((m=spec.match(/([\d.]+)\s*m\s*cronometrado/)))return {blocks:[B("Calentamiento","10 min trote suave"),B(m[1]+" m a tope","Anota el tiempo",{note:"Meta de la próxima prueba: "+fmtT(runGoal(w))}),B("Vuelta a la calma","10 min suave"),ELONG],min:35,goal:{type:"crono",d:num(m[1]),time:runGoal(w)}};
  if((m=spec.match(/(\d+)(?:–(\d+))?\s*min/))){const a=+m[1];
    return {blocks:[B("Trote",(m[2]?m[1]+"–"+m[2]:a)+" min",{tm:a*60,note:/suave/i.test(spec)||a<=35?"Ritmo conversación: puedes hablar en frases completas.":"Constante, sin parar. Puedes decir 3–4 palabras seguidas."}),ELONG],min:a+5,goal:{type:"cont",min:a,max:m[2]?+m[2]:a}}}
  return {blocks:[B(spec)],min:30};
}

/* ---- natación ---- */
const DRILLS="patada con tabla · patada lateral · nado a un brazo · “pillar” · respiración cada 3 brazadas";
const swimRest=d=>d<=25?20:d<=100?30:d<=300?45:60;
function parseSwim(spec){
  const m=spec.match(/([\d.]+)\s*m/);const total=m?num(m[1]):1000;
  const body=spec.includes(":")?spec.slice(spec.indexOf(":")+1):"";const sets=[];let desc="";
  body.split(/,|\+|;/).map(x=>x.trim()).filter(Boolean).forEach(p=>{let q;
    if((q=p.match(/^([\d.]+)\s*m(.*)×\s*(\d+)/)))sets.push({n:+q[3],d:num(q[1]),lab:p});
    else if((q=p.match(/(\d+)\s*×\s*([\d.]+)\s*m/)))sets.push({n:+q[1],d:num(q[2]),lab:p});
    else if((q=p.match(/([\d.]+)\s*m/))&&!/tramos/.test(p)&&num(q[1])!==total)sets.push({n:1,d:num(q[1]),lab:p});
    else desc+=(desc?", ":"")+p});
  return {total,sets,desc};
}
function swimBlocks(spec,w,cont){
  const P=parseSwim(spec),st=stN(w),bl=[];
  const main=P.sets.reduce((a,s)=>a+s.n*s.d,0),R=Math.max(0,P.total-main);
  const warm=Math.min(st===1?150:300,r50(R*0.35)),cool=R-warm>=150?100:R-warm>=50?50:0,tech=R-warm-cool;
  if(warm)bl.push(B("Entrada en calor",`${warm} m suave`,{m:warm}));
  if(st===1)bl.push(B("Autochequeo","cada 4 tramos",{note:"Cadera arriba · exhalas todo bajo el agua · patada corta desde la cadera · brazada larga."}));
  if(tech>0){
    if(/series/.test(P.desc)){const n=Math.max(1,Math.round(tech/50));bl.push(B(`${n} × 50 m`,"rápido, 85–90%",{s:n,r:30,m:n*50}))}
    else{const L=st===1?25:50,cap=st===1?tech:Math.min(tech,400),n=Math.max(1,Math.round(cap/L)),aer=Math.floor((tech-n*L)/100);
      if(aer>0)bl.push(B(`${aer} × 100 m`,"crol cómodo y constante",{s:aer,r:20,m:aer*100}));
      bl.push(B(`Técnica ${n} × ${L} m`,"drills",{s:n,r:20,m:n*L,note:"Rota: "+DRILLS+"."}))}
  }
  const p100=swimGoal(w)/5;
  P.sets.forEach(s=>{
    const lab=s.n>1?`${s.n} × ${nf(s.d)} m`:`${nf(s.d)} m`;
    let p=st>1||/crol/.test(s.lab)?"crol":"intentando crol";
    if(/rápido/.test(s.lab))p="crol rápido, 85–90%";
    if(/ritmo/.test(s.lab))p=s.d===100?`${fmtT(p100)} cada uno`:`${fmtT(p100*s.d/100)} cada uno`;
    if(/continuo/.test(s.lab))p="continuo, sin parar";
    if(/cronometrado|prueba|ensayo/.test(s.lab))p="cronometrado: anota el tiempo";
    if(/aletas/.test(s.lab))p="continuo con aletas";
    if(/2\.º más rápido/.test(s.lab))p="el 2.º más rápido que el 1.º";
    bl.push(B(lab,p,{s:s.n,r:s.n>1?swimRest(s.d):0,m:s.n*s.d,note:s.n>1?`${swimRest(s.d)} s de descanso entre cada uno.`:""}));
  });
  if(cool)bl.push(B("Vuelta a la calma",`${cool} m muy suave`,{m:cool}));
  if(cont)bl.unshift(B("La orden","nada lo largo sin parar",{note:"Piensa “hasta el otro borde”."}));
  return {blocks:bl,m:P.total};
}
// Aletas: de 1,3 km en series a 3 km continuos, como los nados del curso.
function finsBlocks(w){const st=stN(w||14);
  if(st<=2||DELOAD.includes(w))return {blocks:[B("Entrada en calor","200 m sin aletas",{m:200}),B("4 × 200 m","patada con aletas",{s:4,r:30,m:800,note:"Boca abajo, brazos adelante, patada desde la cadera."}),B("4 × 50 m","aletas, posición de buceo",{s:4,r:30,m:200,note:"Brazos pegados al cuerpo, solo patada."}),B("Vuelta a la calma","100 m suave",{m:100})],m:1300};
  if(st===3)return {blocks:[B("Entrada en calor","200 m sin aletas",{m:200}),B("3 × 500 m","con aletas, ritmo constante",{s:3,r:60,m:1500,note:"Patada larga desde la cadera, tobillos sueltos."}),B("4 × 50 m","aletas, posición de buceo",{s:4,r:30,m:200}),B("Vuelta a la calma","100 m suave",{m:100})],m:2000};
  if(w<44)return {blocks:[B("Entrada en calor","200 m sin aletas",{m:200}),B("2 × 1.000 m","con aletas, ritmo constante",{s:2,r:90,m:2000,note:"Como los nados largos del curso."}),B("Vuelta a la calma","100 m suave",{m:100})],m:2300};
  return {blocks:[B("Entrada en calor","200 m sin aletas",{m:200}),B("3.000 m","continuo con aletas",{m:3000,note:"Sin parar. Es la distancia que vas a nadar seguido en el curso."}),B("Vuelta a la calma","100 m suave",{m:100})],m:3300};
}
function longSwim(w){const d=w<=39?1500:2000;return {blocks:[B("Entrada en calor","200 m suave",{m:200}),B(nf(d)+" m","crol continuo",{m:d,note:"Cada 500 m revisa que la brazada siga larga."}),B("Vuelta a la calma","100 m suave",{m:100})],m:d+300}}
// Pataleo vertical (control en el agua): de 4 × 30 s a 10 min con las manos fuera.
const FLOT=(min,sets)=>B("Flotación de supervivencia",sets?`${sets} × ${min} min`:`${min} min`,{s:sets||1,r:sets?60:0,tm:min*60,c:`En lo hondo, cerca del borde: flota boca abajo y relajado, sube la cabeza solo para respirar cada 5 a 10 segundos y vuelve a relajarte. Aguanta ${min} minutos gastando lo mínimo. Es la base del nado de emergencia del curso.`});
const OBJ=n=>B("Recuperar objeto del fondo",`${n} veces`,{s:n,r:60,c:"Lanza a lo hondo un objeto que se hunda (una botella llena de agua). Baja, tómalo y súbelo. Compensa los oídos al bajar. Respira normal 1 minuto entre cada bajada; nunca respires rápido antes."});
function treadBlocks(w){const st=stN(w),t=treadBlock(w);
  if(st===1)return [t];
  if(st===2)return [t,FLOT(2,2)];
  if(st===3)return [t,FLOT(5),OBJ(5)];
  return [t,FLOT(10),B("Nado con ropa","200 m con polera y short",{m:200,c:"Si la piscina lo permite, nada 200 m con polera y short: así se siente el agua en el curso. Si no lo permiten, nada 200 m a brazada lenta sin parar."}),OBJ(5)];
}
function treadBlock(w){const st=stN(w);
  if(st===1)return B("Pataleo vertical",`4 × ${30+Math.min(60,Math.max(0,w-1)*5)} s`,{s:4,r:45,tm:30+Math.min(60,Math.max(0,w-1)*5),note:"En lo hondo, cerca del borde. Patada de “batidora” (eggbeater), manos ayudando."});
  if(st===2)return B("Pataleo vertical",`5 × ${Math.min(3,1+Math.floor((w-14)/5))} min`,{s:5,r:60,tm:Math.min(3,1+Math.floor((w-14)/5))*60,note:"Cerca del borde, en lo hondo."});
  if(st===3)return B("Pataleo vertical","3 × 3 min con manos fuera",{s:3,r:60,tm:180,note:"Manos fuera del agua: es lo que te van a pedir en el curso."});
  return B("Pataleo vertical","10 min continuo",{tm:600,note:"Últimos 2 min con las manos fuera."});
}

const LAKE_IN=`Entra caminando, nunca de golpe ni de cabeza:

4) Agáchate hasta los hombros y quédate 20–30 segundos respirando tranquilo.
5) Recién ahí nadas: paralelo a la orilla, donde el agua te llegue al pecho, para poder pararte cuando quieras. Las primeras semanas puedes nadar con la cabeza afuera (pecho); cuando te sientas bien, crol normal.`;

Afuera: sécate rápido, ponte ropa abrigada y gorro, toma algo caliente y camina suave. Es normal temblar unos minutos y tener más frío 5–10 min después de salir.

/* ---- estudio diario: una tarjeta por día, en orden; al terminar la lista se repasa ---- */
const STUDY=[
 ["La Armada y tu camino","Para llegar al curso de Buzo Táctico primero tienes que ser parte de la Armada. Hay dos entradas: la Escuela Naval “Arturo Prat” (forma oficiales) y la Escuela de Grumetes “Alejandro Navarrete Cisterna” (forma gente de mar). El curso se postula ya siendo personal naval, antes de los 30 años, y dura 48 semanas en la Escuela de Fuerzas Especiales.","Entra a admisionarmada.cl y anota en tu cuaderno los requisitos de las dos escuelas: edad, estudios, examen médico y fechas. Decide a cuál apuntas."],
 ["La prueba de ingreso al curso","Es una prueba continua, con descanso mínimo entre ejercicios: apnea dinámica, 500 m de natación, barras, sentadillas, flexiones, abdominales y 2.400 m de carrera. Lo que más elimina es el agua. Quien llega justo a las mínimas sufre más y abandona antes.","Escribe en tu cuaderno los 7 ejercicios en orden, de memoria, y deja espacio al lado para tu marca de la prueba inicial (la anotas después de rendirla)."],
 ["Combate Naval de Iquique","El 21 de mayo de 1879, en la Guerra del Pacífico, la corbeta Esmeralda, vieja y en desventaja, enfrentó al blindado peruano Huáscar frente a Iquique. El capitán Arturo Prat saltó al abordaje y murió en la cubierta enemiga. La Esmeralda se hundió con su bandera izada. Es el ejemplo central de la Armada: cumplir el deber hasta el final.","Escribe en 3 líneas qué significa para ti “no rendirse” y relaciónalo con tu entrenamiento."],
 ["Presión bajo el agua","Al nivel del mar soportas 1 atmósfera. Cada 10 m de agua de mar suman 1 atmósfera más: a 10 m estás a 2 atmósferas, a 20 m a 3, a 30 m a 4. El cambio más brusco ocurre en los primeros 10 m: ahí la presión se duplica.","Calcula y anota la presión a 5, 15 y 40 m. (Respuestas: 1,5; 2,5 y 5 atmósferas.)"],
 ["Ley de Boyle","Si la temperatura no cambia, el volumen de un gas es inversamente proporcional a la presión. El aire de tus pulmones a 10 m ocupa la mitad que en superficie, y a 30 m, un cuarto. Por eso, con equipo de buceo, nunca se aguanta la respiración al subir: el aire se expande y puede romper el pulmón (embolia).","Explica en voz alta, como si le enseñaras a alguien, por qué no se aguanta la respiración al subir con equipo."],
 ["Compensar los oídos","Al bajar, la presión empuja el tímpano hacia adentro. Para igualarla se hace la maniobra de Valsalva: tapas la nariz y soplas suave por ella con la boca cerrada. Se compensa antes de sentir dolor, cada metro al principio. Nunca se fuerza: si duele, subes un poco y lo intentas de nuevo. Resfriado o congestión = no se bucea.","Practica 5 veces en seco la Valsalva suave hasta sentir que los oídos “hacen clic”. Sin soplar fuerte."],
 ["Barotrauma","Es la lesión por diferencia de presión en un espacio con aire: oídos (el más común), senos paranasales, máscara (ojos rojos por no exhalar en ella) y pulmones. Señales: dolor, sangrado por la nariz, mareo, oído tapado después de bucear. Por eso el examen médico revisa oídos y senos.","Anota las 4 zonas de barotrauma y una señal de cada una."],
 ["Apagón en apnea","Las ganas de respirar las provoca el CO₂, no la falta de oxígeno. Si hiperventilas, bajas el CO₂ y apagas la alarma: el oxígeno se acaba antes de sentir las ganas y te desmayas sin aviso, muchas veces cerca de la superficie. Por eso: nunca hiperventilar, nunca apnea solo, y el compañero te mira hasta 30 segundos después de salir.","Escribe las 3 reglas de la apnea segura y pégalas donde las veas antes de entrenar."],
 ["Shock de frío: regla 1-10-1","Al caer al agua fría: 1 minuto para controlar la respiración (el jadeo pasa si no entras en pánico), 10 minutos de movimiento útil antes de que los músculos fallen, y alrededor de 1 hora antes de perder la conciencia por hipotermia. Lo que mata primero no es la hipotermia, es el pánico y el agotamiento de los primeros minutos.","Memoriza la regla 1-10-1 y explícala en voz alta."],
 ["Hipotermia","Leve: temblor fuerte, piel fría, manos torpes. Moderada: el temblor para, confusión, habla lenta. Grave: inconsciencia. Qué hacer: sacar del agua y del viento, quitar ropa mojada, secar, abrigar (sobre todo tronco y cabeza) y dar bebida tibia solo si está consciente. No frotar brazos ni piernas, ni meter de golpe en agua caliente.","Anota las 3 etapas y los 5 pasos de ayuda en tu cuaderno."],
 ["RCP: reanimación","Si alguien no responde y no respira normal: pide ayuda y llama al 131 (SAMU). Pon las manos al centro del pecho y comprime fuerte y rápido: 5–6 cm de profundidad, 100 a 120 por minuto, dejando que el pecho vuelva. Ciclos de 30 compresiones y 2 ventilaciones. En un ahogado se empieza con 5 ventilaciones de rescate.","Practica el ritmo sobre un cojín: 30 compresiones al ritmo de “Stayin’ Alive”. Inscríbete en un curso de primeros auxilios cuando puedas."],
 ["Posición lateral de seguridad","Para alguien inconsciente que sí respira: lo pones de costado, con la pierna de arriba doblada y la mano bajo la mejilla, la cabeza un poco hacia atrás. Así no se ahoga con vómito o con su lengua. Lo revisas cada minuto hasta que llegue ayuda.","Practícala con alguien de tu casa, 3 veces."],
 ["Rescate: lanzar, no ir","La mayoría de los que se meten a rescatar sin entrenamiento también se ahogan. Orden: 1) hablar y dar instrucciones desde la orilla, 2) alcanzar con un palo o una rama, 3) lanzar algo que flote (botella, salvavidas, cuerda), 4) ir en bote. Nadar hacia la víctima es lo último y solo con entrenamiento.","Anota las 4 opciones en orden. Mira qué tienes a mano en el lugar donde nadas."],
 ["Corrientes de retorno","En el mar, el agua que entra con las olas vuelve por canales angostos que te llevan hacia adentro. Si te agarra: no nades contra ella. Nada paralelo a la playa hasta salir del canal y después vuelves. Se reconocen como franjas sin olas y con agua más oscura o con espuma.","Explica en voz alta qué harías si te agarra una corriente de retorno."],
 ["Nudo as de guía","Hace un lazo fijo que no se corre ni se aprieta: sirve para rescatar a alguien o amarrar un bote. Truco: haces un ojito en la cuerda (el pozo), el chicote (el conejo) sale del pozo, da la vuelta al árbol (la parte larga) y vuelve a entrar al pozo.","Con un cordón o cinturón, hazlo 10 veces. Después 3 veces con los ojos cerrados."],
 ["Nudo ballestrinque","Sirve para amarrar una cuerda a un poste o una baranda. Das una vuelta al poste, cruzas por encima, das otra vuelta y pasas el chicote por debajo del último cruce. Se hace rápido y se suelta fácil.","Practícalo 10 veces en la pata de una silla."],
 ["Nudo llano","Une dos cuerdas del mismo grosor: derecha sobre izquierda, y después izquierda sobre derecha. Si lo haces dos veces igual queda un nudo “de vieja” que se suelta. También sirve para vendajes.","Hazlo 10 veces y comprueba que quedó simétrico."],
 ["Nudo ocho","Es un nudo de tope: evita que la cuerda se salga de una argolla. Haces una vuelta, pasas el chicote por detrás y lo metes por el ojo: queda con forma de 8. Es la base de muchos nudos de seguridad.","Hazlo 10 veces. Después repasa los 4 nudos seguidos: as de guía, ballestrinque, llano y ocho."],
 ["La brújula","La aguja apunta al norte magnético. Los rumbos se dan en grados de 0 a 360, en el sentido del reloj: 0° norte, 90° este, 180° sur y 270° oeste. Para seguir un rumbo eliges un punto lejano en esa dirección y caminas hacia él.","Con la brújula del celular, párate en tu casa y anota hacia cuántos grados está la puerta, la ventana y el lago."],
 ["Cartas y millas náuticas","Las cartas náuticas usan latitud (norte-sur) y longitud (este-oeste). Un minuto de latitud equivale a 1 milla náutica: 1.852 metros. La velocidad en el mar se mide en nudos: 1 nudo = 1 milla náutica por hora.","Calcula: un bote a 10 nudos durante 30 minutos, ¿cuántos km recorre? (5 millas = 9,26 km.)"],
 ["Mareas","En gran parte de la costa de Chile hay dos mareas altas (pleamar) y dos bajas (bajamar) al día, con unas 6 horas entre una y otra. Las tablas de mareas del SHOA dicen la hora y la altura de cada una. En el sur la diferencia entre alta y baja es mucho mayor que en el norte.","Busca la tabla de mareas de Puerto Montt para mañana y anota las horas de pleamar y bajamar."],
 ["Viento y mar: Beaufort","La escala de Beaufort mide el viento de 0 (calma) a 12 (huracán). Con fuerza 4 (unos 20–28 km/h) ya hay olas pequeñas con espuma; con 6 o más, el mar es peligroso para botes chicos y para nadar. En el lago aplica igual: viento = oleaje.","Antes de tu próxima sesión de lago, mira el viento en un pronóstico y estima su fuerza Beaufort."],
 ["Alfabeto fonético","Por radio, las letras se dicen con palabras para no confundirlas: Alfa, Bravo, Charlie, Delta, Echo, Foxtrot, Golf, Hotel, India, Juliet, Kilo, Lima, Mike, November, Oscar, Papa, Quebec, Romeo, Sierra, Tango, Uniform, Victor, Whiskey, X-ray, Yankee, Zulu.","Deletrea tu nombre completo y tu RUT con el alfabeto fonético, en voz alta, 3 veces."],
 ["Hora militar y comunicación","En la Armada se usa la hora de 24 horas (las 10 de la noche son las 22:00, “veintidós cero cero”). Las órdenes se repiten para confirmar que se entendieron, y se habla corto y claro: qué, dónde, cuándo.","Durante el día de hoy, di todas las horas en formato de 24 horas."],
 ["Equipo básico de buceo","Máscara (vidrio templado, se ajusta sin apretar), snorkel, aletas, traje de neopreno (abriga, pero flota: por eso se usa un cinturón con lastre) y, en buceo con aire, el regulador, el chaleco compensador y el cilindro. En apnea se usa solo máscara, aletas, traje y lastre.","Anota para qué sirve cada pieza del equipo."],
 ["Nitrógeno y descompresión","Respirando aire bajo presión, el cuerpo absorbe nitrógeno. Si subes rápido, ese nitrógeno forma burbujas (enfermedad de descompresión): dolor en articulaciones, hormigueo, mareo. Por eso se sube lento y se hacen paradas de seguridad. A más de unos 30 m, el nitrógeno también produce narcosis: la cabeza piensa como si estuviera ebria.","Explica en tu cuaderno por qué se sube lento al bucear con aire."],
 ["Lesiones del corredor","Las más comunes: dolor en la cara interna de la canilla (periostitis), dolor bajo la rodilla y tendinitis del Aquiles. Casi siempre vienen de subir la carga muy rápido o de zapatillas gastadas. Prevención: no más de 10% de aumento por semana, gemelos y glúteos fuertes, y cambiar las zapatillas cada 600–800 km.","Revisa tus zapatillas: si la suela está lisa o torcida, anótalo como prioridad."],
 ["Hombro del nadador","Es dolor en el frente o el costado del hombro por repetir mal la brazada. Se previene con buena técnica (la mano entra adelante del hombro, no cruzada), respirando por los dos lados y fortaleciendo la espalda con remo y barras.","Fíjate hoy en tu brazada: ¿la mano entra cruzada al centro? Anótalo para corregirlo."],
 ["Comer para entrenar","Proteína: repara el músculo (huevo, pollo, pescado, legumbres, lácteos). Carbohidratos: son la bencina del entrenamiento (arroz, papas, avena, pan, fideos). Grasas buenas: palta, aceite de oliva, maní. Después de entrenar fuerte, en la hora siguiente, come proteína y carbohidratos juntos.","Revisa lo que comiste ayer y marca qué comida no tuvo proteína."],
 ["Dormir es entrenar","Mientras duermes se libera hormona de crecimiento y se reparan los músculos. Con menos de 7 horas bajan la fuerza, la memoria y las defensas, y suben las lesiones. El cuerpo no se acostumbra a dormir poco: el rendimiento sigue bajando aunque no lo sientas.","Anota cuántas horas dormiste cada día de esta semana."],
 ["Entrevista: tu por qué","En la postulación te van a preguntar por qué quieres entrar. Una buena respuesta es concreta y honesta: qué te mueve, qué has hecho para prepararte (este plan) y qué aportarías. No respondas con lo que crees que quieren oír.","Escribe tu respuesta de 1 minuto y dila en voz alta frente al espejo 3 veces."],
 ["Entrevista: fortalezas y debilidades","Te pueden preguntar por tus fortalezas y debilidades. Para la debilidad, di una real y qué estás haciendo para mejorarla. Por ejemplo: “nadaba poco y mal; llevo X semanas entrenando 3 veces por semana”.","Escribe 2 fortalezas con un ejemplo cada una, y 1 debilidad con lo que haces para mejorarla."],
 ["Trabajo en equipo","En el curso nadie aprueba solo: se carga el bote entre todos, se nada en pareja y se responde como grupo. El que solo piensa en sí mismo se nota rápido. Ayudar a otro cuando tú también estás reventado es lo que más se valora.","Escribe una situación en que ayudaste a alguien estando tú cansado, o cómo lo harías."],
 ["Disciplina","La disciplina es hacer lo que toca cuando no tienes ganas, igual que cuando sí. Las ganas suben y bajan; el hábito no. Por eso esta app te da órdenes: para que no tengas que decidir cada día si entrenas.","Anota los días de esta semana en que no tenías ganas y aun así cumpliste."],
 ["Preparación académica","Según la escuela a la que postules, te van a pedir notas de enseñanza media y pruebas de conocimientos (en la Escuela Naval, la PAES). Repasar 20 minutos al día durante meses rinde más que estudiar todo una semana antes.","Repasa 20 minutos de matemáticas: fracciones, porcentajes y ecuaciones de primer grado. Usa los ejercicios gratuitos de DEMRE."],
 ["Comprensión lectora","Leer rápido y entender instrucciones es clave en el examen y en el curso, donde las órdenes vienen por escrito y apuradas. Se entrena leyendo todos los días y resumiendo lo leído.","Lee un artículo de noticias completo y escribe un resumen de 3 líneas."]
];
function studyT(plan){
  const n=plan.w*7+plan.dow,card=STUDY[n%STUDY.length],rep=n>=STUDY.length;
  return T("estudio",(rep?"Repaso: ":"Estudio: ")+card[0],"20 minutos con un cuaderno solo para esto.","",[
    B("Lee",card[0],{c:card[1]}),
    B("Tarea","en tu cuaderno",{c:card[2]})],{kind:"estudio"});
}
/* ---- comida: porciones según tu peso (1,6 g de proteína por kilo al día, en 4 comidas) ---- */
function NUT(kg,train,hell){
  const P=kg||70,known=!!kg,prot=Math.round(P*1.6),perMeal=Math.round(prot/4/5)*5;
  const eggs=Math.max(2,Math.min(4,Math.round(perMeal/7))),chicken=Math.max(120,Math.round(perMeal/0.3/10)*10+(hell?50:0));
  const water=Math.min(4.5,Math.round((P*0.035+(train?0.75:0))*10)/10);
  const base=known?`Con tus ${P} kg necesitas unos ${prot} g de proteína al día: unos ${perMeal} g en cada comida.`:"Cuando anotes tu peso en Plan → Ajustes, ajusto las cantidades a ti.";
  return {P,prot,perMeal,eggs,chicken,water,base,
   pre:`Come algo liviano 30–60 minutos antes de entrenar, para tener energía sin sentirte pesado. Elige UNA opción:
a) 1 plátano + media marraqueta (o media hallulla) con 1 cucharada de mantequilla de maní.
b) 1 yogur + 3 cucharadas de avena + 1 cucharadita de miel.
c) 1 tostada con miel o mermelada + 1 manzana.
No comas frituras, palta en cantidad, ni un plato grande: se te va a revolver el estómago.`,
   restBreak:`Desayuna tranquilo. Elige UNA opción:
a) ${eggs} huevos revueltos + 1 marraqueta + 1 fruta + 1 vaso de leche.
b) 1 taza de avena (80 g) cocida en leche + 1 plátano + 1 yogur.
c) 2 panes con palta y pollo o jamón de pavo + 1 yogur.
${base}`,
   breakfast:`Después de entrenar el cuerpo necesita recargar: proteína para reparar el músculo y carbohidratos para reponer energía. Elige UNA opción:
a) ${eggs+(hell?1:0)} huevos revueltos + 2 panes (o 1 marraqueta entera) + 1 fruta + 1 vaso de leche.
b) 1 taza de avena (80 g) cocida en leche + 1 plátano + 1 yogur + 2 huevos duros.
c) 2 panes con palta y ${Math.round(chicken*0.6/10)*10} g de pollo o 3 láminas de jamón de pavo + 1 yogur + 1 fruta.
${hell?"Esta semana comes más: agrega otro pan y otra fruta. ":""}${base}`,
   lunch:`Plato grande, armado así: la mitad del plato carbohidratos, un cuarto proteína (del tamaño y grosor de tu mano) y un cuarto verduras. Elige UNA opción:
a) 1,5 tazas de arroz cocido + 1 pechuga de pollo (unos ${chicken} g) + ensalada de tomate y lechuga con aceite.
b) 1,5 tazas de porotos, lentejas o garbanzos con arroz + 1 huevo + ensalada.
c) 2 tazas de fideos cocidos + ${chicken} g de carne molida en salsa de tomate + ensalada.
d) 1 filete de pescado (merluza o salmón, ${chicken} g) + 3 papas cocidas + verduras.
${hell?"Esta semana repite el plato. ":""}Toma 1 vaso de agua. Postre: 1 fruta.`,
   snack:`Prepara la colación para el trabajo. Elige UNA opción:
a) 1 sándwich de pan integral con ${Math.round(chicken*0.6/10)*10} g de pollo o 2 huevos duros, más tomate.
b) 1 yogur + 1 fruta + un puñado de maní sin sal (30 g, lo que cabe en la palma).
c) 1 lata de atún al agua + 4 galletas de agua + 1 fruta.
Y una botella de 1 litro de agua. Cómela a mitad de turno.`,
   night:`Al llegar del trabajo come algo liviano con proteína, para recuperar mientras duermes sin dormir con el estómago lleno. Elige UNA opción:
a) ${Math.min(3,eggs)} huevos revueltos con 1 pan y tomate.
b) 1 yogur con 4 cucharadas de avena y 1 fruta.
c) 1 lata de atún al agua con ensalada y 1 pan.
Nada frito, nada de café ni bebidas con azúcar.`,
   water:`Hoy toma unos ${water.toLocaleString("es-CL")} litros de agua en total${known?` (por tus ${P} kg${train?" más el entrenamiento":""})`:""}. Truco: 1 botella de 1 L en la mañana, 1 en el trabajo y el resto en las comidas. Si tu orina sale oscura, te falta agua.`};
}
const okKg=v=>v>=35&&v<=150;
function bodyWeight(){let w=null;Object.keys(Store.days).sort().forEach(k=>{const v=parseFloat(String(Store.days[k].peso||"").replace(",","."));if(okKg(v))w=v});const c=parseFloat(String(Store.cfg.peso||"").replace(",","."));return w||(okKg(c)?c:null)}
// o.prev / o.next: turno de ayer y de mañana. Después de acostarte pasada la medianoche, hoy se despierta 8 h después
// (y la mañana se corre); la alarma de la noche es la del turno de mañana.
const wakeAfter=(bedT,sh)=>{const b=toMin(bedT),pb=b<300?b:b-1440;return Math.max(toMin(sh.wake),pb+480)};
function applyShift(plan,turno,kg,o){
  o=o||{};const sh=Object.assign({},SHIFT[turno]||SHIFT["13"]),hell=plan.w===HELL,rest=plan.kind==="descanso",N=NUT(kg,!rest,hell);
  if(o.prev){const ps=SHIFT[o.prev]||sh,wk=wakeAfter(ps.bed,sh);if(wk>toMin(sh.wake)){sh.late=ps.bed;sh.wake=fromMin(wk);sh.A=fromMin(Math.max(toMin(sh.A),wk+30));if(toMin(sh.B)<toMin(sh.A)+45)sh.B=fromMin(toMin(sh.A)+45)}}
  const ns=o.next?SHIFT[o.next]:sh,alarm=fromMin(o.next?wakeAfter(sh.bed,ns):toMin(sh.wake)),slp=(toMin(alarm)-toMin(sh.bed)+1440)%1440,slpT=Math.floor(slp/60)+(slp%60?" h "+pad(slp%60):" horas");
  const longInc=(plan.tasks.some(t=>t.id==="inc")&&incMin(plan.w)>=120)||(hell&&!rest);
  const tasks=plan.tasks.map(t=>{let x=Object.assign({},t,{h:mapH(t.h,sh)});
    if(t.id==="noche")x=Object.assign(x,{why:sh.back?`Llegas ${sh.back}. Despiertas ${sh.wake}.`:`Despiertas ${sh.wake}.`,blocks:[sh.back?B("Comida al llegar","liviana con proteína",{c:N.night}):B("Cena","liviana con proteína",{c:N.night.replace("Al llegar del trabajo come","En la cena come")})].concat(t.blocks.map(b=>b.n==="A la cama"?Object.assign({},b,{p:`${sh.bed} · alarma ${alarm}`,c:`Apaga la luz a las ${sh.bed} y deja la alarma a las ${alarm}: son ${slpT}.${o.next&&o.next!==turno?` Mañana ${o.next==="libre"?"estás libre":"entras a las "+o.next+":00"}.`:""} El celular lejos de la cama, pieza oscura y fresca. Si no te duermes en 20 minutos, respira en caja (4-4-4-4) sin mirar la pantalla.`}):b))});
    return x});
  tasks.push(T("despertar","Despertar",sh.late?`Ayer te acostaste a la ${sh.late}: hoy despiertas ${sh.wake} para dormir 8 h. La mañana es más corta: haz primero lo principal.`:`Alarma a las ${sh.wake}, sin posponer.`,sh.wake,[
    B("Levántate",sh.wake,{c:`Levántate a las ${sh.wake} apenas suene la alarma. Sin posponer: es la primera orden del día. ${plan.dow===0?"Hoy es el primer día de la semana: pésate en ayunas, después de ir al baño y antes de tomar agua, y anótalo en Notas y peso.":""}`}),
    B("Agua","500 ml",{c:"Toma un vaso grande de agua (500 ml) antes de cualquier otra cosa: llevas 8 horas sin tomar."}),
    B("Agua del día",N.water.match(/[\d,.]+ litros/)[0],{c:N.water}),
    longInc?B("Desayuno","antes de salir",{c:N.breakfast+"\nHoy la sesión es larga: lleva agua y una colación (plátano, pan con mantequilla de maní) para la mitad."}):B(rest?"Desayuno":"Algo liviano",rest?"tranquilo":"antes de entrenar",{c:rest?N.restBreak:N.pre})],{kind:"rutina"}));
  if(!rest&&!longInc)tasks.push(T("desayuno","Desayuno completo","Después de la sesión principal.",fromMin(toMin(sh.B)-25),[B("Desayuno","completo",{c:N.breakfast})],{kind:"rutina"}));
  tasks.push(T("almuerzo","Almuerzo"+(sh.leave?" y colación":""),sh.leave?`Antes de salir al trabajo a las ${sh.leave}.`:"",sh.lunch,[B("Almuerzo","plato completo",{c:N.lunch})].concat(sh.leave?[B("Colación para el trabajo","prepárala ahora",{c:N.snack})]:[]),{kind:"rutina"}));
  if(plan.kind!=="prueba"||!plan.test)tasks.push(Object.assign(studyT(plan),{h:turno==="13"?fromMin(toMin(sh.back)+15):fromMin(toMin(sh.lunch)+20)}));
  const key=t=>t.id==="despertar"?-2:t.id==="noche"?1e5:t.h?toMin(t.h)+(toMin(t.h)<240?1440:0):-1;
  tasks.sort((a,b)=>key(a)-key(b));
  return Object.assign({},plan,{tasks,shift:sh});
}

/* =================== GENERADOR DEL DÍA =================== */
function dayPlan(w,dow,ctx){
  ctx=ctx||{};const st=stN(w),deload=DELOAD.includes(w),lake=ctx.place!=="piscina",partner=!!ctx.partner;
  let tasks=[],title="",kind="tierra";

  if(/por lado/.test(b.p)){const k=b.p.match(/^(\d+) ×/);if(k){const per=Math.max(1,Math.round(ns/2));p2=b.p.replace(/^\d+ ×/,per+" ×")}}

/* =================== CÁLCULOS =================== */
function locate(date){
  const n=diffDays(date,parse(Store.cfg.start));if(n<0)return {before:true,n};
  const idx=Math.floor(n/7),dow=n%7,sched=Store.cfg.sched;
  if(idx>=sched.length)return {after:true,n,idx,dow};
  return {n,idx,dow,w:sched[idx]};
}
const weekStartOf=d=>{const st=parse(Store.cfg.start);return addDays(st,Math.floor(diffDays(d,st)/7)*7)};
let CTX=null;
// resultados que mandan en el plan de una fecha: solo pruebas y simulacros de semanas anteriores
// (así anotar un simulacro no cambia los días que ya hiciste)
function lastTest(date){const ws=date?weekStartOf(date):null,lim=ws?iso(ws):"9999-99-99",end=ws?iso(addDays(ws,7)):"9999-99-99";
  CTX=CTX||{};if(CTX[lim])return CTX[lim];
  const c={};let bk="";Object.keys(Store.days).sort().forEach(k=>{if(k>=lim)return;const D=Store.days[k],t=D.test||(D.sim&&!["cansado","dolor"].includes(D.mode)&&locate(parse(k)).w!==HELL?D.sim:null);if(t)["barras","run","swim","apnea"].forEach(x=>{if(t[x]){c[x]=t[x];if(x==="barras")bk=k}})});
  const mb=Store.cfg.maxB;if(mb&&mb.v&&mb.k<end&&(!bk||mb.k>=bk))c.barras=mb.v;return CTX[lim]=c}
const CTXF=["place","neo","temp","partner"];
const tempFor=(c,date)=>c.temp!==""&&c.temp!=null&&c.tempK&&Math.abs(diffDays(date,parse(c.tempK)))<=10?c.temp:"";
function ctxFor(date){const c=Store.cfg,dd=Store.days[iso(date)],fz=dd&&dd.ctx&&diffDays(date,today())<0?dd.ctx:null;
  const base={month:date.getMonth(),place:c.place,partner:c.partner,neo:c.neo,temp:tempFor(c,date)};
  return Object.assign({},lastTest(date),base,fz?{place:fz.place,partner:fz.partner,neo:fz.neo,temp:fz.temp}:{})}
let PLANC={};
function planFor(date){const ck=iso(date);if(ck in PLANC)return PLANC[ck];return PLANC[ck]=planFor0(date)}
function planFor0(date){const L=locate(date);
  if(L.after){const dd=Store.days[iso(date)]||{},bp=dayPlan(47,L.dow,ctxFor(date));
    return applyShift(applyMode(Object.assign(bp,{w:52,deload:false,maint:true,title:"Mantención · "+bp.title}),dd.mode),dd.turno||Store.cfg.turno,bodyWeight())}
  if(L.w===undefined)return null;const dd=Store.days[iso(date)]||{},tu=x=>(Store.days[iso(x)]||{}).turno||Store.cfg.turno;
  let p=applyShift(applyMode(dayPlan(L.w,L.dow,ctxFor(date)),dd.mode),dd.turno||Store.cfg.turno,bodyWeight(),{prev:tu(addDays(date,-1)),next:tu(addDays(date,1))});
  // semana repetida: las tareas de una sola vez (inscribirse, pedir hora) no se repiten
  if(Store.cfg.sched.indexOf(L.w)!==L.idx)p=Object.assign({},p,{tasks:p.tasks.filter(t=>t.kind!=="admin")});
  return p}
const setKey=(t,i)=>t.id+"."+i;
const blockDone=(dd,t,i)=>Math.min(((dd&&dd.sets)||{})[setKey(t,i)]||0,t.blocks[i].s);
const taskDone=(dd,t)=>!!dd&&(((dd.checks||{})[t.id])||(t.blocks.length>0&&t.blocks.every((b,i)=>b.opt||blockDone(dd,t,i)>=b.s)));
// para cerrar el día cuentan las sesiones, no las rutinas (despertar, comidas, noche)
const counts=t=>t.kind!=="rutina"&&!["despertar","desayuno","almuerzo","noche"].includes(t.id);
function units(dd,plan){let a=0,b=0;plan.tasks.filter(counts).forEach(t=>{const all=taskDone(dd,t);t.blocks.forEach((x,i)=>{if(x.opt)return;b+=x.s;a+=all?x.s:blockDone(dd,t,i)})});return {a,b}}
function dayStatus(k,plan){if(!plan)return "";const d=Store.days[k],core=plan.tasks.filter(counts);
  if(d&&d.status)return d.status;
  // un descanso que ya pasó cuenta como cumplido, salvo que marques “no pude”
  if(plan.kind==="descanso"&&diffDays(parse(k),today())<0)return "done";
  if(!d)return "";
  if(d.mode==="dolor"&&core.every(t=>taskDone(d,t)))return "injury";if(core.every(t=>taskDone(d,t)))return "done";return units(d,plan).a?"part":""}
// lo que falta para cerrar el día
function missingTasks(dd,plan){return plan.tasks.filter(t=>counts(t)&&!taskDone(dd,t)).map(t=>{const left=t.blocks.filter((b,i)=>!b.opt&&blockDone(dd,t,i)<b.s).map(b=>b.n);return left.length<t.blocks.length&&left.length<=2?`${left.join(" y ")} (${t.t})`:t.t})}
const okSt=s=>s==="done"||s==="injury";
// “hoy” para la bitácora: si ayer saliste del trabajo después de medianoche (turno 16), hasta las 4:00 sigue siendo ayer
function today(){const n=new Date();if(n.getHours()<4){const y=addDays(n,-1),ys=SHIFT[(Store.days[iso(y)]||{}).turno||Store.cfg.turno];if(ys&&ys.back&&toMin(ys.back)<300)return y}return n}
function streak(){let d=today(),n=0;const s0=dayStatus(iso(d),planFor(d));if(s0==="fail")return 0;if(!okSt(s0))d=addDays(d,-1);
  for(let i=0;i<800;i++){if(locate(d).before)break;if(okSt(dayStatus(iso(d),planFor(d)))){n++;d=addDays(d,-1)}else break}return n}
function compliance(){const td=today();let tot=0,ok=0;for(let d=parse(Store.cfg.start);diffDays(d,td)<0;d=addDays(d,1)){const p=planFor(d);if(!p)break;tot++;if(okSt(dayStatus(iso(d),p)))ok++}return tot?Math.round(ok/tot*100):null}

/* =================== VOZ DEL COMANDANTE =================== */
function orders(plan,k,isToday,dd){
  const N=Store.cfg.name||"recluta",out=[];
  if(isToday){const fr=fatigueRun(today());if(fr>=3)out.push(["alert",`Llevas ${fr} días seguidos cansado o con dolor. Hoy versión suave o descanso: solo técnica o movilidad. Si es dolor y no mejora, al médico.`])}
  if(isToday){const yd=addDays(today(),-1),yp=planFor(yd);if(yp&&!okSt(dayStatus(iso(yd),yp))){const ys=dayStatus(iso(yd),yp),yx=Store.days[iso(yd)]||{};if(ys==="fail")out.push(["alert","Ayer fallaste. Un día no te saca del curso; dos seguidos empiezan a hacerlo."]);
      else if(!yx.status){const ms=missingTasks(yx,yp);out.push(["alert",units(yx,yp).a?`Ayer quedó a medias${ms.length?" (faltó: "+ms.slice(0,3).join(", ")+")":""}. Si lo hiciste, márcalo con ◀; si no, ciérralo ahí con «Cerrar el día así».`:"Ayer no registraste nada. Si entrenaste, márcalo con ◀; si no, toca «No pude ese día» ahí."])}}}
  if(plan.maint)out.push(["say",plan.kind==="descanso"?"Descanso. La mantención también descansa.":`Mantención, ${N}. Lo que ganaste en 52 semanas se cuida igual.`]);
  else if(plan.w===HELL&&plan.kind!=="descanso")out.push(["say",pick([`${N}. Semana del infierno. Aquí se ve para qué fueron 47 semanas.`,`Infierno, día ${plan.dow+1}. No pienses en el último día: piensa en la próxima serie.`],k)]);
  else if(plan.test)out.push(["say",plan.w===0?`${N}. Hoy se mide el punto de partida. Que sea verdad, no bonito.`:plan.w===52?`Prueba final, ${N}. 52 semanas para esto.`:`Día de prueba, ${N}. Aquí se ve quién entrenó.`]);
  else if(plan.kind==="descanso")out.push(["say",pick(["Hoy descansas. Es una orden, no un premio.","Descanso. El progreso ocurre cuando descansas.","Día libre. Cúmplelo igual de serio."],k)]);
  else if(plan.kind==="prueba")out.push(["say","Simulacro. La prueba entera, cansado, sin regalos."]);
  else if(plan.kind==="admin")out.push(["say",`${N}. Antes de mojarte, se prepara el terreno.`]);
  else if(plan.kind==="agua"&&plan.tasks.some(t=>/ · en seco$/.test(t.t)))out.push(["say","Hoy el agua está demasiado fría para entrar solo. Técnica en seco y lo demás igual."]);
  else if(plan.kind==="agua")out.push(["say",plan.lake?pick(["Al lago. Vas solo: nadas donde haces pie y sales cuando suena.","Lago. El frío no perdona al que se confía.","Al agua. Resistencia sí, heroísmo no."],k):pick([`Al agua a las ${plan.shift?plan.shift.A:"8:00"}. Es tu punto débil: ahí vas a vivir.`,"Piscina. No le regales metros al agua.","Al agua. Cada largo de hoy es uno que en el curso no te hunde."],k)]);
  else out.push(["say",pick([`De pie, ${N}. Esto es lo que haces hoy.`,`Arriba, ${N}. Nadie lo va a hacer por ti.`,`${N}. Querías saber si puedes. Hoy se sigue respondiendo.`],k)]);
  if(dd.mode==="dolor"){out.splice(out.findIndex(x=>x[0]==="say"),1,["say",`${N}, hoy se recupera. El que se lesiona no llega al curso.`])}
  else{if(plan.deload&&plan.kind!=="descanso")out.push(["p","Semana de descarga: la carga baja a propósito. No te la saltes por orgullo."]);
    if(INC[plan.w]&&plan.dow===5&&dd.mode!=="cansado")out.push(["p","Hoy hay sesión larga de incomodidad. Come bien antes y lleva agua."])}
  const why=(Store.cfg.why||"").trim(),hard=dd.mode==="cansado"||(INC[plan.w]&&plan.dow===5)||(plan.w===HELL&&plan.kind!=="descanso")||plan.test||plan.kind==="prueba";
  if(why&&hard)out.push(["why",why]);
  if(dd.mode==="cansado")out.push(["p","Vas cansado: hoy hay menos series. Cumple esas completas."]);
  if(dd.mode==="dolor")out.push(["p","Con dolor no se entrena lo que duele. Recupera y reporta."]);
  return out;
}

function stepDone(dd,st){const n=taskDone(dd,st.t)?st.b.s:blockDone(dd,st.t,st.bi);return st.set?n>=st.set:n>=st.b.s}
function firstPending(plan,dd){const ss=steps(plan);const i=ss.findIndex(x=>!stepDone(dd,x));return i<0?ss.length:i}

const nextGoalWeek=w=>[13,26,39,52].find(g=>g>=w)||52;
const RES_FIELDS={
  sim:[["apnea","Apnea (m)","15","numeric"],["swim","500 m (mm:ss)","12:40","text"],["barras","Barras","8","numeric"],["sent","Sentadillas 2 min","65","numeric"],["flex","Flexiones 2 min","45","numeric"],["abd","Abdominales 2 min","50","numeric"],["run","2.400 m (mm:ss)","10:45","text"]],
  mini:[["swim","Nado (mm:ss)","5:30","text"],["barras","Barras hechas","6","numeric"],["sent","Sentadillas 1 min","35","numeric"],["flex","Flexiones 1 min","30","numeric"],["abd","Abdominales 1 min","30","numeric"],["run","Carrera (mm:ss)","5:40","text"]]};
const RES_NAMES={apnea:"Apnea",swim:"Nado",barras:"Barras",sent:"Sentadillas",flex:"Flexiones",abd:"Abdominales",run:"Carrera"};
function resultsKind(plan){if(plan.test)return null;if(plan.kind==="prueba"||plan.tasks.some(t=>t.blocks.some(b=>b.n==="Simulacro completo"||/^1\. Apnea/.test(b.n))))return "sim";if(plan.tasks.some(t=>t.id==="fri"&&/^Mini-prueba/.test(t.t)))return "mini";return null}
// distancias que pidió la mini-prueba de ese día (nado 200/300 m, carrera 1.200/1.600 m)
function miniDist(plan){const t=plan&&plan.tasks.find(x=>x.id==="fri"),o={swim:null,run:null};if(!t)return o;
  t.blocks.forEach(b=>{let m=/^Nado (\d+) m$/.exec(b.n);if(m)o.swim=+m[1];if(b.n==="Carrera"){m=/^(\d)\.?(\d{3}) m$/.exec(b.p);if(m)o.run=+(m[1]+m[2])}});return o}
const miniFields=plan=>{const md=miniDist(plan);return RES_FIELDS.mini.map(f=>f[0]==="swim"?["swim",`Nado ${md.swim?nf(md.swim)+" m ":""}(mm:ss)`,f[2],f[3]]:f[0]==="run"?["run",`Carrera ${md.run?nf(md.run)+" m ":""}(mm:ss)`,f[2],f[3]]:f).concat(md.swim?[]:[["swimM","Metros nadados","200 o 300","numeric"]])};
function resultsHTML(plan,k,dd){
  const kind=resultsKind(plan);if(!kind)return "";const r=dd[kind]||{};
  const f=([id,lab,ph,mode])=>`<div class="field"><label class="lbl" for="x-${kind}-${id}">${lab}</label><input id="x-${kind}-${id}" data-x="${kind}|${id}" inputmode="${mode}" value="${esc(r[id]||"")}" placeholder="${ph}"></div>`;
  return `<div class="card"><span class="lbl">Tus resultados · ${kind==="sim"?"simulacro":"mini-prueba"}</span><div class="testform">${(kind==="mini"?miniFields(plan):RES_FIELDS[kind]).map(f).join("")}</div><p class="rlv" id="xv-${kind}">${esc(resultsVerdict(kind,plan,k,r))}</p></div>`;
}
function resultsVerdict(kind,plan,k,r){
  if(!Object.values(r).some(Boolean))return kind==="sim"?"Anota cada número: quedan en tus gráficos y récords.":"Anota tus números para comparar con la mini-prueba anterior.";
  if(kind==="sim"){const g=nextGoalWeek(plan.w),ev=evalTest(g,Object.assign({sinParar:1,crol:1},r)),filled=ev.rows.filter((x,i)=>r[["apnea","swim","barras","sent","flex","abd","run"][i]]);
    const okN=filled.filter(x=>x[3]).length,miss=filled.filter(x=>!x[3]).map(x=>x[0]);
    return `Contra la meta de la semana ${g}: cumples ${okN} de ${filled.length}.${miss.length?" Te falta: "+miss.join(", ")+".":" Vas sobre la meta."}`}
  const has=x=>x&&["barras","sent","flex","abd","swim","run"].some(f=>x[f]);
  const prev=Object.keys(Store.days).filter(x=>x<k&&has(Store.days[x].mini)).sort().pop();if(!prev)return "Primera mini-prueba registrada: la próxima se compara con esta.";
  const p=Store.days[prev].mini,out=[],dA=miniDist(plan),dB=miniDist(planFor(parse(prev)));
  ["sent","flex","abd"].forEach(f=>{if(r[f]&&p[f]){const d=Number(r[f])-Number(p[f]);out.push(`${RES_NAMES[f]} ${r[f]} (${d>=0?"+":""}${d})`)}});
  // mismo tramo: compara el tiempo; tramo distinto: compara el ritmo (por 100 m nadando, por km corriendo)
  [["swim",+(r.swimM||dA.swim)||0,+(p.swimM||dB.swim)||0,100,"/100 m"],["run",dA.run,dB.run,1000,"/km"]].forEach(([f,ma,mb,u,ul])=>{const a=toSec(r[f]),b=toSec(p[f]);if(!(a&&b))return;
    const sg=d=>d<=0?"−"+fmtT(-d):"+"+fmtT(d);
    if(ma&&mb&&ma!==mb){const pa=a/ma*u,pb=b/mb*u;out.push(`${RES_NAMES[f]} ${nf(ma)} m ${r[f]}: ritmo ${fmtT(pa)}${ul} (${sg(Math.round(pa-pb))}${ul} contra ${nf(mb)} m)`)}
    else out.push(`${RES_NAMES[f]} ${r[f]} (${sg(a-b)})`)});
  return out.length?"Contra la anterior ("+fmtS(parse(prev))+"): "+out.join(" · ")+".":"Completa los mismos ejercicios que la vez anterior para comparar.";
}
function updateResults(kind){const el=document.getElementById("xv-"+kind);if(!el)return;const p=planFor(S.date);if(!p)return;const k=iso(S.date);el.textContent=resultsVerdict(kind,p,k,(Store.days[k]||{})[kind]||{})}

// series para los gráficos: pruebas + simulacros (+ peso)
function seriesData(){
  // x = semana del plan (si repites semanas, la prueba queda junto a su meta); el peso va por semana de calendario
  const st=parse(Store.cfg.start),pts={barras:[],run:[],swim:[],apnea:[],flex:[],peso:[]};
  Object.keys(Store.days).sort().forEach(k=>{const d=Store.days[k],cx=diffDays(parse(k),st)/7;if(cx<0)return;const L=locate(parse(k)),x=L.w!=null?L.w+L.dow/7:cx,w=L.w;
    [d.test,d.sim].forEach(t=>{if(!t)return;["barras","apnea","flex"].forEach(f=>{const raw=t[f];if(raw===""||raw==null||raw===true)return;const v=Number(raw);if(v>=0&&!isNaN(v))pts[f].push({x,v,k,w})});["run","swim"].forEach(f=>{const v=toSec(t[f]);if(v>0)pts[f].push({x,v,k,w})})});
    const pw=parseFloat(String(d.peso||"").replace(",","."));if(pw>30)pts.peso.push({x:cx,v:pw,k})});
  Object.values(pts).forEach(a=>a.sort((p,q)=>p.x-q.x||(p.k<q.k?-1:1)));
  return pts;
}
const CHARTS=[["barras","Barras seguidas","más es mejor",w=>GOALS[w].barras,0],["run","2.400 m","menos tiempo es mejor",w=>toSec(GOALS[w].run),1],["swim","500 m libre","menos tiempo es mejor",w=>GOALS[w].swim?toSec(GOALS[w].swim):null,1],["apnea","Apnea dinámica (m)","más es mejor",w=>GOALS[w].apnea,0],["flex","Flexiones en 2 min","más es mejor",w=>GOALS[w].flex,0],["peso","Peso en ayunas (kg)","",null,0]];
function lineChart(pts,goalFn,isTime){
  const W=320,H=150,L=40,R=14,T=14,B=24,fx=v=>isTime?fmtT(v):(Math.round(v*100)/100).toLocaleString("es-CL",{maximumFractionDigits:2});
  const goals=goalFn?[13,26,39,52].map(g=>({x:g,v:goalFn(g)})).filter(g=>g.v!=null):[];
  const vals=pts.map(p=>p.v).concat(goals.map(g=>g.v));let lo=Math.min(...vals),hi=Math.max(...vals);if(lo===hi){lo-=1;hi+=1}
  // paso "redondo": segundos de 15 a 5 min para tiempos; 1-2-5 × 10ⁿ para números
  const raw=(hi-lo)/2,steps=isTime?[15,30,60,120,300,600]:[1,2,5].flatMap(m=>[-1,0,1,2,3].map(e=>m*Math.pow(10,e))).sort((a,b)=>a-b);
  const step=steps.find(x=>x>=raw)||steps[steps.length-1];lo=Math.floor(lo/step)*step;hi=Math.ceil(hi/step)*step;if(hi===lo)hi=lo+step;
  const ticks=[];for(let v=lo;v<=hi+1e-9;v+=step)ticks.push(v);
  const xmax=Math.max(52,...pts.map(p=>p.x)),X=x=>L+(x/xmax)*(W-L-R),Y=v=>T+(1-(v-lo)/(hi-lo))*(H-T-B);
  let g="";
  ticks.forEach(v=>{const y=Y(v);g+=`<line x1="${L}" x2="${W-R}" y1="${y}" y2="${y}" class="cg"/><text x="${L-6}" y="${y+4}" class="ct" text-anchor="end">${fx(v)}</text>`});
  [0,13,26,39,52].forEach(w=>{if(w<=xmax)g+=`<text x="${X(w)}" y="${H-6}" class="ct" text-anchor="middle">S${w}</text>`});
  goals.forEach(q=>{const x=X(q.x),y=Y(q.v);g+=`<g class="cgoal"><path d="M${x} ${y-5}L${x+5} ${y}L${x} ${y+5}L${x-5} ${y}Z"/><title>Meta semana ${q.x}: ${fx(q.v)}</title></g>`});
  if(pts.length>1)g+=`<path class="cl" d="${pts.map((p,i)=>(i?"L":"M")+X(p.x).toFixed(1)+" "+Y(p.v).toFixed(1)).join("")}"/>`;
  pts.forEach(p=>{const lab=`${fmtS(parse(p.k))}${p.w!=null?` · semana ${p.w}`:""}: ${fx(p.v)}`;g+=`<g class="cd" data-v="${esc(lab)}" tabindex="0" role="button" aria-label="${esc(lab)}"><circle class="hit" cx="${X(p.x)}" cy="${Y(p.v)}" r="14"/><circle cx="${X(p.x)}" cy="${Y(p.v)}" r="5"/><title>${esc(lab)}</title></g>`});
  const last=pts[pts.length-1];if(last){const x=X(last.x),y=Y(last.v),right=x>W-70;g+=`<text x="${right?x-9:x+9}" y="${y-8}" class="cv" text-anchor="${right?"end":"start"}">${fx(last.v)}</text>`}
  return `<svg viewBox="0 0 ${W} ${H}" class="chart" role="img">${g}</svg>`;
}

function fatigueRun(ref){const md=x=>(Store.days[iso(x)]||{}).mode,bad=m=>m==="cansado"||m==="dolor";
  let n=0,d=addDays(ref,0);const m0=md(d);if(m0&&!bad(m0))return 0;if(!m0)d=addDays(d,-1);
  for(let i=0;i<60&&n<30;i++){const m=md(d);if(bad(m))n++;else if(m)break;else{const p=planFor(d);if(!p||p.kind!=="descanso")break}d=addDays(d,-1)}
  return n}
function diaryHTML(){

function nowLineText(plan){
  const now=new Date(),td=today(),late=diffDays(td,now)!==0,m=now.getHours()*60+now.getMinutes()+(late?1440:0),sh=plan.shift,tm=t=>t.h?toMin(t.h)+(toMin(t.h)<240&&m>600?1440:0):null;
  const dd=Store.days[iso(td)]||{},items=plan.tasks.filter(t=>t.h&&t.id!=="noche").map(t=>({t,at:tm(t)})).sort((a,b)=>a.at-b.at);
  const lv=sh.leave?toMin(sh.leave):null,back=sh.back?toMin(sh.back)+(toMin(sh.back)<240?1440:0):null,atWork=lv!=null&&m>=lv&&m<back;
  // “Ahora” es solo la tarea de este momento (la última que empezó), si no está marcada y no estás en el trabajo
  const last=items.filter(x=>x.at<=m).pop(),nxt=items.find(x=>x.at>m),cur=!atWork&&last&&!taskDone(dd,last.t)&&m-last.at<=120?last:null;
  const missed=items.filter(x=>x.at<=m&&x!==cur&&x.t.kind!=="rutina"&&!taskDone(dd,x.t)).length;
  // de madrugada: lo que manda es dormir (con turno 16 se llega a las 0:30 y la cama es a la 1:15)
  // volviendo del turno que termina después de medianoche: lo que falta es la noche
  if(late)return `Vuelves del trabajo: comida liviana, visualización y a la cama a la ${sh.bed}. Mañana despiertas a las ${(SHIFT[(Store.days[iso(now)]||{}).turno||Store.cfg.turno]||sh).wake}.`;
  if(m<300){const ys=SHIFT[(Store.days[iso(addDays(now,-1))]||{}).turno||Store.cfg.turno]||sh,yb=toMin(ys.bed);
    return yb<300&&m<yb?`Vuelves del trabajo: a la cama a la ${ys.bed}. Hoy despiertas a las ${sh.wake}.`:`A dormir. Hoy despiertas a las ${sh.wake}.`}
  const parts=[],bed=sh.bed?toMin(sh.bed)+(toMin(sh.bed)<240?1440:0):null;
  if(bed!=null&&m>=bed&&m<bed+360)return `Hora de dormir: cama ${sh.bed}. Mañana se sigue.`+(missed?` (${missed===1?"1 tarea quedó":missed+" tareas quedaron"} sin marcar hoy)`:"");
  if(atWork)parts.push(`En el trabajo hasta las ${sh.back}`);
  if(cur)parts.push(`Ahora: ${cur.t.t} (${cur.t.h})`);
  if(nxt)parts.push(`Después: ${nxt.t.t} a las ${nxt.t.h}`);
  if(lv!=null&&m<lv){const r=lv-m;parts.push(`Sales al trabajo en ${r>=60?Math.floor(r/60)+" h "+pad(r%60)+" min":r+" min"} (${sh.leave})`)}
  if(missed)parts.push(`${missed===1?"1 tarea anterior quedó":missed+" tareas anteriores quedaron"} sin marcar`);
  return parts.join(" · ")||"Día terminado. A dormir a la hora.";
}

const isISO=x=>typeof x==="string"&&/^\d{4}-\d{2}-\d{2}$/.test(x)&&!isNaN(parse(x));
// revisa que el texto sea una copia sana antes de ofrecer restaurarla
function checkBackup(text){
  try{let d;try{d=JSON.parse(text)}catch(e){throw new Error("no se puede leer")}
    if(!d||d.app!=="bitacora-buzo-tactico"||!isObj(d.days)||!isObj(d.cfg))throw new Error("no es una copia de la bitácora");
    const bad=Object.keys(d.days).find(k=>!isISO(k)||!isObj(d.days[k]));if(bad!==undefined)throw new Error("hay un día dañado: "+String(bad).slice(0,20));
    const c=d.cfg;if(c.start!=null&&!isISO(c.start))throw new Error("la fecha de inicio está dañada");
    if(c.sched!=null&&(!Array.isArray(c.sched)||!c.sched.length||!c.sched.every(w=>Number.isInteger(w)&&w>=0&&w<=52)))throw new Error("el orden de las semanas está dañado");
    S.restore={data:d,n:Object.keys(d.days).length,when:d.exportedAt&&!isNaN(new Date(d.exportedAt))?fmt(new Date(d.exportedAt)):"fecha desconocida"}}
  catch(e){S.restore={err:"El archivo no es una copia válida de la bitácora ("+e.message+")."}}
  S.paste=false;render();const el=document.getElementById("respaldo");if(el)el.scrollIntoView({block:"center"});
}
function readBackup(file){
  const fr=new FileReader();
  fr.onload=()=>checkBackup(fr.result);
  fr.onerror=()=>{S.restore={err:"No se pudo abrir el archivo."};render()};
  fr.readAsText(file);
}
